"],["Birth Date","abt 1863"],["Birth Place","Philadelphia"],["Death Date","13 Sep 1938"],["Death Place","Philadelphia, Philadelphia, Pennsylvania, USA"],["Father","Michael Buckey"],["Mother","Helen Benty"],["Certificate Number","77436"]],"tables":[],"citation":"Pennsylvania Historical and Museum Commission; Harrisburg, PA, USA; Pennsylvania (State). Death Certificates, 1906-1968; Certificate Number Range: 076001-079000","people":["@R-eugenia-buchy@"],"link":"https://www.ancestry.com/search/collections/5164/records/3961205","external":"","credit":"Ancestry.com","src":"media/r/5164-42342_622204_0705-01746.jpg","thumb":"media/t/5164-42342_622204_0705-01746.jpg","w":2000,"h":1486},"r-5164-7463439":{"id":"r-5164-7463439","kind":"record","type":"Death certificate","coll":"Pennsylvania, U.S., Death Certificates, 1906-1974","title":"Pennsylvania, U.S., Death Certificates, 1906-1974","name":"Eugene Perret","year":1947,"fields":[["Name","Eugene Perret"],["Gender","Male"],["Race","White"],["Death Age","50"],["Birth Date","10 Feb 1897"],["Birth Place","Riverside, New Jersey"],["Death Date","3 Aug 1947"],["Death Place","Canaan, Wayne, Pennsylvania, USA"],["Father","Eugene Perret"],["Mother","Jenny Butchy"],["Certificate Number","74011"]],"tables":[],"citation":"Pennsylvania Historical and Museum Commission; Harrisburg, PA, USA; Pennsylvania (State). Death Certificates, 1906-1968; Certificate Number Range: 072451-075000","people":["@R-eugene-perret-1897@"],"link":"https://www.ancestry.com/search/collections/5164/records/7463439","external":"","credit":"Ancestry.com","src":"media/r/5164-42410_622204_0739-02342.jpg","thumb":"media/t/5164-42410_622204_0739-02342.jpg","w":2000,"h":1519},"r-5164-5552991":{"id":"r-5164-5552991","kind":"record","type":"Death certificate","coll":"Pennsylvania, U.S., Death Certificates, 1906-1974","title":"Pennsylvania, U.S., Death Certificates, 1906-1974","name":"Alphonse Perret","year":1946,"fields":[["Name","Alphonse Perret"],["Gender","Male"],["Race","White"],["Death Age","47"],["Birth Date","18 Nov 1898"],["Birth Place","Riverside, New Jersey"],["Death Date","4 Apr 1946"],["Death Place","Philadelphia, Philadelphia, Pennsylvania, USA"],["Father","Eugene Perret"],["Mother","Eugenia Buchy"],["Spouse","Elizabeth"],["Certificate Number","38096"]],"tables":[],"citation":"Pennsylvania Historical and Museum Commission; Harrisburg, PA, USA; Pennsylvania (State). Death Certificates, 1906-1968; Certificate Number Range: 037801-040500","people":["@R-alphonse-perret@"],"link":"https://www.ancestry.com/search/collections/5164/records/5552991","external":"","credit":"Ancestry.com","src":"media/r/5164-42410_2421406272_0847-00437.jpg","thumb":"media/t/5164-42410_2421406272_0847-00437.jpg","w":2000,"h":1498},"r-5164-1962801":{"id":"r-5164-1962801","kind":"record","type":"Death certificate","coll":"Pennsylvania, U.S., Death Certificates, 1906-1974","title":"Pennsylvania, U.S., Death Certificates, 1906-1974","name":"Margaret Hance","year":1913,"fields":[["Name","Margaret Hance [Margaret McAvoy]"],["Gender","Female"],["Race","White"],["Death Age","39"],["Birth Date","abt 1874"],["Birth Place","Philadelphia, Pennsylvania"],["Death Date","18 Sep 1913"],["Death Place","Philadelphia, Philadelphia, Pennsylvania, USA"],["Father","Dennis McAvoy"],["Mother","Rose Bradley"],["Certificate Number","96460"]],"tables":[],"citation":"Pennsylvania Historical and Museum Commission; Harrisburg, PA, USA; Pennsylvania (State). Death Certificates, 1906-1968; Certificate Number Range: 095831-099380","people":["@R-margaret-mcavoy@"],"link":"https://www.ancestry.com/search/collections/5164/records/1962801","external":"","credit":"Ancestry.com","src":"media/r/5164-41381_620305176_0825-00638.jpg","thumb":"media/t/5164-41381_620305176_0825-00638.jpg","w":2000,"h":1826}},"lines":[{"key":"harkins","title":"Harkins","who":"@I342194601955@","origins":["Philadelphia","Ireland"],"story":"The Harkinses were Philadelphians. Thomas M. Harkins (1888–1943) was the son of William Harkins (1859–1938) and his first wife Anna, and William's parents, William Harkins and Anna Regent, were born in the city too. In 1900 Thomas was living with his father, his sister Mary and his brothers George and Phillip on Stampers Lane in South Philadelphia; by 1910 William had remarried, to Katherine Garrity. Thomas worked as an engineer for a stevedoring firm and married Helen Morley in 1913. Helen's parents, James and Mary Morley, were both born in Ireland; James came over in 1871, and in 1900 he was a laborer on Manton Street with Helen and her brothers. Thomas Jr. grew up in Philadelphia's 36th Ward, served in World War II and died in Cherry Hill in 2003. Ancestry attaches Thomas to the Harkinses of Wilmington, Delaware, who came from County Tyrone, but his death certificate shows they're a different family.","people":["@R-william-harkins-1859@","@I342198302222@","@I342198309762@","@I342198309806@"]},{"key":"perret","title":"Perret","who":"@I342198310332@","origins":["Switzerland","France","Philadelphia"],"story":"Mary Frances Perret was born in Philadelphia in 1920, the oldest child of Joseph H. Perret and Mary Martin, who took out their marriage license there on 8 July 1919. Joseph (1895–1962) was the son of Henry Eugene Perret, a Swiss watch case maker who came to America in 1880, and Eugenia Buchy, born in Philadelphia to French parents; in 1900 the family was living in Riverside, New Jersey; Henry Eugene probably died in Philadelphia in 1904. Mary Martin's parents were Eugene Joseph Martin and Mary Ann McAvoy (1880–1950), daughter of Dennis McAvoy and Rose Bradley. Mary Frances's youngest brother, Gene Perret (1937–2022), became an Emmy-winning comedy writer for The Carol Burnett Show and Bob Hope.","people":["@I342198310488@","@R-henry-eugene-perret@","@I342198311003@","@I342198310493@"]},{"key":"dymond","title":"Dymond","who":"@I342198307183@","origins":["Dutchess County, NY","Connecticut","Alsace","Germany"],"story":"Glen A. Dymond Jr. was born in Scranton in 1926 and lost his mother, Marjorie Schuler, when he was two. Marjorie's father, Fred Schuler, was the son of German immigrants John Schuler and Margaret Sames and worked for the Delaware, Lackawanna & Western Railroad in Scranton; her mother, Helen Carney, was born in Ireland. Glen Jr. lived in Queens, Scranton and Hartsville, South Carolina, served in the Navy in 1944 and settled in South Jersey. His father, Glen Austin Dymond Sr., was born in Lockville, later worked in stores in Raleigh and Asheville, and is buried near Asheville. Glen Sr.'s father Wayman left the family: the farm was sold at sheriff's sale in 1909 and where he ended up isn't known. The Dymonds go back through Lockville and Dymond Hollow in Exeter Township, PA, to Matthew Dymond Sr., born 1740 in Dutchess County, NY. Side branches reach colonial Connecticut (Whitlock, Strong, Hide) and Pennsylvania Germans from Alsace (Eyer, Werkheiser, Trautmann). This is the deepest part of the tree, back to about 1600.","people":["@I342198310990@","@I342198310890@","@I342201042904@","@R-john-strong@"]},{"key":"henwood","title":"Henwood","who":"@I342198741673@","origins":["Germany","France","Derbyshire, England","County Donegal"],"story":"Margaret Henwood is one of at least 11 children of Abraham Edward Henwood and Agnes Dougherty. The Henwoods trace to Abraham Henwood, born in Germany in 1784, a carter in Southwark who served in the War of 1812 militia and died in Philadelphia in 1855. His son William married Mary Jolley at Trinity Episcopal in Southwark in 1844; the Jolleys came from Derbyshire, England. Abraham Edward's mother, Emily Tatu, was the daughter of French immigrants Joseph Tatu and Louise Brodenbraugh. Agnes's parents, Miles Dougherty of County Donegal and Margaret Roarty, came from Ireland around 1874 and settled in Easton, PA, where Miles worked as a foundry moulder until he died on Christmas Day 1927.","people":["@I342202235553@","@R-joseph-tatu@","@I342198785512@","@I342198785508@"]}],"issues":[],"leads":[{"title":"Trace William Harkins Sr. and Anna Regent","body":"William Harkins (1859–1938)'s death certificate names his parents as William Harkins and Anna Regent, both born in Philadelphia. The 1860, 1870 and 1880 censuses should show the family and where William Sr.'s own parents came from. A William Harkins, oysterman, is listed on S. Front St. by Moore St. in 1857, 1867 and 1871, around the corner from where William lived in 1910. The 1870 census has Harkinses in the 1st Ward, which took in Front and Moore, and a Wm. J. Harkins of about the right age in the 20th Ward (William's funeral record calls him William J.); none of those pages has been checked yet. No William and Anna turned up in 1880. Thomas's mother Anna also needs a maiden name and a death date; she was gone from the household by 1900. A Philadelphia Inquirer death notice for William in February 1938 may name the rest of his children.","people":["@R-william-harkins-1859@","@R-william-harkins-sr@","@R-anna-harkins@"]},{"title":"Confirm Mary Martin's father","body":"Find a Grave names Mary Martin Perret's parents as Eugene Joseph Martin (1869–1960) and Mary Ann McAvoy, married in 1898. The application for Mary's 8 July 1919 marriage license names both her parents and is on FamilySearch with a free account; the 1900 and 1910 Philadelphia censuses should show the Martin household.","people":["@I342198310489@","@R-eugene-martin@","@I342198311003@"]},{"title":"Find where Henry Eugene Perret came from","body":"He was born in Switzerland in March 1858, came over in 1880 and had filed his first naturalization papers by 1900, when he made watch cases in Riverside, NJ. Those papers or a passenger list would name his home town. He's probably the Eugene Perret, an engraver, buried at Most Holy Redeemer Cemetery in Philadelphia in June 1904, in a lot with a Buchy child; his death certificate would settle it. He's probably also the Swiss-born Eugene Perret in New York City in the 1880 census, whose record page would give an address and a trade.","people":["@R-henry-eugene-perret@","@R-eugenia-buchy@"]},{"title":"Find a death record for Helen Morley Harkins","body":"She still has no firm death date, and no memorial at Holy Cross, where her husband Thomas and her parents are buried. The Social Security Death Index has possible matches; an obituary would confirm one and give a burial place.","people":["@I342198302220@"]},{"title":"Find Marjorie Schuler's grave","body":"Her death certificate gives her burial as Calvary Cemetery, with the town unclear; the Dymond family genealogy says Olyphant. Her parents, Fred Schuler and Helen Carney, are buried in Dunmore Cemetery. Her sister Ruth, born about 1909, is still to be traced.","people":["@I342198309705@","@I342198310890@","@I342198310928@"]},{"title":"Find Mary Booth's parents","body":"Published Connecticut genealogies confirmed the Whitlock and Strong lines and added a generation to each, but showed that the Booth, Hollister and Treat ancestors belonged to a different family, so they're off the site. Mary was born about 1799 in Ulster County, New York, where her husband Joseph Dymond Sr. was also born. Most other facts before 1850 on the Dymond side still have no sources.","people":["@I342200912332@","@I342200912324@"]}],"public":true,"mediaBase":""};</script>
<script>/* core.js */
/* core.js: the shared foundation every module uses.
   Loads first. Declares top-level helpers (el, years, avatar, icon, ...) and the App namespace.
   See tools/site/README.md for the module contract. */

const App = {
  P: D.people || {},
  ROOT: D.root,
  state: { focus: D.root, selected: null, view: "chart", media: null },
};
const P = App.P;

const LINE_NAMES = {
  harkins: "Harkins line", perret: "Perret line", dymond: "Dymond line", henwood: "Henwood line",
  self: "Immediate family", none: "",
};
const LINE_KEYS = ["harkins", "perret", "dymond", "henwood"];
const KIND_LABELS = { photo: "Photo", headstone: "Headstone", document: "Document", story: "Story", record: "Record" };

/* ------------------------------------------------------------------ storage (never throws) */
const store = {
  get(key, fallback = null) {
    try { const v = localStorage.getItem(key); return v == null ? fallback : v; } catch (e) { return fallback; }
  },
  set(key, value) {
    try { if (value == null) localStorage.removeItem(key); else localStorage.setItem(key, String(value)); } catch (e) { /* private mode */ }
  },
};

/* ------------------------------------------------------------------ events */
const listeners = {};
App.on = (evt, fn) => {
  (listeners[evt] ||= []).push(fn);
  return () => App.off(evt, fn);
};
App.off = (evt, fn) => {
  const list = listeners[evt];
  if (list) listeners[evt] = list.filter(f => f !== fn);
};
// each listener runs in its own try/catch, so one module's bug can't break another
App.emit = (evt, payload) => {
  for (const fn of (listeners[evt] || []).slice()) {
    try { fn(payload); } catch (err) { console.error(`[App] "${evt}" listener failed:`, err); }
  }
};

/* ------------------------------------------------------------------ DOM builder */
/* el(tag, props, ...children)
   props: class, text, html (trusted strings only), style (cssText string or object), on<event> (function),
   dataset (object), anything else becomes an attribute (true -> "", false/null -> skipped).
   children: nodes, strings, numbers, arrays (flattened); null/false/"" are skipped. */
function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = Array.isArray(v) ? v.filter(Boolean).join(" ") : v;
    else if (k === "text") n.textContent = v;
    else if (k === "html") n.innerHTML = v;
    else if (k === "style") {
      if (typeof v === "string") n.style.cssText = v;
      else for (const [sk, sv] of Object.entries(v)) if (sv != null) sk.startsWith("--") ? n.style.setProperty(sk, sv) : (n.style[sk] = sv);
    } else if (k === "dataset") Object.assign(n.dataset, v);
    else if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2).toLowerCase(), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false || c === "") continue;
    n.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return n;
}
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

/* ------------------------------------------------------------------ people */
const isHidden = p => !!(D.public && p && p.living);
const lineColor = p => `var(--${(p && p.line) || "none"})`;
const SUFFIX = /^(sr|jr|junior|senior|ii|iii|iv|v)\.?$/i;
function nameWords(p) {
  return String((p && p.name) || "").replace(/\(.*?\)/g, " ").split(/\s+/).filter(w => w && !SUFFIX.test(w.replace(/,$/, "")));
}
function firstName(p) {
  return nameWords(p)[0] || (p && p.name) || "";
}
function initials(p) {
  const words = nameWords(p);
  if (!words.length) return "?";
  const surname = String((p && p.surname) || "").trim();
  const last = surname && words.some(w => w === surname.split(/\s+/)[0]) ? surname : words[words.length - 1];
  const first = words[0];
  const a = first.charAt(0), b = words.length > 1 || surname ? last.charAt(0) : "";
  return (a + (first === last ? "" : b)).toUpperCase();
}
/* "1888–1943", "b. 1926", "d. 1901", "1850–?", "Living" (or "" when nothing is known) */
function years(p) {
  if (!p) return "";
  if (isHidden(p)) return "Living";
  const by = p.by || null, dy = p.dy || null;
  if (p.living) return by ? `b. ${by}` : "Living";
  if (by && dy) return `${by}–${dy}`;
  if (dy) return `d. ${dy}`;
  if (by) return by < 1925 ? `${by}–?` : `b. ${by}`;
  return "";
}
/* shorten "Philadelphia, Philadelphia, Pennsylvania, USA" to "Philadelphia, Pennsylvania" */
function shortPlace(place) {
  if (!place) return "";
  const parts = String(place).split(",").map(s => s.trim()).filter(Boolean)
    .filter(s => !/^(usa|united states( of america)?|u\.s\.a\.?)$/i.test(s));
  const out = [];
  for (const s of parts) if (!out.includes(s)) out.push(s);
  return out.slice(0, 2).join(", ");
}
const findEvent = (p, ...tags) => {
  for (const t of tags) { const e = (p.ev || []).find(x => x.tag === t && (x.date || x.place)); if (e) return e; }
  return null;
};
/* "Born 26 Nov 1888, Philadelphia, Pennsylvania · Died 23 Jun 1943, Philadelphia, Pennsylvania"
   Falls back to baptism/burial. Returns "" when nothing is recorded; "Living" for hidden people. */
function lifeLine(p) {
  if (!p) return "";
  if (isHidden(p)) return "Living";
  const fmt = (label, e) => e ? `${label} ${[e.date, shortPlace(e.place)].filter(Boolean).join(", ")}` : null;
  const b = findEvent(p, "BIRT") ? fmt("Born", findEvent(p, "BIRT")) : fmt("Baptized", findEvent(p, "CHR", "BAPM"));
  const d = p.living ? null : findEvent(p, "DEAT") ? fmt("Died", findEvent(p, "DEAT")) : fmt("Buried", findEvent(p, "BURI"));
  return [b, d].filter(Boolean).join(" · ");
}

/* ------------------------------------------------------------------ media */
const hasOwn = (obj, key) => !!obj && Object.prototype.hasOwnProperty.call(obj, key);
/* own keys only, so "constructor" or "__proto__" in a URL never resolve to Object.prototype members */
const media = mid => (mid && D.media && hasOwn(D.media, mid) ? D.media[mid] : undefined);
/* the person's media, in their order; kinds = "photo" or ["photo", "headstone"] to filter. [] for hidden people. */
function personMedia(pid, kinds) {
  const p = P[pid];
  if (!p || isHidden(p)) return [];
  const want = kinds == null ? null : new Set([].concat(kinds));
  return (p.media || []).map(media).filter(m => m && (!want || want.has(m.kind)));
}
const mediaUrl = path => path || "";
function kindLabel(m) {
  if (!m) return "";
  if (m.kind === "record") return m.type || "Record";
  if (m.file === "pdf") return "PDF document";
  return KIND_LABELS[m.kind] || "Item";
}
/* the image to show in a small square for a person, or null */
function photoOf(p) {
  if (!p || isHidden(p) || !p.photo) return null;
  const m = media(p.photo);
  const url = m && (m.thumb || (m.file !== "pdf" && m.src));
  return url ? { m, url: mediaUrl(url) } : null;
}

/* ------------------------------------------------------------------ avatar */
/* avatar(p, {size = 40, cls = "", decorative = false}) -> <span class="avatar is-photo|is-mono ..."> square, framed
   with a 1px rule. Photo: <img> (object-fit: cover, object-position: p.photoPos, lazy, alt = name); a broken image
   falls back to the monogram. Monogram: the initials in the line color on a low-opacity tint. Hidden people get a
   monogram. decorative: true when the name is printed right beside it (inside the same button or link), so screen
   readers don't hear it twice: the img gets alt="" and the monogram aria-hidden, with no role or label. */
function avatar(p, { size = 40, cls = "", decorative = false } = {}) {
  const box = el("span", {
    class: ["avatar", cls, isHidden(p) && "is-living"],
    style: { "--av": `${size}px`, "--lc": lineColor(p) },
    dataset: decorative ? { pid: (p && p.id) || "", decorative: "true" } : { pid: (p && p.id) || "" },
  });
  const mono = () => {
    box.classList.remove("is-photo");
    box.classList.add("is-mono");
    box.replaceChildren(el("span", { class: "avatar-initials", "aria-hidden": "true", text: initials(p) }));
    if (decorative) box.setAttribute("aria-hidden", "true");
    else {
      box.setAttribute("role", "img");
      box.setAttribute("aria-label", (p && p.name) || "Unknown");
    }
  };
  const photo = photoOf(p);
  if (photo) {
    box.classList.add("is-photo");
    const img = el("img", {
      src: photo.url, alt: decorative ? "" : p.name, loading: "lazy", decoding: "async", draggable: "false",
      style: p.photoPos ? { objectPosition: p.photoPos } : null,
    });
    img.addEventListener("error", mono, { once: true });
    box.append(img);
  } else mono();
  return box;
}

/* icon(name, size = 20) -> <svg class="icon icon-NAME"> (aria-hidden). Unknown names give an empty square. */
function icon(name, size = 20) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("width", size);
  svg.setAttribute("height", size);
  svg.setAttribute("fill", "none");
  svg.setAttribute("stroke", "currentColor");
  svg.setAttribute("stroke-width", "1.75");
  svg.setAttribute("stroke-linecap", "square");
  svg.setAttribute("stroke-linejoin", "miter");
  svg.setAttribute("aria-hidden", "true");
  svg.setAttribute("focusable", "false");
  svg.setAttribute("class", `icon icon-${name}`);
  svg.style.setProperty("--icon-size", `${size}px`);
  svg.innerHTML = ICONS[name] || '<rect x="5" y="5" width="14" height="14"/>';
  return svg;
}

/* ------------------------------------------------------------------ search */
const fold = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9\s-]/g, " ").replace(/\s+/g, " ").trim();
let searchIndex = null;
function buildSearchIndex() {
  searchIndex = Object.values(P).map(p => {
    const name = fold(p.name);
    return {
      id: p.id, name, words: name.split(" "),
      surname: fold(p.surname),
      place: isHidden(p) ? "" : fold(p.bp),
      yrs: isHidden(p) ? "" : [p.by, p.dy].filter(Boolean).join(" "),
      // tie-breaks: direct ancestors and close relatives first, unconnected people last
      boost: (p.id === App.ROOT ? 6 : 0) + (p.ahn ? 4 - Math.min(3, (p.gen || 0) / 3) : 0) + (p.line === "none" ? -3 : 0),
    };
  });
}
/* search(q, limit = 8) -> [pid], ranked: full-name prefix, word prefixes, name substring, then birthplace and years.
   Ignores accents and case. Every query word must match somewhere. */
function search(q, limit = 8) {
  const query = fold(q);
  if (!query) return [];
  if (!searchIndex) buildSearchIndex();
  const terms = query.split(" ");
  const scored = [];
  for (const it of searchIndex) {
    let score = 0, ok = true;
    if (it.name.startsWith(query)) score += 120;
    else if (it.words.some(w => w.startsWith(query))) score += 90;
    for (const t of terms) {
      let s = 0;
      const wi = it.words.findIndex(w => w.startsWith(t));
      if (wi === 0) s = 40;
      else if (wi > 0) s = it.surname && it.surname.startsWith(t) ? 40 : 30;
      else if (it.name.includes(t)) s = 18;
      else if (it.place && it.place.split(" ").some(w => w.startsWith(t))) s = 10;
      else if (it.yrs && it.yrs.split(" ").some(y => y.startsWith(t))) s = 8;
      if (!s) { ok = false; break; }
      score += s;
    }
    if (ok) scored.push([score + it.boost, it]);
  }
  scored.sort((a, b) => b[0] - a[0] || a[1].name.localeCompare(b[1].name));
  return scored.slice(0, limit).map(([, it]) => it.id);
}
App.on("media", () => { searchIndex = null; });

/* ------------------------------------------------------------------ misc */
const PHONE_QUERY = window.matchMedia("(max-width: 699px)");
const isPhone = () => PHONE_QUERY.matches;
const plural = (n, one, many = one + "s") => `${n} ${n === 1 ? one : many}`;
const bareId = pid => String(pid || "").replace(/^@|@$/g, "");
/* accepts "@I123@", "I123" or "R-name" and returns the pid in D.people, or null */
const PID_RE = /^@[A-Za-z0-9-]+@$/;
function resolvePid(id) {
  if (!id) return null;
  const s = String(id);
  if (PID_RE.test(s) && hasOwn(P, s)) return s;
  const wrapped = `@${bareId(s)}@`;
  return PID_RE.test(wrapped) && hasOwn(P, wrapped) ? wrapped : null;
}

/* toast(msg, {kind = "info" | "ok" | "error", timeout = 4500}) */
function toast(msg, { kind = "info", timeout } = {}) {
  let stack = document.getElementById("toasts");
  if (!stack) { stack = el("div", { class: "toast-stack", id: "toasts", "aria-live": "polite" }); document.body.append(stack); }
  const t = el("div", { class: `toast is-${kind}`, role: kind === "error" ? "alert" : "status" },
    kind === "ok" ? icon("check", 18) : kind === "error" ? icon("info", 18) : null,
    el("span", { text: msg }),
    el("button", { class: "toast-close", type: "button", "aria-label": "Dismiss", onclick: () => leave() }, icon("close", 16)));
  let gone = false;
  const leave = () => {
    if (gone) return;
    gone = true;
    t.classList.add("is-leaving");
    setTimeout(() => t.remove(), 260);
  };
  stack.append(t);
  while (stack.children.length > 3) stack.firstElementChild.remove();
  setTimeout(leave, timeout || (kind === "error" ? 7000 : 4500));
  return t;
}

/* ------------------------------------------------------------------ router */
/* The hash is "#/<id>" (the pid without its @s) or "#/<id>/m/<mid>" while the viewer is open.
   Each history entry also carries {focus, selected} so back/forward restore exactly what was shown. */
const reducedMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const hashFor = (pid, mid) => `#/${encodeURIComponent(bareId(pid))}${mid ? `/m/${encodeURIComponent(mid)}` : ""}`;
const historyEntry = extra => ({ hft: 1, focus: App.state.focus, selected: App.state.selected, ...extra });
function writeHistory(hash, entry, replace) {
  try {
    if (replace) history.replaceState(entry, "", hash);
    else history.pushState(entry, "", hash);
  } catch (e) { /* some sandboxed frames refuse history writes */ }
}
function parseHash(h = location.hash) {
  if (!h || !h.startsWith("#/")) return null;
  const parts = h.slice(2).split("/").map(s => { try { return decodeURIComponent(s); } catch (e) { return s; } });
  return { pid: resolvePid(parts[0]), mid: parts[1] === "m" && parts[2] ? parts[2] : null };
}

/* App.go(pid, {focus = true, select = true, replace = false, scroll = false})
   focus: re-center the tree on pid ("focus" event). select: open the person panel on pid ("select" event).
   replace: don't add a history entry. scroll: bring the tree section into view.
   Closes the viewer if it is open. Returns false for an unknown pid. */
App.go = (id, { focus = true, select = true, replace = false, scroll = false } = {}) => {
  const pid = resolvePid(id);
  if (!pid) { console.warn("[App.go] unknown person:", id); return false; }
  if (App.state.media) {
    App.state.media = null;
    try { App.viewer && App.viewer.close && App.viewer.close(); } catch (err) { console.error("[App.go] viewer.close failed:", err); }
  }
  const before = { focus: App.state.focus, selected: App.state.selected };
  if (focus) App.state.focus = pid;
  if (select) App.state.selected = pid;
  const hash = hashFor(pid);
  const unchanged = before.focus === App.state.focus && before.selected === App.state.selected && location.hash === hash;
  writeHistory(hash, historyEntry(), replace || unchanged);
  // scroll first: the phone sheet's scroll lock (added on "select") would otherwise freeze a long glide halfway
  if (scroll) App.scrollToTree();
  if (focus) App.emit("focus", pid);
  if (select) App.emit("select", pid);
  return true;
};

/* App.select(pid|null): change the selection without moving the tree. App.select(null) closes the person panel. */
App.select = id => {
  const pid = id == null ? null : resolvePid(id);
  if (id != null && !pid) return false;
  if (pid) return App.go(pid, { focus: false });
  App.state.selected = null;
  writeHistory(hashFor(App.state.focus), historyEntry(), true);
  App.emit("select", null);
  return true;
};

/* the tree section sits directly under the sticky bar, so "scroll to the tree" is "scroll to the top".
   It glides only for short distances on wider screens; from deep in the page (or on a phone) it jumps, since a
   long smooth scroll runs behind the person sheet that opens right after. html has scroll-behavior: smooth,
   so a jump has to switch that off for the moment ("auto" alone would still glide). */
App.scrollToTree = () => {
  const y = window.scrollY || document.documentElement.scrollTop || 0;
  if (!y) return;
  if (!reducedMotion() && !isPhone() && y <= window.innerHeight) { window.scrollTo({ top: 0, behavior: "smooth" }); return; }
  jumpScroll(() => window.scrollTo({ top: 0, behavior: "instant" }));
};
/* jumpScroll(fn): run fn's scrolling with no glide, whatever html's scroll-behavior says. The style is flushed
   before fn runs, since a scroll reads the computed value (and "instant" isn't known to every browser). */
function jumpScroll(fn) {
  const html = document.documentElement, was = html.style.scrollBehavior;
  html.style.scrollBehavior = "auto";
  void getComputedStyle(html).scrollBehavior;
  try { fn(); } finally { html.style.scrollBehavior = was; }
}

/* App.openMedia(mid, list?): open the viewer on mid. list = [mid, ...] for prev/next; it defaults to the media
   of the selected person (if they're in the item) or the item's first person. Without a viewer module it opens
   the file in a new tab, or shows a toast. */
App.openMedia = (mid, list) => {
  const m = media(mid);
  if (!m) { toast("That photo or document isn't available.", { kind: "error" }); return false; }
  const people = (m.people || []).filter(pid => hasOwn(P, pid));
  // whose media to step through: the selected person when the item is theirs, else the item's first person
  const owner = people.includes(App.state.selected) ? App.state.selected : people[0] || App.state.focus;
  if (!Array.isArray(list) || !list.length) {
    list = personMedia(owner).map(x => x.id);
    if (!list.includes(mid)) list = [mid];
  }
  if (App.viewer && typeof App.viewer.open === "function") {
    const wasOpen = !!App.state.media;
    App.state.media = mid;
    // the hash keeps naming the person on screen (the panel), so a reload or a shared link shows the same thing
    const shown = App.state.selected || App.state.focus;
    writeHistory(hashFor(shown, mid), historyEntry({ media: mid, pushed: !wasOpen || !!(history.state && history.state.pushed) }), wasOpen);
    try { App.viewer.open(mid, list); return true; } catch (err) {
      console.error("[App.openMedia] viewer.open failed:", err);
      App.state.media = null;
    }
  }
  const url = m.src || m.link || m.external;
  if (url) { window.open(mediaUrl(url), "_blank", "noopener"); return true; }
  toast("The viewer isn't available on this page.");
  return false;
};
/* for the viewer: call when prev/next changes the shown item (updates the hash in place) */
App.mediaShown = mid => {
  if (!media(mid)) return;
  App.state.media = mid;
  const parsed = parseHash();
  const owner = (parsed && parsed.pid) || App.state.selected || App.state.focus;
  writeHistory(hashFor(owner, mid), historyEntry({ media: mid, pushed: !!(history.state && history.state.pushed) }), true);
};
/* for the viewer: call when it closes itself (× or Escape). Pops the viewer's history entry. */
App.mediaClosed = () => {
  if (!App.state.media) return;
  App.state.media = null;
  if (history.state && history.state.media && history.state.pushed) history.back();
  else writeHistory(hashFor(App.state.selected || App.state.focus), historyEntry(), true);
};

/* "#/I999" (or a local-only person on the public page): say so, and put back the hash of what is on screen */
const NOT_HERE = "That person isn't on this page.";
function rejectHash() {
  toast(NOT_HERE);
  writeHistory(hashFor(App.state.selected || App.state.focus, App.state.media), historyEntry(App.state.media ? { media: App.state.media } : {}), true);
}
/* back/forward and hand-edited hashes run through here */
function route() {
  const parsed = parseHash() || { pid: null, mid: null };
  const st = history.state && history.state.hft ? history.state : null;
  if (!st && !parsed.pid && location.hash.startsWith("#/")) { rejectHash(); return; }
  if (!parsed.pid && !st) return;             // "#lines" and other section anchors
  const focus = resolvePid(st && st.focus) || parsed.pid || App.state.focus;
  const selected = st ? resolvePid(st.selected) : parsed.pid;
  if (!st) writeHistory(location.hash, { hft: 1, focus, selected, media: parsed.mid || undefined }, true);
  if (focus !== App.state.focus) { App.state.focus = focus; App.emit("focus", focus); }
  if (selected !== App.state.selected) { App.state.selected = selected; App.emit("select", selected); }
  const mid = parsed.mid && media(parsed.mid) ? parsed.mid : null;
  if (parsed.mid && !mid) {
    toast("That photo or document isn't on this page.");
    writeHistory(hashFor(selected || focus), { hft: 1, focus, selected }, true);
  }
  if (mid && App.viewer && App.viewer.open) {
    if (App.state.media !== mid) {
      App.state.media = mid;
      const owner = parsed.pid || focus;
      const list = personMedia(owner).map(x => x.id);
      try { App.viewer.open(mid, list.includes(mid) ? list : [mid]); } catch (err) { console.error("[router] viewer.open failed:", err); }
    }
  } else if (App.state.media) {
    App.state.media = null;
    try { App.viewer && App.viewer.close && App.viewer.close(); } catch (err) { console.error("[router] viewer.close failed:", err); }
  }
}
window.addEventListener("popstate", route);
window.addEventListener("hashchange", route);

/* called once by app.js after the modules are mounted: applies the hash the page was opened with */
App.startRouter = () => {
  const parsed = parseHash();
  if (parsed && parsed.pid) {
    App.state.focus = parsed.pid;
    App.state.selected = parsed.pid;
    writeHistory(hashFor(parsed.pid), historyEntry(), true);
    App.emit("focus", parsed.pid);
    App.emit("select", parsed.pid);
    if (parsed.mid && !media(parsed.mid)) toast("That photo or document isn't on this page.");
    // only with a viewer: without one, openMedia would try to open a new tab on page load
    else if (parsed.mid && App.viewer && App.viewer.open) App.openMedia(parsed.mid);
  } else {
    App.state.focus = App.ROOT;
    App.state.selected = null;
    // a person link that names nobody here (a typo, or someone only on the local copy): say so and drop it
    const bad = !!parsed;
    try { history.replaceState(historyEntry(), "", bad ? location.pathname + location.search : undefined); } catch (e) { /* ignore */ }
    App.emit("focus", App.ROOT);
    if (bad) toast(NOT_HERE);
  }
};

/* the element where a view puts its toolbar controls: App.toolbar("chart") -> #chart-tools */
App.toolbar = view => document.getElementById(`${view}-tools`);

</script>
<script>/* chart.js */
/* chart.js: the left-to-right pedigree chart (App.chart).
   The focus sits on the left, parents to the right, then grandparents and so on. Every direct-line person is
   drawn with their sibling group stacked in the same column (a father's siblings above him, a mother's below
   her), the focus's children fill one column to the left (an hourglass) and the focus's spouses sit as slim
   rows right under the focus card.
   Layout is a contour-based tidy tree (no overlaps, compact). Cards are keyed by pid and tweened between
   layouts with one rAF loop that also redraws the connectors, so lines follow the cards as they move.
   Pan and zoom only change the stage transform. */
(() => {
  /* ---------------------------------------------------------------- geometry */
  const G = {
    CW: 240, CH: 64,      // direct-line card
    FW: 280, FH: 80,      // the focus card
    RH: 30, RGAP: 4,      // sibling rows and the gap between them
    SPH: 32,              // spouse rows under the focus card
    BGAP: 6,              // between a card and its sibling block
    COLGAP: 64,           // horizontal gap between generation columns (connectors live here)
    PGAP: 10,             // between a father's and a mother's card
    SGAP: 18,             // between neighbouring subtrees in deeper columns
    KGAP: 10,             // between children cards
    BRACKET: 12,          // sibling bracket, this far right of the column
    MAXSIBS: 4,           // rows shown before "+N more" (the focus and the parents)
    MAXSIBS_DEEP: 2,      // ... and for grandparents and beyond, so the first view stays compact
  };
  const GENS = [3, 4, 5, 6, Infinity];
  // touch screens get taller slim rows (and bigger expand tabs), so fingers hit the row they aim for
  const COARSE = window.matchMedia("(pointer: coarse)");
  const EXPW = () => (COARSE.matches ? 42 : 34);       // how far an expand tab reaches past its card
  const ZMIN = 0.25, ZMAX = 2;
  const DUR = 420;                       // card tween
  const GLIDE = 480;                     // camera glide after a refocus
  const reduced = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const colX = d => d < 0 ? -(G.CW + G.COLGAP) : d === 0 ? 0 : G.FW + G.COLGAP + (d - 1) * (G.CW + G.COLGAP);
  const colW = d => d === 0 ? G.FW : G.CW;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;     // ease-in-out cubic
  const easeOut = t => 1 - Math.pow(1 - t, 3);

  /* ---------------------------------------------------------------- state */
  const S = {
    mounted: false,
    host: null, root: null, viewport: null, stage: null, svg: null, edgeLayer: null, hlLayer: null, nodeLayer: null,
    header: null, legend: null, hint: null, tools: {},
    focus: null, pending: null,
    gens: GENS.includes(+store.get("hft.chart.gens")) ? +store.get("hft.chart.gens")
      : store.get("hft.chart.gens") === "all" ? Infinity : 4,
    sibs: store.get("hft.chart.sibs") !== "off",
    expanded: new Set(),       // pids whose hidden ancestry is revealed (two more generations)
    openGroups: new Set(),     // sibling groups showing everyone ("+6 more" opened)
    lines: new Set(),          // legend lines being highlighted
    layout: null,              // the current layout (see layoutChart)
    views: new Map(),          // key -> {el, card, data, g:{x,y,w,h,o}, f, t, leaving}
    edges: new Map(),          // id -> {el, def, leaving}
    cam: { x: 0, y: 0, k: 1 },
    size: { w: 0, h: 0 },
    tween: null, camTween: null, raf: 0, camRaf: 0,
    selected: null, cursor: null, traceKey: null,
    stats: { layoutMs: 0, nodes: 0 },
    interacted: false,
    // "fan": every column packed as close as it can get to the cards it hangs from (see fanOut);
    // "stair": ancestors level with their inner parent; "center": classic midpoint (both contour-based)
    layoutMode: "fan",
  };

  /* ---------------------------------------------------------------- people helpers */
  const person = pid => (pid && P[pid]) || null;
  // birth order; people without a year keep their GEDCOM order after the dated ones
  function birthOrder(ids) {
    return ids.filter(id => P[id]).map((id, i) => ({ id, i, by: isHidden(P[id]) ? null : P[id].by }))
      .sort((a, b) => ((a.by == null) - (b.by == null)) || (a.by - b.by) || (a.i - b.i)).map(o => o.id);
  }
  const marriageYear = fam => {
    const m = /\b(1[5-9]\d\d|20\d\d)\b/.exec((fam && fam.marr) || "");
    return m ? m[1] : "";
  };
  const ordinal = n => {
    const s = ["th", "st", "nd", "rd"], v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  };
  function generationLabel(d, focusP) {
    if (d < 0) return "Children";
    if (d === 0) return !focusP ? "In focus" : focusP.id === App.ROOT ? (focusP.rel || "You") : firstName(focusP);
    if (d === 1) return "Parents";
    if (d === 2) return "Grandparents";
    if (d === 3) return "Great-grandparents";
    return `${ordinal(d - 2)} great-grandparents`;
  }
  const lineOf = p => (p && p.line) || "none";
  const spouseWord = p => (p && p.sex === "F" ? "Wife" : p && p.sex === "M" ? "Husband" : "Spouse");

  /* ---------------------------------------------------------------- layout */
  /* Sibling rows for one side of a card, top to bottom. Big groups show the MAXSIBS nearest the card and a
     "+N more" row at the far end. */
  function sibRows(ids, side, owner, depth) {
    if (!S.sibs || !ids.length) return [];
    const gkey = `${owner}|${side}`;
    const max = depth >= 3 ? 1 : depth >= 2 ? G.MAXSIBS_DEEP : G.MAXSIBS;
    let rows = ids.map(pid => ({ kind: "sib", pid }));
    if (ids.length > max + 1) {
      const open = S.openGroups.has(gkey);
      const more = { kind: "more", gkey, open, count: ids.length - max, total: ids.length, owner };
      if (side === "above") { if (!open) rows = rows.slice(-max); rows.unshift(more); }
      else { if (!open) rows = rows.slice(0, max); rows.push(more); }
    }
    return rows;
  }

  const placeholder = (role, depth) => ({
    ph: true, role, depth, w: colW(depth), h: G.CH, above: [], below: [], spouses: [], contour: [[0, G.CH]],
  });

  /* build(pid, depth, role, budget): one direct-line node and its ancestry.
     budget = generations still to show above this person; 0 means "edge" (an expand button when they have parents).
     Returns {pid, depth, role, w, h, above, below, spouses, father, mother, fy, my, contour, expand}:
     y values are relative to this card's top; contour[k] = [top, bottom] of the subtree in column depth + k. */
  function build(pid, depth, role, budget, path) {
    const p = P[pid];
    const isFocus = role === "focus";
    const n = {
      pid, depth, role, w: colW(depth), h: isFocus ? G.FH : G.CH,
      above: [], below: [], spouses: [], father: null, mother: null, fy: 0, my: 0, expand: null, contour: null,
    };
    // the sibling group
    const sibs = birthOrder((p.sibs || []).filter(id => id !== pid));
    if (isFocus) {
      const by = isHidden(p) ? null : p.by;
      const older = by ? sibs.filter(id => !isHidden(P[id]) && P[id].by && P[id].by < by) : [];
      const younger = sibs.filter(id => !older.includes(id));
      n.above = sibRows(older, "above", pid, depth);
      n.below = sibRows(younger, "below", pid, depth);
      for (const fam of p.fams || []) {
        if (fam.spouse && P[fam.spouse]) n.spouses.push({ kind: "spouse", pid: fam.spouse, fam });
      }
    } else if (role === "father") n.above = sibRows(sibs, "above", pid, depth);
    else n.below = sibRows(sibs, "below", pid, depth);

    // this column's block: rows above, the card, spouse rows, rows below
    const pitch = G.RH + G.RGAP;
    let top = 0;
    if (n.above.length) top = -(G.BGAP + n.above.length * pitch - G.RGAP);
    n.above.forEach((r, i) => { r.y = top + i * pitch; });
    let yb = n.h;
    n.spouses.forEach(r => { r.y = yb; yb += G.SPH; });
    if (n.below.length) {
      yb += n.spouses.length ? G.BGAP + 4 : G.BGAP;
      n.below.forEach((r, i) => { r.y = yb + i * pitch; });
      yb += n.below.length * pitch - G.RGAP;
    }
    n.contour = [[top, yb]];

    // parents
    const fId = person(p.father) && !path.has(p.father) ? p.father : null;
    const mId = person(p.mother) && !path.has(p.mother) ? p.mother : null;
    const hasParents = !!(fId || mId);
    if (budget <= 0 && hasParents) n.expand = S.expanded.has(pid) ? "less" : "more";
    const show = budget > 0 || S.expanded.has(pid);
    if (show && (hasParents || isFocus)) {
      const nb = budget > 0 ? budget - 1 : 1;
      const sub = (id, r) => {
        if (!id) return placeholder(r, depth + 1);
        path.add(id);
        const out = build(id, depth + 1, r, nb, path);
        path.delete(id);
        return out;
      };
      const F = n.father = sub(fId, "father");
      const M = n.mother = sub(mId, "mother");
      // the smallest offset s (mother top - father top) where the two subtrees clear each other in every column
      let s = -Infinity;
      const shared = Math.min(F.contour.length, M.contour.length);
      for (let k = 0; k < shared; k++) s = Math.max(s, F.contour[k][1] + (k === 0 ? G.PGAP : G.SGAP) - M.contour[k][0]);
      if (isFocus || S.layoutMode === "center") {
        // center this card on the midpoint of the parents' card centers
        n.fy = n.h / 2 - (F.h / 2 + s + M.h / 2) / 2;
      } else if (role === "father") {
        // level with his mother (the inner parent), so each couple stays together near the middle
        n.fy = n.h / 2 - M.h / 2 - s;
      } else {
        // level with her father (the inner parent)
        n.fy = n.h / 2 - F.h / 2;
      }
      n.my = n.fy + s;
      const deep = Math.max(F.contour.length, M.contour.length);
      for (let k = 0; k < deep; k++) {
        const a = F.contour[k], b = M.contour[k];
        n.contour.push([
          Math.min(a ? a[0] + n.fy : Infinity, b ? b[0] + n.my : Infinity),
          Math.max(a ? a[1] + n.fy : -Infinity, b ? b[1] + n.my : -Infinity),
        ]);
      }
    }
    return n;
  }

  /* fanOut(tree): place each generation column as close as possible to the column before it. A father's card
     wants its bottom just above the middle of his child's card and a mother's card her top just below it;
     the blocks (card plus sibling rows) keep their order down the column and may not overlap, and isotonic
     regression (pool adjacent violators) finds the positions nearest to those wishes. The near generations
     stay together around the focus while the wide deep columns fan out, so the parents and the four
     grandparents fit one screen. Sets n.fy / n.my (the parents' card tops relative to n's card top). */
  function fanOut(root) {
    root.ay = 0;
    let col = [root];
    while (col.length) {
      const next = [];
      for (const n of col) for (const c of [n.father, n.mother]) if (c) { c.kid = n; next.push(c); }
      if (!next.length) break;
      // u = y - O turns "no overlap" into "u never decreases down the column"
      let O = 0;
      const pools = [];
      next.forEach((c, i) => {
        if (i) {
          const p = next[i - 1];
          O += p.contour[0][1] + (p.kid === c.kid ? G.PGAP : G.SGAP) - c.contour[0][0];
        }
        const mid = c.kid.ay + c.kid.h / 2;
        const want = c.role === "father" ? mid - G.PGAP / 2 - c.h : mid + G.PGAP / 2;
        let pool = { sum: want - O, cnt: 1, items: [{ c, O }] };
        while (pools.length && pools[pools.length - 1].sum / pools[pools.length - 1].cnt > pool.sum / pool.cnt) {
          const q = pools.pop();
          pool = { sum: q.sum + pool.sum, cnt: q.cnt + pool.cnt, items: q.items.concat(pool.items) };
        }
        pools.push(pool);
      });
      for (const pool of pools) for (const it of pool.items) it.c.ay = pool.sum / pool.cnt + it.O;
      for (const c of next) {
        if (c.role === "father") c.kid.fy = c.ay - c.kid.ay; else c.kid.my = c.ay - c.kid.ay;
      }
      col = next;
    }
  }

  /* layoutChart(focusPid) -> {nodes: Map key -> node, edges: [edge], bounds, focusKey, depths: [min, max]}
     node: {key, pid, kind, x, y, w, h, depth, line, down, owner, expand, count, open, gkey, marr, role}
       kind: "focus" | "direct" | "sib" | "more" | "spouse" | "child" | "ph"
       down: the key of the card one step toward the focus (for paths, keyboard ← and animations)
       owner: for sibling, "more" and spouse rows, the direct-line card they belong to
     edge: {id, type: "parent" | "sib" | "kid", a: lower/left key, b: upper/right key, line} */
  function layoutChart(focusPid) {
    const t0 = performance.now();
    const fp = P[focusPid];
    Object.assign(G, COARSE.matches ? { RH: 36, RGAP: 6, SPH: 38 } : { RH: 30, RGAP: 4, SPH: 32 });
    const tree = build(focusPid, 0, "focus", S.gens, new Set([focusPid]));
    if (S.layoutMode === "fan") fanOut(tree);
    const nodes = new Map(), edges = [];
    const used = new Map();
    const keyFor = base => {
      const n = (used.get(base) || 0) + 1;
      used.set(base, n);
      return n === 1 ? base : `${base}~${n}`;
    };
    let minD = 0, maxD = 0;
    const add = node => { nodes.set(node.key, node); minD = Math.min(minD, node.depth); maxD = Math.max(maxD, node.depth); return node; };

    function place(n, y, downKey, childKey) {
      const x = colX(n.depth);
      let key;
      if (n.ph) {
        key = `ph:${childKey}:${n.role}`;
        add({ key, pid: null, kind: "ph", role: n.role, x, y, w: n.w, h: n.h, depth: n.depth, line: "none", down: downKey });
      } else {
        const p = P[n.pid];
        key = keyFor(n.pid);
        add({
          key, pid: n.pid, kind: n.role === "focus" ? "focus" : "direct", role: n.role, x, y, w: n.w, h: n.h,
          depth: n.depth, line: lineOf(p), down: downKey, expand: n.expand,
        });
        const rows = r => {
          if (r.kind === "more") {
            const rk = `more:${r.gkey}`;
            add({ key: rk, pid: null, kind: "more", x, y: y + r.y, w: n.w, h: G.RH, depth: n.depth, line: lineOf(p),
              down: key, owner: key, count: r.count, total: r.total, open: r.open, gkey: r.gkey });
            edges.push({ id: `s:${rk}`, type: "sib", a: rk, b: key, line: lineOf(p) });
          } else {
            const rk = keyFor(r.pid);
            add({ key: rk, pid: r.pid, kind: "sib", x, y: y + r.y, w: n.w, h: G.RH, depth: n.depth, line: lineOf(P[r.pid]),
              down: key, owner: key });
            edges.push({ id: `s:${rk}`, type: "sib", a: rk, b: key, line: lineOf(P[r.pid]) });
          }
        };
        n.above.forEach(rows);
        n.below.forEach(rows);
        n.spouses.forEach(r => {
          const sp = P[r.pid];
          const hidden = isHidden(p) || isHidden(sp);
          add({ key: keyFor(r.pid), pid: r.pid, kind: "spouse", x, y: y + r.y, w: n.w, h: G.SPH, depth: n.depth,
            line: lineOf(sp), oline: lineOf(p), down: key, owner: key, marr: hidden ? "" : marriageYear(r.fam) });
        });
      }
      if (downKey) edges.push({ id: `p:${key}`, type: "parent", a: downKey, b: key, line: n.ph ? "none" : lineOf(P[n.pid]) });
      if (n.father) place(n.father, y + n.fy, key, key);
      if (n.mother) place(n.mother, y + n.my, key, key);
      return key;
    }
    const focusKey = place(tree, 0, null, null);

    // the children column, centered on the focus card; slim rows when there are many
    const kidIds = [];
    for (const fam of fp.fams || []) for (const k of fam.kids || []) if (P[k] && !kidIds.includes(k) && k !== focusPid) kidIds.push(k);
    const kids = birthOrder(kidIds);
    if (kids.length) {
      const slim = kids.length > 4;
      const h = slim ? G.RH : G.CH, gap = slim ? G.RGAP : G.KGAP;
      const total = kids.length * h + (kids.length - 1) * gap;
      let y = G.FH / 2 - total / 2;
      for (const k of kids) {
        const key = keyFor(k);
        add({ key, pid: k, kind: "child", slim, x: colX(-1), y, w: G.CW, h, depth: -1, line: lineOf(P[k]), down: focusKey });
        edges.push({ id: `k:${key}`, type: "kid", a: key, b: focusKey, line: lineOf(P[k]) });
        y += h + gap;
      }
    }

    // bounds (expand buttons hang 32px off the right edge)
    const b = { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity };
    for (const n of nodes.values()) {
      b.x0 = Math.min(b.x0, n.x); b.y0 = Math.min(b.y0, n.y);
      b.x1 = Math.max(b.x1, n.x + n.w + (n.expand ? EXPW() : 0)); b.y1 = Math.max(b.y1, n.y + n.h);
    }
    S.stats = { layoutMs: +(performance.now() - t0).toFixed(2), nodes: nodes.size, edges: edges.length };
    return { nodes, edges, bounds: b, focusKey, focusPid, depths: [minD, maxD] };
  }

  /* move a whole layout by (dx, dy) so a chosen card stays put on screen */
  function shiftLayout(L, dx, dy) {
    for (const n of L.nodes.values()) { n.x += dx; n.y += dy; }
    L.bounds.x0 += dx; L.bounds.x1 += dx; L.bounds.y0 += dy; L.bounds.y1 += dy;
    L.ox = (L.ox || 0) + dx;     // where column 0 starts now (for the generation labels)
  }
  const colLeft = (L, d) => (L.ox || 0) + colX(d);

  /* the path from a card to the focus: {keys, edges} */
  function traceOf(key) {
    const L = S.layout;
    const keys = [], edges = [];
    let n = L && L.nodes.get(key);
    if (!n) return { keys, edges };
    keys.push(key);
    if (n.kind === "sib" || n.kind === "more") { edges.push(`s:${key}`); n = L.nodes.get(n.owner); keys.push(n.key); }
    else if (n.kind === "spouse") { keys.push(n.owner); return { keys, edges }; }
    while (n && n.down) {
      edges.push(n.kind === "child" ? `k:${n.key}` : `p:${n.key}`);
      n = L.nodes.get(n.down);
      if (n) keys.push(n.key);
    }
    return { keys, edges };
  }

  /* ---------------------------------------------------------------- cards */
  const KIND_CLASS = { focus: "ch-focus", direct: "ch-direct", sib: "ch-row", more: "ch-more", spouse: "ch-spouse", child: "ch-direct ch-child", ph: "ch-ph" };
  /* birthplaces on cards: "Philadelphia, Pa." (the full place is in the person panel) */
  const STATES = {
    Alabama: "Ala.", Arizona: "Ariz.", Arkansas: "Ark.", California: "Calif.", Colorado: "Colo.", Connecticut: "Conn.",
    Delaware: "Del.", "District of Columbia": "D.C.", Florida: "Fla.", Georgia: "Ga.", Illinois: "Ill.", Indiana: "Ind.",
    Kansas: "Kan.", Kentucky: "Ky.", Louisiana: "La.", Maryland: "Md.", Massachusetts: "Mass.", Michigan: "Mich.",
    Minnesota: "Minn.", Mississippi: "Miss.", Missouri: "Mo.", Montana: "Mont.", Nebraska: "Neb.", Nevada: "Nev.",
    "New Hampshire": "N.H.", "New Jersey": "N.J.", "New Mexico": "N.M.", "New York": "N.Y.", "North Carolina": "N.C.",
    "North Dakota": "N.D.", Oklahoma: "Okla.", Oregon: "Ore.", Pennsylvania: "Pa.", Penna: "Pa.", "Penna.": "Pa.",
    "Rhode Island": "R.I.", "South Carolina": "S.C.", "South Dakota": "S.D.", Tennessee: "Tenn.", Vermont: "Vt.",
    Virginia: "Va.", Washington: "Wash.", "West Virginia": "W.Va.", Wisconsin: "Wis.", Wyoming: "Wyo.",
  };
  function placeOf(p) {
    if (isHidden(p)) return "";
    const parts = shortPlace(p.bp || "").split(", ").filter(Boolean);
    if (parts.length > 1 && STATES[parts[parts.length - 1]]) parts[parts.length - 1] = STATES[parts[parts.length - 1]];
    return parts.join(", ");
  }
  /* text widths for deciding what fits on a slim row (the chart's own font, measured on a canvas) */
  const measureCtx = document.createElement("canvas").getContext("2d");
  const widths = new Map();
  function textWidth(text, font) {
    const key = `${font}|${text}`;
    let w = widths.get(key);
    if (w == null) {
      if (!S.fontFamily) S.fontFamily = getComputedStyle(document.body).fontFamily || "sans-serif";
      measureCtx.font = `${font} ${S.fontFamily}`;
      w = measureCtx.measureText(text).width;
      widths.set(key, w);
    }
    return w;
  }
  /* "Eugene Richard “Gene” Perret" -> "Eugene Perret": first name and surname, for rows too short for the rest */
  function shortName(p) {
    const words = nameWords(p).filter(w => !/[“”"‘’]/.test(w));
    if (words.length < 3) return p.name;
    const sur = String(p.surname || "").trim();
    const last = sur && words.join(" ").endsWith(sur) ? sur : words[words.length - 1];
    return `${words[0]} ${last}`;
  }
  /* the name a slim row can show in full: the whole name, else the short one (the row's tooltip and label
     always carry the whole name) */
  function rowName(p, n, side) {
    const room = n.w - 2 - 16 - 22 - 8 - (side ? 8 + textWidth(side, "500 11.5px") + 2 : 0);
    const font = "500 12.5px";
    if (textWidth(p.name, font) <= room) return p.name;
    return shortName(p);
  }
  function ariaFor(n, p) {
    const bits = [p.name, years(p), p.rel].filter(Boolean);
    if (n.kind === "spouse") bits.push(n.marr ? `married ${n.marr}` : "spouse");
    if (n.kind === "sib") bits.push("sibling");
    return bits.join(", ");
  }

  /* the inside of one node; returns [cardEl, ...extra] */
  function nodeContent(n) {
    if (n.kind === "ph") {
      const who = n.role === "mother" ? "Mother" : "Father";
      return [el("div", { class: "ch-card", role: "img", "aria-label": `${who} not yet found` },
        el("span", { class: "ch-ph-mark", "aria-hidden": "true", text: "?" }),

  /* ---------------------------------------------------------------- keyboard */

      if (cur.kind === "spouse") moveCursor(cur.owner);
      else if (base && base.kind === "focus") {
        const kid = [...L.nodes.values()].filter(m => m.kind === "child").sort((a, b) => a.y - b.y);
        if (cur.kind !== "focus") moveCursor(base.key);
        else if (kid.length) moveCursor(kid[Math.floor((kid.length - 1) / 2)].key);

  /* ---------------------------------------------------------------- toolbar and legend */
  function buildTools() {

      GENS.map(g => el("button", {
        type: "button", dataset: { gens: g === Infinity ? "all" : String(g) }, "aria-pressed": "false",

    const sibs = el("button", {
      class: "btn btn-sm ch-toggle", type: "button", "aria-pressed": "true", title: "Show brothers and sisters in the chart",
      onclick: () => setSibs(!S.sibs),
    }, icon("users", 16), el("span", { text: "Siblings" }));
    const zoomOut = el("button", { class: "btn btn-icon btn-sm", type: "button", "aria-label": "Zoom out", title: "Zoom out (−)", onclick: () => zoomBy(0.8) }, icon("zoom-out", 18));
    const zoomLabel = el("button", { class: "btn btn-sm btn-ghost ch-zoom-label", type: "button", title: "Actual size", "aria-label": "Zoom to 100%",
      onclick: () => { interacted(); zoomAt(1 / S.cam.k, S.size.w / 2, HEADER_H / 2 + S.size.h / 2, { animate: true }); } }, "100%");
    const zoomIn = el("button", { class: "btn btn-icon btn-sm", type: "button", "aria-label": "Zoom in", title: "Zoom in (+)", onclick: () => zoomBy(1.25) }, icon("zoom-in", 18));
    const fitB = el("button", { class: "btn btn-icon btn-sm", type: "button", "aria-label": "Fit the whole chart", title: "Fit the whole chart (0)", onclick: () => { interacted(); fit(); openTools(false); } }, icon("fit", 18));
    const centerB = el("button", { class: "btn btn-icon btn-sm", type: "button", "aria-label": "Center on the focus", title: "Center on the focus", onclick: () => { interacted(); center(); openTools(false); } }, icon("center", 18));
    // phones: one "View" button in the toolbar opens these controls in a small panel under it
    const pop = el("div", { class: "ch-tools-pop", id: "ch-tools-pop" },
      el("div", { class: "tool-group" }, el("span", { class: "label ch-tools-label", text: "Generations" }), gens),
      el("span", { class: "tool-sep", "aria-hidden": "true" }),
      sibs,
      el("span", { class: "tool-sep", "aria-hidden": "true" }),
      el("div", { class: "tool-group ch-zoom", role: "group", "aria-label": "Zoom" }, zoomOut, zoomLabel, zoomIn, fitB, centerB));
    const viewB = el("button", {
      class: "btn btn-sm ch-view-btn", type: "button", "aria-expanded": "false", "aria-controls": "ch-tools-pop",
      onclick: () => openTools(!pop.classList.contains("is-open")),
    }, el("span", { text: "View" }), icon("chevron-down", 16));
    pop.addEventListener("keydown", e => { if (e.key === "Escape") { e.stopPropagation(); openTools(false); viewB.focus(); } });
    document.addEventListener("pointerdown", e => {
      if (pop.classList.contains("is-open") && !pop.contains(e.target) && !viewB.contains(e.target)) openTools(false);
    }, true);
    let winW = window.innerWidth;     // (phones resize the height as their browser bars come and go)
    window.addEventListener("resize", () => { if (window.innerWidth !== winW) { winW = window.innerWidth; openTools(false); } });
    bar.replaceChildren(viewB, pop);
    Object.assign(S.tools, { gens, sibs, zoomOut, zoomIn, zoomLabel, pop, viewB });
    syncTools();
  }
  function openTools(on) {
    const { pop, viewB } = S.tools;
    if (!pop || on === pop.classList.contains("is-open")) return;
    if (on) {
      // fixed, so the toolbar's own sideways scrolling can't clip it
      const r = viewB.getBoundingClientRect();
      pop.style.top = `${Math.round(r.bottom + 6)}px`;
      pop.classList.add("is-open");
      pop.style.left = `${Math.round(Math.max(8, Math.min(r.left, window.innerWidth - pop.offsetWidth - 8)))}px`;

  function syncTools() {
    const t = S.tools;
    if (t.gens) $$("button", t.gens).forEach(b => b.setAttribute("aria-pressed", String(b.dataset.gens === (S.gens === Infinity ? "all" : String(S.gens)))));

  }
  /* the line legend sits at the right end of the generation-label strip, out of the drawing area. Where the
     chart is narrow (phones, the docked or floating person panel) it folds into one "Lines" button that
     opens the four toggles below the strip. */
  function buildLegend() {
    const items = el("div", { class: "ch-legend-items", id: "ch-legend-items" },
      el("span", { class: "label ch-legend-label", text: "Lines" }),
      LINE_KEYS.map(k => el("button", {
        type: "button", class: "ch-legend-item", dataset: { line: k }, "aria-pressed": "false",
        style: { "--lc": `var(--${k})` }, title: `Highlight the ${LINE_NAMES[k]}`,
        onclick: () => toggleLine(k),
      }, el("span", { class: "marker" }), el("span", { text: LINE_NAMES[k].replace(/ line$/, "") }))));
    const toggle = el("button", {
      type: "button", class: "ch-legend-toggle", "aria-expanded": "false", "aria-controls": "ch-legend-items",
      title: "Highlight a family line", onclick: () => openLegend(!S.legend.classList.contains("is-open")),
    }, el("span", { class: "ch-legend-swatches", "aria-hidden": "true" },
      LINE_KEYS.map(k => el("span", { class: "marker", style: { "--lc": `var(--${k})` } }))),
    el("span", { class: "ch-legend-toggle-text", text: "Lines" }), icon("chevron-down", 14));
    const box = el("div", { class: "ch-legend", role: "group", "aria-label": "Highlight a family line" }, toggle, items);
    box.addEventListener("keydown", e => {
      if (e.key === "Escape" && box.classList.contains("is-open")) { e.stopPropagation(); openLegend(false); toggle.focus(); }
    });

  }

  }

  function syncLegend() {

    S.viewport = el("div", { class: "ch-viewport" }, S.stage);
    const help = el("p", { class: "sr-only", id: "ch-help",
      text: "Arrow keys move between people: Right goes to the father, Shift+Right to the mother, Left toward the person in focus, Up and Down within a generation. Enter centers the tree on the person, Space shows their details. E shows or hides the generations beyond a person at the edge of the chart. Plus and minus zoom, 0 fits the chart, Escape closes the details. With a mouse, drag to move, Ctrl and scroll to zoom, double-click a person to center." });

    }, true);
    host.replaceChildren(S.root);

    const vp = S.viewport;
    // focusing a card that's partly outside scrolls clipped ancestors; the chart moves by its camera only
    for (const box of [host, S.root, vp]) {

    }

    buildTools();

    App.on("select", pid => {
      S.selected = pid || null;
      if (!pid) S.cursor = null;
      else if (S.cursor && S.layout && S.layout.nodes.get(S.cursor) && S.layout.nodes.get(S.cursor).pid !== pid) S.cursor = null;
      updateSelectionClasses();
      updateRoving();
      syncLegend();
      updateHeader();
      // keep the selected card clear of the panel that is opening (visibleRect knows the room it will leave).
      // A refocus places the camera itself; a hidden chart has nothing to show.

        const k = S.camTween && S.glideTarget ? S.glideTarget.k : S.cam.k;
        if (S.atHome && !S.tween && (!S.selected || S.selected === S.focus)) glide(homeCam(S.layout, k), 320);

  }
  function firstRender() {
    const pid = S.pending || App.state.focus || App.ROOT;

    S.focus = pid;
    const L = layoutChart(pid);
    syncLegend();
    S.cam.k = homeZoom(L);
    render(L, { animate: false });
    S.atHome = true;
    if (S.root) S.root.setAttribute("aria-label", `Pedigree chart centered on ${P[pid].name}`);
  }

  /* ---------------------------------------------------------------- API */
  App.chart = {
    mount(host) { mount(host); },
    /* re-center on pid (animated when the chart is on screen) */
    focus(pid) {
      const id = resolvePid(pid);
      if (!id) return;
      if (!S.mounted || !S.layout || !S.size.w) { S.pending = id; return; }
      refocus(id, { animate: !S.host.hidden });
    },
    /* photos or avatars changed: rebuild the card contents, keep the layout */
    refresh(pid) {
      if (!S.layout) return;
      // rebuilding a card drops keyboard focus with it: hand it back to the chart's tab stop afterwards
      const hadFocus = S.root.contains(document.activeElement) && document.activeElement !== S.root;
      for (const v of S.views.values()) {
        if (pid && v.data.pid !== pid) continue;
        v.sigv = "";
        fillView(v, v.data);
      }
      updateSelectionClasses();
      updateLineClasses();
      updateRoving();
      if (hadFocus && !S.root.contains(document.activeElement)) {
        const v = S.views.get(rovingKey());
        if (v && v.card && v.card.tagName === "BUTTON") v.card.focus({ preventScroll: true });
      }
    },
    /* for tests and tooling */
    get stats() { return { ...S.stats, zoom: S.cam.k, focus: S.focus }; },
    measure(gens = Infinity, sibs = true) {
      const keep = { gens: S.gens, sibs: S.sibs };
      S.gens = gens; S.sibs = sibs;
      const t0 = performance.now();
      const L = layoutChart(S.focus || App.ROOT);
      const ms = performance.now() - t0;
      S.gens = keep.gens; S.sibs = keep.sibs;
      return { ms: +ms.toFixed(2), nodes: L.nodes.size, edges: L.edges.length };
    },
