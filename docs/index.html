<script>/* family.js */
/* family.js: the Family view. A vertical mini-tree that fits the width of a phone with no sideways panning:
   grandparents as two couples, then the parents, the focus person large, a strip of brothers and sisters in
   birth order (the focus in its place), then each marriage with its children. Tap a card to move there;
   tap the focus card to open the person sheet. Moves are animated (FLIP): the tapped card travels into the
   focus position while the rest cross-fades. Swipe the focus card sideways to step through siblings.
   Registers App.family = {mount(el), focus(pid), refresh()}. Styles: family.css (prefix fv-). */
(() => {
  const MAX_TRAIL = 6;               // breadcrumbs: the last few people visited
  const MOVE_MS = 500, FADE_MS = 280, GHOST_MS = 220;
  const EASE = "cubic-bezier(.22, .68, .24, 1)";

  let rootEl = null;                 // .fv (position: relative; fills #family-view)
  let scroller = null;               // .fv-scroll (the vertical scroller)
  let overlay = null;                // .fv-overlay (holds the outgoing content while it fades)
  let crumbsEl = null;               // .fv-crumbs
  let content = null;                // .fv-content (rebuilt for each focus)
  let liveEl = null;                 // polite announcement for screen readers
  let current = null;                // pid on show
  let trail = [];                    // breadcrumb pids, oldest first
  let pending = null;                // {pid, rect, dir} recorded by a tap or swipe just before App.go
  let running = [];                  // animations to cancel if another move starts
  let resizeObs = null;
  let resizeFrame = 0;
  let inner = null;                  // .fv-inner: the centered column (max 720px)
  let skipNextMotion = false;        // set by a view switch: app.js fades the view in itself

  const noMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const person = pid => (pid && P[pid]) || null;

  /* ------------------------------------------------------------ family helpers */
  const birthYear = p => (p && !isHidden(p) && p.by) || null;

  /* the focus and their brothers and sisters in birth order. Ties and unknown years keep the order the
     parents' family lists them in (the GEDCOM order), so living people on the public page stay in place. */
  function siblingsInOrder(p) {
    const ids = [p.id, ...(p.sibs || [])].filter((id, i, a) => P[id] && a.indexOf(id) === i);
    let order = ids;
    for (const parent of [person(p.father), person(p.mother)]) {
      const fam = parent && (parent.fams || []).find(f => (f.kids || []).includes(p.id));
      if (fam) {
        const listed = fam.kids.filter(k => ids.includes(k));
        order = [...listed, ...ids.filter(k => !listed.includes(k))];
        break;
      }
    }
    const at = new Map(order.map((id, i) => [id, i]));
    return order.slice().sort((a, b) => {
      const ya = birthYear(P[a]), yb = birthYear(P[b]);
      if (ya && yb && ya !== yb) return ya - yb;
      return at.get(a) - at.get(b);
    });
  }

  const spouseWord = s => (s && s.sex === "F" ? "Wife" : s && s.sex === "M" ? "Husband" : "Spouse");
  const childWord = c => (c && c.sex === "F" ? "Daughter" : c && c.sex === "M" ? "Son" : "Child");
  const parentWord = (sex, fallback) => (sex === "F" ? "Mother" : sex === "M" ? "Father" : fallback);
  const ordinal = n => { const s = ["th", "st", "nd", "rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };

  /* "7 Sep 1946 · Philadelphia, Pennsylvania" (or just one of them). Never for a couple where either is
     living on the public page (the build already blanks it there; this keeps it so). */
  function marriageText(p, fam) {
    const spouse = person(fam.spouse);
    if (isHidden(p) || isHidden(spouse)) return "";
    const parts = String(fam.marr || "").split("·").map(s => s.trim()).filter(Boolean);
    if (!parts.length) return "";
    const [first, ...rest] = parts;
    if (!/\d/.test(first)) return shortPlace(parts.join(", "));
    return [first, shortPlace(rest.join(", "))].filter(Boolean).join(" · ");
  }

  function mediaCounts(pid) {
    const items = personMedia(pid);
    const photos = items.filter(m => m.kind === "photo" || m.kind === "headstone").length;
    return { photos, docs: items.length - photos };
  }

  /* ------------------------------------------------------------ cards */
  /* Every person card is a <button> keyed by pid (data-key), so a move can find where each person was.
     data-go is the pid to move to; data-open marks the focus (opens the person sheet instead). */
  function nameBlock(p, { full = false, surname = false } = {}) {
    const first = firstName(p);
    const sur = (p.surname || "").trim();
    return [
      el("span", { class: "fv-name", text: full ? p.name : first }),
      surname && sur && !full ? el("span", { class: "fv-surname", text: sur }) : null,
    ];
  }
  function yearsText(p) {
    return years(p) || "Dates unknown";
  }
  function ariaFor(p, role) {
    const y = years(p);
    return [p.name, y, role].filter(Boolean).join(", ");
  }

  /* small card: 40px avatar, first name (and surname for grandparents), years. Grandparents, siblings, children. */
  function smallCard(p, { role = "", surname = false, key = p.id, current = false, cls = "" } = {}) {
    return el("button", {
      type: "button",
      class: ["fv-card", "fv-sm", current && "is-current", isHidden(p) && "is-living", cls],
      style: { "--lc": lineColor(p) },
      dataset: { key, pid: p.id, ...(current ? { open: "1" } : { go: p.id }) },
      "aria-label": current ? `${ariaFor(p, role)}. Shown above. Open the profile` : `${ariaFor(p, role)}. Show their family`,
      "aria-current": current ? "true" : null,
      title: p.name,
    },
    avatar(p, { size: 40 }),
    el("span", { class: "fv-text" },
      nameBlock(p, { surname }),
      el("span", { class: "fv-years", text: years(p) || "No dates" })));
  }

  /* medium card: 48px avatar, role label, full name, years. Parents and spouses. */
  function mediumCard(p, { role = "", key = p.id, cls = "" } = {}) {
    return el("button", {
      type: "button",
      class: ["fv-card", "fv-md", isHidden(p) && "is-living", cls],
      style: { "--lc": lineColor(p) },
      dataset: { key, pid: p.id, go: p.id },
      "aria-label": `${ariaFor(p, role)}. Show their family`,
      title: p.name,
    },
    avatar(p, { size: 48 }),
    el("span", { class: "fv-text" },
      role ? el("span", { class: "fv-role label", text: role }) : null,
      nameBlock(p, { full: true }),
      el("span", { class: "fv-years", text: yearsText(p) })));
  }

  /* dashed placeholder for someone not recorded (not a button: there is nowhere to go) */
  function placeholder(text, { size = "sm", cls = "" } = {}) {
    return el("div", { class: ["fv-ph", `fv-ph-${size}`, "fv-x", cls], role: "note", "aria-label": text },
      el("span", { class: "fv-ph-box", "aria-hidden": "true", text: "?" }),
      el("span", { class: "fv-ph-text", text }));
  }

  /* the large focus card: 96px photo or monogram, full name, years and birthplace, relationship and line,
     photo and document counts. Tapping it opens the person sheet. Swipe it sideways to step through siblings. */
  function focusCard(p) {
    const hidden = isHidden(p);
    const place = hidden ? "" : shortPlace(p.bp);
    const lineName = LINE_KEYS.includes(p.line) ? LINE_NAMES[p.line] : "";   // not "Immediate family"
    let counts;
    if (hidden) counts = [el("span", { text: "Details of living people are private" })];
    else {
      const c = mediaCounts(p.id);
      counts = [
        c.photos ? el("span", { class: "fv-count" }, icon("image", 16), plural(c.photos, "photo")) : null,
        c.docs ? el("span", { class: "fv-count" }, icon("document", 16), plural(c.docs, "document")) : null,
      ].filter(Boolean);
      if (!counts.length) counts = [el("span", { text: "No photos or documents yet" })];
    }
    return el("button", {
      type: "button",
      class: ["fv-card", "fv-lg", hidden && "is-living"],
      style: { "--lc": lineColor(p) },
      dataset: { key: p.id, pid: p.id, open: "1" },
      "aria-label": `${ariaFor(p, p.rel)}. Open the profile`,
    },
    el("span", { class: "fv-lg-main" },
      avatar(p, { size: 96 }),
      el("span", { class: "fv-lg-text" },
        p.rel || lineName ? el("span", { class: "fv-kicker" },
          el("span", { class: "marker", "aria-hidden": "true" }),
          el("span", { class: "fv-kicker-text" },
            p.rel ? el("span", { class: "label fv-rel", text: p.rel }) : null,
            lineName ? el("span", { class: "label fv-line", text: lineName }) : null)) : null,
        el("span", { class: "fv-lg-name", text: p.name }),
        el("span", { class: "fv-lg-meta" },
          el("span", { class: "fv-lg-years", text: yearsText(p) }),
          place ? el("span", { class: "fv-lg-place", text: place }) : null))),
    el("span", { class: "fv-lg-foot" },
      el("span", { class: "fv-counts" }, counts),
      el("span", { class: "fv-open" }, el("span", { text: "Profile" }), icon("chevron-right", 16))));
  }

  const join = (cls = "") => el("div", { class: ["fv-join", "fv-x", cls], "aria-hidden": "true" });

  /* row 1: the four grandparents as two couples. Left out when neither parent is known. */
  function grandparentsRow(p) {
    const father = person(p.father), mother = person(p.mother);
    if (!father && !mother) return null;
    const couple = (parent, side) => {
      const label = el("span", { class: "fv-couple-label label fv-x", text: `${side}'s parents` });
      const gf = parent && person(parent.father), gm = parent && person(parent.mother);
      // an unknown parent, or a known parent whose own parents aren't recorded: one quiet box, not two
      if (!gf && !gm) {
        return el("div", { class: "fv-couple is-unknown" }, label,
          el("div", { class: "fv-couple-cards" }, placeholder("Not recorded", { size: "wide" })),
          join("is-dashed"));
      }
      const side2 = side.toLowerCase();
      return el("div", { class: "fv-couple" }, label,
        el("div", { class: "fv-couple-cards" },
          gf ? smallCard(gf, { surname: true, role: `grandfather, ${side2}'s side` }) : placeholder("Unknown"),
          gm ? smallCard(gm, { surname: true, role: `grandmother, ${side2}'s side` }) : placeholder("Unknown")),
        join(gf || gm ? "" : "is-dashed"));
    };
    return el("div", { class: "fv-row fv-gp" }, couple(father, "Father"), couple(mother, "Mother"));
  }

  /* row 2: father and mother, joined to the focus below */
  function parentsRow(p) {
    const father = person(p.father), mother = person(p.mother);
    return [
      el("div", { class: "fv-row fv-parents" },
        father ? mediumCard(father, { role: "Father" }) : placeholder("Father unknown", { size: "md" }),
        mother ? mediumCard(mother, { role: "Mother" }) : placeholder("Mother unknown", { size: "md" })),
      join(father || mother ? "fv-join-wide" : "fv-join-wide is-dashed"),
    ];
  }

  /* row 4: brothers and sisters in birth order, the focus in its place. Scroll-snap strip. */
  function siblingsSection(p) {
    const order = siblingsInOrder(p);
    if (order.length <= 1) {
      return el("section", { class: "fv-section fv-sibs is-empty fv-x", "aria-label": "Brothers and sisters" },
        el("p", { class: "fv-note", text: "No brothers or sisters recorded." }));
    }
    const at = order.indexOf(p.id);
    const step = (pid, dir, word, ic) => el("button", {
      type: "button", class: "btn btn-icon btn-sm btn-ghost fv-step",
      disabled: !pid,
      "aria-label": pid ? `${word}: ${P[pid].name}` : `No ${word.toLowerCase()} brother or sister`,
      title: pid ? `${word}: ${P[pid].name}` : null,
      dataset: pid ? { go: pid, step: String(dir) } : null,
    }, icon(ic, 18));
    const sibWord = s => (s.sex === "F" ? "sister" : s.sex === "M" ? "brother" : "sibling");
    return el("section", { class: "fv-section fv-sibs", "aria-label": "Brothers and sisters" },
      el("div", { class: "fv-head fv-x" },
        el("h3", { class: "label fv-head-title", text: "Brothers and sisters" }),
        el("span", { class: "fv-head-meta", text: `${ordinal(at + 1)} of ${order.length}` }),
        el("span", { class: "fv-steps" },
          step(order[at - 1], -1, "Older", "chevron-left"),
          step(order[at + 1], 1, "Younger", "chevron-right"))),
      el("div", { class: "fv-strip", role: "list", onscroll: e => stripEdges(e.currentTarget) },
        order.map(id => el("div", { class: "fv-strip-item", role: "listitem" },
          id === p.id
            ? smallCard(P[id], { current: true, key: `sib:${id}`, role: "this person" })
            : smallCard(P[id], { role: sibWord(P[id]) })))));
  }

  /* row 5: each marriage (or partnership) with the spouse, the marriage date and place, and the children */
  function familiesSection(p) {
    const fams = (p.fams || []).filter(f => person(f.spouse) || (f.kids || []).some(k => P[k]));
    if (!fams.length) {
      return el("section", { class: "fv-section fv-fams is-empty fv-x", "aria-label": "Spouse and children" },
        el("p", { class: "fv-note", text: "No spouse or children recorded." }));
    }
    return el("section", { class: "fv-section fv-fams", "aria-label": "Spouse and children" },
      fams.map((fam, i) => {
        const spouse = person(fam.spouse);
        const kids = (fam.kids || []).map(person).filter(Boolean);
        const at = new Map(kids.map((k, j) => [k.id, j]));
        kids.sort((a, b) => {
          const ya = birthYear(a), yb = birthYear(b);
          return ya && yb && ya !== yb ? ya - yb : at.get(a.id) - at.get(b.id);
        });
        const title = (spouse ? "Marriage" : "Family") + (fams.length > 1 ? ` ${i + 1} of ${fams.length}` : "");
        const marr = marriageText(p, fam);
        return el("div", { class: "fv-fam" },
          el("div", { class: "fv-head fv-x" }, el("h3", { class: "label fv-head-title", text: title })),
          el("div", { class: "fv-row fv-spouse" },
            spouse ? mediumCard(spouse, { role: spouseWord(spouse) }) : placeholder("Spouse not recorded", { size: "md" }),
            marr ? el("div", { class: "fv-marr fv-x" },
              el("span", { class: "label", text: "Married" }),
              marr.split(" · ").map((part, j) => el("span", { class: j ? "fv-marr-place" : "fv-marr-date", text: part }))) : null),
          kids.length
            ? [el("div", { class: "fv-subhead fv-x" },
                el("span", { class: "label", text: "Children" }),
                el("span", { class: "fv-head-meta", text: String(kids.length) })),
              el("div", { class: "fv-kids", role: "list" },
                kids.map(k => el("div", { class: "fv-kid", role: "listitem" }, smallCard(k, { role: childWord(k).toLowerCase() }))))]
            : el("p", { class: "fv-note fv-x", text: "No children recorded." }));
      }));
  }

  /* the end of the view: the rest of the page is below the tree, and on a phone this view fills the screen */
  function moreRow() {
    const go = id => e => {
      e.preventDefault();
      // App.goSection renders the section first (Research and Everyone render lazily), then scrolls to it
      if (typeof App.goSection === "function") { App.goSection(id); return; }
      const nav = document.querySelector(`a[data-section="${id}"]`);
      if (nav) nav.click();
      else { const t = document.getElementById(id); if (t) t.scrollIntoView({ block: "start" }); }
    };
    const link = (id, text) => el("a", { class: "fv-more-link", href: `#${id}`, onclick: go(id) }, text, icon("arrow-right", 16));
    return el("nav", { class: "fv-more fv-x", "aria-label": "More on this page" },
      el("span", { class: "label", text: "More" }),
      link("lines", "The four lines"), link("research", "Research"), link("everyone", "Everyone"));
  }

  function build(p) {
    return el("div", { class: "fv-content" },
      grandparentsRow(p),
      parentsRow(p),
      el("div", { class: "fv-focus" }, focusCard(p)),
      siblingsSection(p),
      familiesSection(p),
      moreRow());
  }

  /* ------------------------------------------------------------ breadcrumbs */
  function updateTrail(pid) {
    const i = trail.indexOf(pid);
    if (i >= 0) trail = trail.slice(0, i + 1);   // going back to someone on the trail trims it there
    else trail.push(pid);
    if (trail.length > MAX_TRAIL) trail = trail.slice(-MAX_TRAIL);
  }
  function renderCrumbs() {
    const items = trail.filter(id => P[id]);
    crumbsEl.hidden = items.length < 2;
    if (crumbsEl.hidden) { crumbsEl.replaceChildren(); return; }
    crumbsEl.replaceChildren(el("ol", { class: "fv-crumbs-list" }, items.map((id, i) => {
      const p = P[id], last = i === items.length - 1;
      return el("li", { class: "fv-crumb" },
        last
          ? el("span", { class: "fv-crumb-here", "aria-current": "location", title: p.name }, avatar(p, { size: 22 }), el("span", { text: firstName(p) }))
          : el("button", { type: "button", class: "fv-crumb-btn", dataset: { go: id }, title: p.name, "aria-label": `Back to ${p.name}` },
              avatar(p, { size: 22 }), el("span", { text: firstName(p) })),
        last ? null : el("span", { class: "fv-crumb-sep", "aria-hidden": "true" }, icon("chevron-right", 14)));
    })));
    requestAnimationFrame(() => {
      crumbsEl.classList.toggle("is-overflow", crumbsEl.scrollWidth > crumbsEl.clientWidth + 1);
      crumbsEl.scrollLeft = crumbsEl.scrollWidth;
    });
  }

  /* ------------------------------------------------------------ rendering and the move animation */
  function stopAnimations() {
    for (const a of running) { try { a.cancel(); } catch (e) { /* already gone */ } }
    running = [];
    if (overlay) overlay.replaceChildren();
    if (content) for (const n of content.querySelectorAll(".is-moving")) n.classList.remove("is-moving");
  }
  function play(node, frames, opts) {
    const a = node.animate(frames, { fill: "backwards", ...opts });
    running.push(a);
    a.finished.then(() => { running = running.filter(x => x !== a); }, () => {});
    return a;
  }

  /* fade the strip's edges only on the sides that have more to scroll */
  function stripEdges(strip) {
    const max = strip.scrollWidth - strip.clientWidth;
    strip.classList.toggle("more-left", max > 1 && strip.scrollLeft > 1);
    strip.classList.toggle("more-right", max > 1 && strip.scrollLeft < max - 1);
  }
  /* keep the current sibling in the middle of the strip (no animation) */
  function centerStrip(root) {
    const strip = root && root.querySelector(".fv-strip");
    const here = strip && strip.querySelector(".is-current");
    if (!here) return;
    const item = here.parentElement;
    strip.scrollLeft = Math.max(0, item.offsetLeft - strip.offsetLeft - (strip.clientWidth - item.offsetWidth) / 2);
    stripEdges(strip);
  }

  /* where to scroll after a move: as little as possible (keeping the grandparents and parents) while the
     focus card and the first row of brothers and sisters are on screen; at most until the focus card's top
     sits just under the breadcrumbs, which stick to the top of the view on phones */
  function targetScroll(root) {
    const card = root.querySelector(".fv-lg");
    if (!card) return 0;
    const box = scroller.getBoundingClientRect(), y = n => n.getBoundingClientRect();
    const at = r => r - box.top + scroller.scrollTop;
    const top = at(y(card).top);
    const strip = root.querySelector(".fv-strip .fv-card") || root.querySelector(".fv-sibs .fv-note");
    const bottom = at(y(strip || card).bottom);
    const view = scroller.clientHeight;
    const stuck = crumbsEl && !crumbsEl.hidden && getComputedStyle(crumbsEl).position === "sticky" ? crumbsEl.offsetHeight : 0;
    // and clear of the "more below" cue at the bottom, when it shows
    const cue = cueEl && getComputedStyle(cueEl).display !== "none" ? cueEl.offsetHeight - 8 : 16;
    if (bottom + cue <= view) return 0;
    return Math.max(0, Math.min(bottom + cue - view, top - stuck - 8));
  }

  /* the bottom cue: a fade and a "Brothers and sisters ↓" / "Children ↓" button while those sections are
     below the fold (tapping it scrolls them up under the breadcrumbs) */
  let cueEl = null, cueTarget = null, cueFrame = 0;
  function updateCue() {
    cueFrame = 0;
    if (!cueEl || !content) return;
    const box = scroller.getBoundingClientRect(), fold = box.bottom - 56;
    let target = null, label = "";
    const sibs = content.querySelector(".fv-sibs:not(.is-empty)");
    const fams = content.querySelector(".fv-fams");
    if (sibs && sibs.getBoundingClientRect().top + 60 > fold) { target = sibs; label = "Brothers and sisters"; }
    else if (fams && fams.getBoundingClientRect().top + 60 > fold) {
      const kids = fams.querySelector(".fv-kids"), spouse = fams.querySelector(".fv-spouse [data-go]");
      // "No spouse or children recorded" isn't worth a button
      if (kids || spouse) { target = fams; label = kids ? "Children" : "Spouse"; }
    }
    cueTarget = target;
    cueEl.classList.toggle("is-on", !!target);
    if (target) cueEl.querySelector(".fv-cue-text").textContent = label;
  }
  const queueCue = () => { if (!cueFrame) cueFrame = requestAnimationFrame(updateCue); };
  function scrollToCue() {
    if (!cueTarget) return;
    const box = scroller.getBoundingClientRect();
    const stuck = crumbsEl && !crumbsEl.hidden && getComputedStyle(crumbsEl).position === "sticky" ? crumbsEl.offsetHeight : 0;
    const top = cueTarget.getBoundingClientRect().top - box.top + scroller.scrollTop - stuck - 8;
    scroller.scrollTo({ top: Math.max(0, top), behavior: noMotion() ? "auto" : "smooth" });
  }

  function render(pid, { animate = false, keepScroll = false } = {}) {
    const p = person(pid) || person(App.ROOT);
    if (!p || !scroller) return;
    const move = pending && pending.pid === p.id ? pending : null;
    pending = null;
    stopAnimations();
    // keyboard users keep their place: the new focus card takes focus (a tap leaves focus alone)
    const active = document.activeElement;
    let hadKeyboard = false;
    try { hadKeyboard = rootEl.contains(active) && active.matches(":focus-visible"); } catch (e) { /* old browser */ }
    const old = content;
    const motion = animate && old && !noMotion() && rootEl.getClientRects().length > 0 && rootEl.offsetWidth > 0;
    let snap = null;
    if (motion) {
      snap = { keys: new Map(), strip: new Map(), box: old.getBoundingClientRect(), root: rootEl.getBoundingClientRect() };
      for (const n of old.querySelectorAll("[data-key]")) {
        const rec = { rect: n.getBoundingClientRect(), node: n };
        if (!snap.keys.has(n.dataset.key)) snap.keys.set(n.dataset.key, rec);
        if (n.closest(".fv-strip")) snap.strip.set(n.dataset.pid, rec);
      }
      snap.extras = [...old.querySelectorAll(".fv-x")].filter(n => !n.closest("[data-key]"));
      snap.rects = new Map(snap.extras.map(n => [n, n.getBoundingClientRect()]));
    }
    const prevScroll = scroller.scrollTop;
    const prevFocus = current;
    current = p.id;
    renderCrumbs();
    const next = build(p);
    if (old) old.replaceWith(next); else inner.append(next);
    content = next;
    centerStrip(next);
    scroller.scrollTop = keepScroll ? prevScroll : targetScroll(next);
    if (prevFocus && prevFocus !== p.id) liveEl.textContent = `Showing the family of ${p.name}`;
    if (hadKeyboard) {
      const card = next.querySelector(".fv-lg");
      if (card) card.focus({ preventScroll: true });
    }
    if (motion) animateMove(old, next, snap, move);
    queueCue();
  }

  /* identity of a label, connector or placeholder: what it is, what it says and where it sits */
  const extraSig = (node, r) => `${node.className}|${node.textContent}|${Math.round(r.left)},${Math.round(r.top)},${Math.round(r.width)},${Math.round(r.height)}`;

  /* move a card from its old box to its new one. The scale is uniform (around the centers) so names never
     stretch; a card that changes size a lot also fades up a little on the way. */
  function flip(node, from, hero = false) {
    const to = node.getBoundingClientRect();
    if (!to.width || !to.height) return;
    const dx = (from.left + from.width / 2) - (to.left + to.width / 2);
    const dy = (from.top + from.height / 2) - (to.top + to.height / 2);
    const s = Math.min(3, Math.max(.3, Math.sqrt((from.width / to.width) * (from.height / to.height))));
    if (Math.abs(dx) < 1 && Math.abs(dy) < 1 && Math.abs(s - 1) < .01) return;
    node.classList.add("is-moving");
    const big = !hero && Math.abs(Math.log(s)) > .45;
    const a = play(node, [
      { transform: `translate(${dx}px, ${dy}px) scale(${s})`, opacity: big ? .35 : 1 },
      { transform: "none", opacity: 1 },
    ], { duration: MOVE_MS, easing: EASE });
    const done = () => node.classList.remove("is-moving");
    a.finished.then(done, done);
  }
  function fadeIn(node, delay = 110) {
    play(node, [{ opacity: 0, transform: "translateY(6px)" }, { opacity: 1, transform: "none" }],
      { duration: FADE_MS, delay, easing: "ease-out" });
  }

  /* FLIP: everyone who was on screen before moves from where they were to where they are now; the tapped
     card travels into the focus position; new people and the labels and connectors fade in, while the
     outgoing content (in the overlay, exactly where it was) fades out. A swipe slides the focus instead. */
  function animateMove(old, next, snap, move) {
    const swipe = move && move.dir ? move : null;
    const used = new Set();
    const take = rec => (rec && !used.has(rec.node) ? (used.add(rec.node), rec.rect) : null);

    for (const node of next.querySelectorAll("[data-key]")) {
      const key = node.dataset.key;
      let from = null;
      if (node.classList.contains("fv-lg")) {
        if (swipe) {
          play(node, [{ opacity: 0, transform: `translateX(${swipe.dir * 38}%)` }, { opacity: 1, transform: "none" }],
            { duration: MOVE_MS - 60, easing: EASE });
          continue;
        }
        from = move && move.node ? take({ rect: move.rect, node: move.node }) : take(snap.keys.get(key));
      } else if (node.closest(".fv-strip")) {
        // strip cards slide within the strip, even if their old card also became the focus card
        const rec = snap.strip.get(node.dataset.pid);
        if (rec) { used.add(rec.node); from = rec.rect; }
        else if (!swipe) from = take(snap.keys.get(key));
      } else {
        from = take(snap.keys.get(key));
      }
      if (from) flip(node, from, node.classList.contains("fv-lg"));
      else fadeIn(node);
    }
    // labels, connectors, notes and placeholders: the ones that didn't change or move stay put
    const still = new Map();
    for (const node of snap.extras) {
      const sig = extraSig(node, snap.rects.get(node));
      still.set(sig, node);
    }
    for (const node of next.querySelectorAll(".fv-x")) {
      if (node.closest("[data-key]")) continue;
      const twin = still.get(extraSig(node, node.getBoundingClientRect()));
      if (twin) used.add(twin);
      else fadeIn(node, 90);
    }

    // the outgoing content: pinned where it was, people who moved hidden, the rest fading out
    old.classList.add("fv-ghost");
    Object.assign(old.style, {
      left: `${snap.box.left - snap.root.left}px`, top: `${snap.box.top - snap.root.top}px`, width: `${snap.box.width}px`,
    });
    for (const n of used) if (old.contains(n)) n.style.visibility = "hidden";
    const oldStrip = old.querySelector(".fv-strip"), stripScroll = oldStrip ? oldStrip.scrollLeft : 0;
    overlay.append(old);
    if (oldStrip) oldStrip.scrollLeft = stripScroll;   // re-parenting resets it
    if (swipe) {
      const card = old.querySelector(".fv-lg");
      if (card) {
        play(card, [{ transform: card.style.transform || "none", opacity: 1 }, { transform: `translateX(${-swipe.dir * 105}%)`, opacity: 0 }],
          { duration: MOVE_MS - 80, easing: EASE, fill: "forwards" });
      }

    const out = play(old, [{ opacity: 1 }, { opacity: 0 }], { duration: swipe ? MOVE_MS - 80 : GHOST_MS, easing: "ease-out", fill: "forwards" });
    out.finished.then(() => old.remove(), () => {});
  }

  /* ------------------------------------------------------------ input */
  let swallowClick = false;          // a swipe ends with a click on the card; ignore that one

  /* move to pid. From a tap the card's rect is the start of the move; from a swipe or step, dir = ±1 */
  function goTo(pid, how = {}) {
    if (!P[pid] || pid === current) return;
    pending = { pid, ...how };
    // browsing doesn't pop the sheet open; if it is already open it follows along
    App.go(pid, { select: !!App.state.selected });
  }

  function onClick(e) {
    if (swallowClick) { swallowClick = false; e.preventDefault(); return; }
    const t = e.target.closest("[data-go], [data-open]");
    if (!t || !rootEl.contains(t)) return;
    if (t.dataset.open) { App.select(current); return; }
    const pid = t.dataset.go;
    if (t.dataset.step) goTo(pid, { dir: Number(t.dataset.step) });
    else goTo(pid, { rect: t.getBoundingClientRect(), node: t });
  }

  function siblingStep(dir) {
    const p = person(current);
    if (!p) return null;
    const order = siblingsInOrder(p);
    return order[order.indexOf(current) + dir] || null;
  }

  /* arrows: ←/→ older/younger sibling, ↑ father (Shift+↑ mother), ↓ first child. Only while a card has focus. */
  function onKey(e) {
    if (e.altKey || e.ctrlKey || e.metaKey || !e.target.closest || !e.target.closest(".fv-card, .fv-crumb-btn, .fv-step")) return;
    const p = person(current);
    if (!p) return;
    let pid = null, how = {};
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
      const dir = e.key === "ArrowLeft" ? -1 : 1;
      pid = siblingStep(dir);
      how = { dir };
    } else if (e.key === "ArrowUp") {
      pid = e.shiftKey ? p.mother || p.father : p.father || p.mother;
    } else if (e.key === "ArrowDown") {
      // back down to the child we came from, else the eldest child
      const kids = (p.fams || []).flatMap(f => f.kids || []).filter(k => P[k]);
      const cameFrom = trail[trail.length - 2];
      pid = kids.includes(cameFrom) ? cameFrom
        : kids.slice().sort((a, b) => (birthYear(P[a]) || 9999) - (birthYear(P[b]) || 9999))[0] || null;
    } else return;
    e.preventDefault();
    if (!pid || !P[pid]) return;
    if (!how.dir && content) {
      const node = content.querySelector(`[data-key="${CSS.escape(pid)}"]`);
      if (node) how = { rect: node.getBoundingClientRect(), node };
    }
    goTo(pid, how);
  }

  /* swipe the focus card left (younger) or right (older); it follows the finger and springs back if the
     swipe is too short or there is nobody that way. touch-action: pan-y keeps vertical scrolling native. */
  function wireSwipe() {
    let drag = null;
    scroller.addEventListener("pointerdown", e => {
      const card = e.target.closest(".fv-lg");
      if (!card || (e.pointerType === "mouse" && e.button !== 0)) return;
      drag = { id: e.pointerId, x: e.clientX, y: e.clientY, card, dx: 0, active: false, vx: 0, lastX: e.clientX, lastT: e.timeStamp };
    });
    scroller.addEventListener("pointermove", e => {
      if (!drag || e.pointerId !== drag.id) return;
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (!drag.active) {
        if (Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)) { drag = null; return; }
        if (Math.abs(dx) < 10 || Math.abs(dx) < Math.abs(dy) * 1.3) return;
        drag.active = true;
        drag.prev = siblingStep(-1);
        drag.next = siblingStep(1);
        drag.card.classList.add("is-dragging");
        try { drag.card.setPointerCapture(e.pointerId); } catch (err) { /* not capturable */ }
      }
      const toward = dx < 0 ? drag.next : drag.prev;
      drag.dx = toward ? dx : dx * .22;      // rubber-band when there's nobody that way
      drag.card.style.transform = `translateX(${drag.dx}px)`;
      const dt = Math.max(1, e.timeStamp - drag.lastT);
      drag.vx = (e.clientX - drag.lastX) / dt;
      drag.lastX = e.clientX;
      drag.lastT = e.timeStamp;
    });
    const end = e => {
      if (!drag || e.pointerId !== drag.id) return;
      const d = drag;
      drag = null;
      if (!d.active) return;
      d.card.classList.remove("is-dragging");
      swallowClick = true;
      setTimeout(() => { swallowClick = false; }, 400);
      const toward = d.dx < 0 ? d.next : d.prev;
      const far = Math.abs(d.dx) > Math.min(90, d.card.offsetWidth * .22);
      const flick = Math.abs(d.vx) > .45 && Math.abs(d.dx) > 24 && Math.sign(d.vx) === Math.sign(d.dx);
      if (e.type !== "pointercancel" && toward && (far || flick)) {
        goTo(toward, { dir: d.dx < 0 ? 1 : -1 });
      } else {
        const from = d.card.style.transform;
        d.card.style.transform = "";
        if (from && !noMotion()) d.card.animate([{ transform: from }, { transform: "none" }], { duration: 260, easing: EASE });
      }
    };
    scroller.addEventListener("touchstart", () => {}, { passive: true });   // lets iOS show :active on cards
    scroller.addEventListener("pointerup", end);
    scroller.addEventListener("pointercancel", end);
  }

  /* ------------------------------------------------------------ module */
  function mount(host) {
    scroller = el("div", { class: "fv-scroll" });
    inner = el("div", { class: "fv-inner" });
    crumbsEl = el("nav", { class: "fv-crumbs", "aria-label": "Recently viewed", hidden: true });
    overlay = el("div", { class: "fv-overlay", "aria-hidden": "true" });
    liveEl = el("p", { class: "sr-only", "aria-live": "polite" });
    cueEl = el("div", { class: "fv-cue", "aria-hidden": "true" },
      el("button", { type: "button", class: "fv-cue-btn", tabindex: "-1", onclick: scrollToCue },
        el("span", { class: "fv-cue-text" }), icon("chevron-down", 16)));
    inner.append(crumbsEl);
    scroller.append(inner);
    scroller.addEventListener("scroll", queueCue, { passive: true });
    rootEl = el("div", { class: "fv", onclick: onClick, onkeydown: onKey }, scroller, overlay, cueEl, liveEl);
    host.replaceChildren(rootEl);
    wireSwipe();
    if (window.ResizeObserver) {
      resizeObs = new ResizeObserver(() => {
        cancelAnimationFrame(resizeFrame);
        resizeFrame = requestAnimationFrame(() => { centerStrip(content); updateCue(); });
      });
      resizeObs.observe(rootEl);
    }
    // a view switch shows this view with app.js's own fade, so the next focus() shouldn't also animate
    App.on("view", name => { if (name === "family") skipNextMotion = true; });
    const start = resolvePid(App.state.focus) || App.ROOT;
    trail = [start];
    render(start);
  }
  function focus(pid) {
    if (!rootEl) return;
    const id = resolvePid(pid) || App.ROOT;
    const animate = !skipNextMotion;
    skipNextMotion = false;
    if (id === current) { pending = null; return; }
    updateTrail(id);
    render(id, { animate });
  }

  function refresh() {
    if (rootEl && current) render(current, { keepScroll: true });
  }

  App.family = { mount, focus, refresh };
})();

<script>/* person.js */
/* person.js: the person panel. Docked on the right of the tree on desktop, floating over the stage on
   tablets, and a bottom sheet with two snap points on phones. Registers App.person = {mount, show, close}.
   app.js calls show(pid) / close() from the "select" event and toggles .is-open on #person-panel. */
(() => {
  const GALLERY_KINDS = ["photo", "headstone", "document", "story"];
  const GALLERY_LIMIT = 9;        // thumbnails before "Show all"
  const RECORD_LIMIT = 6;         // record rows before "Show all"
  const CITE_LIMIT = 2;           // sources per fact before "N more sources"
  const HALF = 0.45;              // phone half snap: visible share of the viewport
  const LEVEL_LABELS = { error: "Error", duplicate: "Duplicate", check: "To check" };

  let panel = null;               // #person-panel
  let shell = null;               // .pp, the one child of the panel
  let scroller = null;            // .pp-scroll
  let body = null;                // .pp-body (re-rendered per person)
  let barName = null;             // compact name in the top bar (shown once the hero scrolls away)
  let barKicker = null;           // relationship + line in the top bar
  let scrim = null;               // phone scrim
  let current = null;             // pid on show
  let isOpen = false;
  let returnTo = null;            // element to refocus on close
  let snap = "half";              // phone snap: "half" | "full"
  let heroWatch = null;           // IntersectionObserver for the compact bar name
  const expanded = new Set();     // "gallery", "records", "ev:<i>" sections opened by the user (per person)

  const safely = (what, fn) => {
    try { return fn(); } catch (err) { console.error(`[person] ${what} failed:`, err); return undefined; }
  };

  /* ---------------------------------------------------------------- small helpers */
  const editor = () => (App.editor && typeof App.editor === "object" ? App.editor : null);
  const reducedMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const firstEvent = (p, ...tags) => {
    for (const t of tags) {
      const e = (p.ev || []).find(x => x.tag === t && (x.date || x.place));
      if (e) return e;
    }
    return null;
  };
  const YEAR = /\b(1[5-9]\d\d|20\d\d)\b/;
  /* the year a record or item is from. A record's own event date wins over m.year, which is sometimes the
     person's birth year (a death certificate indexed by birth year), then m.year, then a year in the title. */
  const EVENT_FIELD = /^(death|burial|marriage|residence|event|registration|arrival|departure|immigration|enlistment|military|obituary|publication|issue|claim|enumerat(ed|ion)|record) (date|year)$/i;
  const yearOf = m => {
    if (!m) return null;
    for (const [label, value] of m.fields || []) {
      if (EVENT_FIELD.test(String(label).trim()) && YEAR.test(value || "")) return +YEAR.exec(value)[1];
    }
    if (m.year) return +m.year;
    const y = YEAR.exec(m.date || "") || YEAR.exec(m.kind === "record" ? m.title || m.coll || "" : "");
    return y ? +y[1] : null;
  };
  const sortByYear = list => list
    .map((m, i) => ({ m, i, y: yearOf(m) }))
    .sort((a, b) => (a.y == null) - (b.y == null) || (a.y || 0) - (b.y || 0) || a.i - b.i)
    .map(x => x.m);
  const byBirth = pids => pids
    .map((pid, i) => ({ pid, i, by: P[pid] && !isHidden(P[pid]) ? P[pid].by : null }))
    .sort((a, b) => (a.by == null) - (b.by == null) || (a.by || 0) - (b.by || 0) || a.i - b.i)
    .map(x => x.pid);
  /* places without the country and repeats: "Exeter, Luzerne, Pennsylvania" (full) and "Exeter, Pennsylvania" (brief) */
  const placeParts = place => {
    const out = [];
    for (const s of String(place || "").split(",").map(x => x.trim()).filter(Boolean)) {
      if (/^(usa|united states( of america)?|u\.s\.a\.?)$/i.test(s)) continue;
      if (!out.includes(s)) out.push(s);
    }
    return out;
  };
  const fullPlace = place => placeParts(place).join(", ");
  const briefPlace = place => {
    const parts = placeParts(place);
    return parts.length > 2 ? `${parts[0]}, ${parts[parts.length - 1]}` : parts.join(", ");
  };
  const imageOf = m => (m && m.file !== "pdf" ? m.thumb || m.src || "" : "");
  /* an avatar beside the visible name is decorative: the button already says the name once */
  const decorative = node => { if (node) { node.setAttribute("aria-hidden", "true"); node.removeAttribute("role"); node.removeAttribute("aria-label"); } return node; };

  /* a section: hairline-topped, a tracked-caps label with an optional count, then the content */
  const section = (id, title, count, ...content) => el("section", { class: "pp-section", id: `pp-${id}`, "aria-labelledby": `pp-${id}-title` },
    el("h3", { class: "pp-section-head", id: `pp-${id}-title` },
      el("span", { class: "label label-lg", text: title }),
      count != null && el("span", { class: "pp-count", text: count })),
    content);
  /* "Show all 14" / "Show fewer" under a clipped list */
  const moreButton = (key, total, shown, noun) => total > shown || expanded.has(key)
    ? el("button", {
      class: "pp-more", type: "button", "aria-expanded": String(expanded.has(key)), dataset: { ppKey: `more:${key}` },
      onclick: () => { expanded.has(key) ? expanded.delete(key) : expanded.add(key); rerender(); },
    }, expanded.has(key) ? "Show fewer" : `Show all ${total} ${noun}`, icon(expanded.has(key) ? "chevron-up" : "chevron-down", 16))
    : null;

  /* ---------------------------------------------------------------- the shell */
  function buildShell() {
    barName = el("span", { class: "pp-bar-name", "aria-hidden": "true" });
    barKicker = el("div", { class: "pp-bar-kicker" });
    const handle = el("button", {
      class: "pp-handle", type: "button", "aria-label": "Expand the details",
      onclick: () => setSnap(snap === "full" ? "half" : "full"),
    }, el("span", { class: "pp-handle-bar", "aria-hidden": "true" }));
    const bar = el("div", { class: "pp-bar" },
      el("div", { class: "pp-bar-lead" }, barKicker, barName),
      el("button", {
        class: "btn btn-ghost btn-icon pp-close", type: "button", "aria-label": "Close the details",
        onclick: () => App.select(null),
      }, icon("close", 20)));
    body = el("div", { class: "pp-body" });
    scroller = el("div", { class: "pp-scroll", tabindex: "-1" }, body);
    shell = el("div", { class: "pp" }, el("div", { class: "pp-grab" }, handle, bar), scroller);
    return shell;
  }

  /* ---------------------------------------------------------------- hero */
  function portrait(p, gallery) {
    const photo = photoOf(p);
    const mono = () => el("span", { class: "pp-portrait-initials", "aria-hidden": "true", text: initials(p) });
    if (!photo) {
      return el("div", { class: "pp-portrait is-mono", role: "img", "aria-label": `${p.name} (no photo)` }, mono());
    }
    const img = el("img", {
      src: mediaUrl(photo.url), alt: `Photo of ${p.name}`, decoding: "async", draggable: "false",
      style: p.photoPos ? { objectPosition: p.photoPos } : null,
    });
    const box = el("button", {
      class: "pp-portrait is-photo", type: "button", "aria-label": `Open the photo of ${p.name}`,
      onclick: () => App.openMedia(photo.m.id, gallery.includes(photo.m.id) ? gallery : [photo.m.id]),
    }, img);
    img.addEventListener("error", () => {
      box.replaceWith(el("div", { class: "pp-portrait is-mono", role: "img", "aria-label": p.name }, mono()));
    }, { once: true });
    return box;
  }

  function vitals(p) {
    const rows = [];
    const add = (label, e) => {
      if (!e) return;
      const place = briefPlace(e.place);
      rows.push(el("div", { class: "pp-vital" },
        el("dt", { class: "label", text: label }),
        el("dd", {}, e.date && el("span", { class: "pp-vital-date", text: e.date }), place && el("span", { class: "pp-vital-place", text: place }))));
    };
    const birth = firstEvent(p, "BIRT");
    add(birth ? "Born" : "Baptized", birth || firstEvent(p, "CHR", "BAPM"));
    if (!p.living) {
      const death = firstEvent(p, "DEAT");
      add(death ? "Died" : "Buried", death || firstEvent(p, "BURI"));
    }
    return rows.length ? el("dl", { class: "pp-vitals" }, rows) : null;
  }

  function kicker(p) {
    const line = LINE_NAMES[p.line] || "";
    return el("p", { class: "pp-kicker" },
      el("span", { class: "marker marker-lg", "aria-hidden": "true" }),
      el("span", { class: "pp-kicker-rel", text: p.rel || "Relative" }),
      line && line !== p.rel && el("span", { class: "pp-kicker-line" }, el("span", { text: line })));
  }

  function heroMeta(p) {
    if (isHidden(p)) return null;
    const bits = [];
    if (p.ahn && p.gen) bits.push(p.gen === 0 ? "Direct line" : `Direct ancestor, ${plural(p.gen, "generation")} back`);
    if (p.nsrc) bits.push(plural(p.nsrc, "source"));
    else if (!p.living) bits.push("No sources yet");
    return bits.length ? el("p", { class: "pp-meta", text: bits.join(" · ") }) : null;
  }

  function issueChip(p) {
    const list = issuesOf(p);
    if (!list.length) return null;
    const order = ["error", "duplicate", "check"];
    const worst = order.find(l => list.some(it => it.level === l)) || "check";
    return el("button", {
      class: `pp-issue-chip is-${worst}`, type: "button",
      onclick: () => {
        // scroll only the panel (scrollIntoView would move the page too)
        const target = document.getElementById("pp-issues");
        if (target && scroller) scroller.scrollTo({ top: Math.max(0, target.offsetTop - 8), behavior: reducedMotion() ? "auto" : "smooth" });
      },
    }, el("span", { class: "marker", "aria-hidden": "true" }),
      plural(list.length, "thing to fix", "things to fix"), icon("chevron-down", 14));
  }

  function hero(p, gallery) {
    const hidden = isHidden(p);
    const yrs = hidden ? "" : years(p);
    return el("header", { class: "pp-hero", style: { "--lc": lineColor(p) } },
      el("div", { class: ["pp-hero-grid", (hidden || !firstEvent(p, "BIRT", "CHR", "BAPM", "DEAT", "BURI")) && !photoOf(p) && "is-compact"] },
        portrait(p, gallery),
        el("div", { class: "pp-hero-text" },
          el("h2", { class: "pp-name", id: "pp-name", tabindex: "-1", text: p.name }),
          yrs && el("p", { class: "pp-years", text: yrs }),
          hidden ? null : vitals(p))),
      hidden && el("div", { class: "pp-private" },
        icon("info", 18),
        el("div", {},
          el("p", { class: "pp-private-title", text: "Details of living people are private." }),
          el("p", { text: "This shared page shows only their name and how they're related. Dates, places, photos and records stay off it." }))),
      heroMeta(p),
      issueChip(p));
  }

  /* ---------------------------------------------------------------- actions */
  /* What the editor says about uploads for pid: {ok: true} or {ok: false, reason: "..."}, or null with no editor.
     canUpload may return a boolean or {ok, reason}. A refusal's text comes from editor.uploadReason(pid) when
     the editor has it. openUpload handles connecting, so a refusal that is only "not connected yet" (no
     reason given, uploadReason says "", and the person isn't living) still shows the button. */
  function uploadVerdict(pid) {
    const ed = editor();
    if (!ed || typeof ed.openUpload !== "function") return null;
    const p = P[pid];
    let verdict = true;
    if (typeof ed.canUpload === "function") verdict = safely("editor.canUpload", () => ed.canUpload(pid));
    if (verdict && typeof verdict === "object") {
      return verdict.ok ? { ok: true } : { ok: false, reason: verdict.reason || defaultReason(p) };
    }
    if (verdict) return { ok: true };
    // not connected yet: offer the button only in an editor's browser (openUpload connects first)
    if (typeof ed.offer === "function") {
      if (safely("editor.offer", () => ed.offer(pid))) return { ok: true };
      const said = typeof ed.uploadReason === "function" ? safely("editor.uploadReason", () => ed.uploadReason(pid)) : "";
      // ordinary visitors get neither a button nor an explanation
      return said ? { ok: false, reason: said } : null;
    }
    const said = typeof ed.uploadReason === "function" ? safely("editor.uploadReason", () => ed.uploadReason(pid)) : null;
    if (typeof said === "string" && said) return { ok: false, reason: said };
    if (!p || p.living) return { ok: false, reason: defaultReason(p) };
    return { ok: true };
  }
  const defaultReason = p => (p && p.living
    ? "Photos can't be added for people who may be living: everything added here is public."
    : "Photos can't be added for this person.");

  function actions(p) {
    const pid = p.id;
    const centered = App.state.focus === pid;
    const buttons = [
      el("button", {
        class: "btn btn-sm btn-primary", type: "button", dataset: { ppKey: "center" },
        title: centered ? "The tree is centered on this person" : null,
        onclick: () => centerHere(pid),
      }, icon("center", 18), el("span", { text: "Center tree here" })),
    ];
    if (App.state.view !== "family" && typeof App.setView === "function") {
      buttons.push(el("button", {
        class: "btn btn-sm", type: "button", dataset: { ppKey: "family" },
        onclick: () => { App.go(pid, { replace: App.state.focus === pid }); App.setView("family"); },
      }, icon("family", 18), el("span", { text: "Show in Family view" })));
    }
    const verdict = uploadVerdict(pid);
    if (verdict && verdict.ok) {
      buttons.push(el("button", {
        class: "btn btn-sm", type: "button", dataset: { ppKey: "upload" },
        onclick: () => safely("editor.openUpload", () => editor().openUpload(pid)),
      }, icon("upload", 18), el("span", { text: "Add photo or document" })));
    }
    return el("div", { class: "pp-actions" },
      el("div", { class: "pp-actions-row" }, buttons),
      verdict && !verdict.ok && el("p", { class: "pp-note" }, icon("info", 16), el("span", { text: verdict.reason })));
  }

  function centerHere(pid) {
    App.go(pid, { replace: App.state.focus === pid && App.state.selected === pid });
    // on a phone the sheet hides the tree, so get out of the way
    if (isPhone()) App.select(null);
  }

  /* ---------------------------------------------------------------- photos */
  function galleryTile(m, list) {
    const label = `${kindLabel(m)}: ${m.title || "untitled"}`;
    const open = () => App.openMedia(m.id, list);
    const url = imageOf(m);
    const badge = m.kind !== "photo" && m.kind !== "story" && el("span", { class: "pp-tile-kind", text: kindLabel(m) });
    if (m.kind === "story") {
      const excerpt = String(m.text || m.desc || "").replace(/\s+/g, " ").trim();
      return el("button", { class: "pp-tile is-story", type: "button", "aria-label": label, title: m.title || "Story", onclick: open },
        el("span", { class: "label", text: "Story" }),
        el("span", { class: "pp-tile-title", text: m.title || "Story" }),
        excerpt && el("span", { class: "pp-tile-excerpt", text: excerpt }));
    }
    if (!url) {
      return el("button", { class: "pp-tile is-file", type: "button", "aria-label": label, title: m.title || "", onclick: open },
        icon("document", 26), el("span", { class: "pp-tile-title", text: m.title || kindLabel(m) }));
    }
    const tile = el("button", { class: "pp-tile is-image", type: "button", "aria-label": label, title: m.title || "", onclick: open });
    const img = el("img", { src: mediaUrl(url), alt: m.title || kindLabel(m), loading: "lazy", decoding: "async", draggable: "false" });
    img.addEventListener("error", () => {
      tile.classList.replace("is-image", "is-file");
      tile.replaceChildren(icon("image", 26), el("span", { class: "pp-tile-title", text: m.title || kindLabel(m) }));
    }, { once: true });
    tile.append(img, badge || "");
    return tile;
  }

  function gallerySection(items) {
    if (!items.length) return null;
    const list = items.map(m => m.id);
    const open = expanded.has("gallery");
    const shown = open ? items : items.slice(0, GALLERY_LIMIT);
    // "Photos" only when that's all it holds; with papers and stories mixed in it's the gallery
    const allPhotos = items.every(m => (m.kind === "photo" || m.kind === "headstone") && m.file !== "pdf");
    return section("photos", allPhotos ? "Photos" : "Gallery", items.length,
      el("div", { class: "pp-grid" }, shown.map(m => galleryTile(m, list))),
      moreButton("gallery", items.length, GALLERY_LIMIT, allPhotos ? "photos" : "items"));
  }

  /* ---------------------------------------------------------------- documents (records) */
  function recordRow(m, list) {
    const url = imageOf(m);
    const thumb = url
      ? el("span", { class: "pp-doc-thumb" }, el("img", { src: mediaUrl(url), alt: "", loading: "lazy", decoding: "async", draggable: "false" }))
      : el("span", { class: "pp-doc-thumb is-icon" }, icon("document", 22));
    const img = thumb.querySelector("img");
    if (img) img.addEventListener("error", () => { thumb.classList.add("is-icon"); thumb.replaceChildren(icon("document", 22)); }, { once: true });
    const year = yearOf(m);
    const coll = m.coll || m.title || kindLabel(m);
    const meta = [year, m.name && `as ${m.name}`].filter(Boolean).join(" · ");
    return el("li", {},
      el("button", { class: "pp-doc", type: "button", "aria-label": `${kindLabel(m)}: ${coll}${year ? `, ${year}` : ""}`, onclick: () => App.openMedia(m.id, list) },
        thumb,
        el("span", { class: "pp-doc-text" },
          el("span", { class: "label pp-doc-type", text: kindLabel(m) }),
          el("span", { class: "pp-doc-title", text: coll }),
          meta && el("span", { class: "pp-doc-meta", text: meta })),
        icon("chevron-right", 18)));
  }

  function recordsSection(records) {
    if (!records.length) return null;
    const list = records.map(m => m.id);
    const open = expanded.has("records");
    const shown = open ? records : records.slice(0, RECORD_LIMIT);
    return section("documents", "Documents", records.length,
      el("ul", { class: "pp-docs" }, shown.map(m => recordRow(m, list))),
      moreButton("records", records.length, RECORD_LIMIT, "documents"));
  }

  /* ---------------------------------------------------------------- life (facts timeline) */
  function cite(s, recordIds) {
    const title = s.t || "Source";
    const detail = s.p && s.p !== s.u ? s.p : null;
    if (s.m && media(s.m)) {
      return el("li", {}, el("button", {
        class: "pp-cite is-record", type: "button", title: detail,
        onclick: () => App.openMedia(s.m, recordIds.includes(s.m) ? recordIds : [s.m]),
      }, icon("document", 15), el("span", { text: title })));
    }
    if (s.u && /^https?:\/\//i.test(s.u)) {
      return el("li", {}, el("a", { class: "pp-cite is-link", href: s.u, target: "_blank", rel: "noopener noreferrer", title: detail },
        icon("external", 15), el("span", { text: title }), el("span", { class: "sr-only", text: " (opens in a new tab)" })));
    }
    return el("li", {}, el("span", { class: "pp-cite is-text", title: detail }, el("span", { class: "pp-cite-dot", "aria-hidden": "true" }), el("span", { text: title })));
  }

  function cites(e, i, recordIds) {
    const src = (e.src || []).filter(s => s && (s.t || s.u));
    if (!src.length) return null;
    const key = `ev:${i}`;
    const open = expanded.has(key);
    const shown = open || src.length <= CITE_LIMIT + 1 ? src : src.slice(0, CITE_LIMIT);
    const rest = src.length - shown.length;
    return el("div", { class: "pp-cites" },
      el("ul", {}, shown.map(s => cite(s, recordIds))),
      (rest > 0 || open) && src.length > CITE_LIMIT + 1 && el("button", {
        class: "pp-cites-more", type: "button", "aria-expanded": String(open), dataset: { ppKey: `cites:${i}` },
        onclick: () => { open ? expanded.delete(key) : expanded.add(key); rerender(); },
      }, open ? "Fewer sources" : `${plural(rest, "more source")}`));
  }

  /* Ancestry often has the same birth or death several times with different places. Consecutive facts with the
     same tag and date become one row: the first place, then "Also recorded" with the others, sources combined. */
  const MERGE_TAGS = new Set(["BIRT", "CHR", "BAPM", "DEAT", "BURI", "MARR"]);
  function mergedEvents(p) {
    const out = [];
    (p.ev || []).forEach((e, i) => {
      if (!(e.date || e.place || e.detail || (e.src || []).length)) return;
      const prev = out[out.length - 1];
      if (prev && MERGE_TAGS.has(e.tag) && prev.e.tag === e.tag && prev.e.date === e.date && !e.detail) {
        const place = fullPlace(e.place);
        if (place && place !== fullPlace(prev.e.place) && !prev.also.includes(place)) prev.also.push(place);
        const seen = new Set(prev.e.src.map(s => `${s.t}|${s.m || s.u || ""}`));
        for (const s of e.src || []) if (!seen.has(`${s.t}|${s.m || s.u || ""}`)) prev.e.src.push(s);
        prev.e.res = prev.e.res || e.res;
        return;
      }
      out.push({ e: { ...e, src: [...(e.src || [])] }, i, also: [] });
    });
    return out;
  }

  function lifeSection(p, recordIds) {
    const events = mergedEvents(p);
    if (!events.length) return null;
    return section("life", "Life", null,
      el("ol", { class: "pp-life" }, events.map(({ e, i, also }) => {
        const place = fullPlace(e.place);
        return el("li", { class: ["pp-fact", e.res && "is-research", !e.date && "is-undated", (e.tag === "BIRT" || e.tag === "DEAT") && "is-key"] },
          el("span", { class: "pp-fact-date", text: e.date || "" }),
          el("div", { class: "pp-fact-main" },
            el("p", { class: "pp-fact-head" },
              el("span", { class: "pp-fact-label", text: e.label || e.tag || "Fact" }),
              e.res && el("span", { class: "pp-badge", title: "From research beyond the Ancestry tree", text: "Research" })),
            place && el("p", { class: "pp-fact-place", title: e.place !== place ? e.place : null, text: place }),
            also.length > 0 && el("p", { class: "pp-fact-also" }, el("span", { class: "label", text: "Also recorded" }), also.join("; ")),
            e.detail && el("p", { class: "pp-fact-detail", text: e.detail }),
            cites(e, i, recordIds)));
      })));
  }

  /* ---------------------------------------------------------------- family */
  function relRow(pid, { note = "", key = "" } = {}) {
    const p = P[pid];
    if (!p) return null;
    const meta = [years(p), p.rel].filter(Boolean).join(" · ");
    return el("li", {},
      el("button", {
        class: "pp-rel", type: "button", style: { "--lc": lineColor(p) }, dataset: { ppKey: `rel:${key}${pid}` },
        onclick: () => App.go(pid, { focus: false }),
      },
        decorative(avatar(p, { size: 36, decorative: true })),
        el("span", { class: "pp-rel-text" },
          el("span", { class: "pp-rel-name", text: p.name }),
          meta && el("span", { class: "pp-rel-meta", text: meta }),
          note && el("span", { class: "pp-rel-note", text: note })),
        icon("chevron-right", 18)));
  }
  const unknownRow = text => el("li", {}, el("div", { class: "pp-rel is-unknown" },
    el("span", { class: "pp-rel-blank", "aria-hidden": "true" }),
    el("span", { class: "pp-rel-text" }, el("span", { class: "pp-rel-name", text }))));
  const group = (title, rows) => {
    const items = rows.filter(Boolean);
    return items.length ? el("div", { class: "pp-fam-group" },
      el("h4", { class: "label", text: title }),
      el("ul", { class: "pp-rels" }, items)) : null;
  };
  const marriageNote = (p, fam) => {
    const spouse = fam.spouse && P[fam.spouse];
    if (!fam.marr || isHidden(p) || (spouse && isHidden(spouse))) return "";
    return `Married ${fam.marr}`;
  };

  function familySection(p) {
    const fams = p.fams || [];
    const father = p.father && P[p.father], mother = p.mother && P[p.mother];
    const parents = group("Parents", father || mother ? [
      father ? relRow(p.father, { key: "f" }) : unknownRow("Father not recorded"),
      mother ? relRow(p.mother, { key: "m" }) : unknownRow("Mother not recorded"),
    ] : [unknownRow("Parents not recorded")]);
    const spouseRows = fams.filter(f => f.spouse && P[f.spouse]).map(f => relRow(f.spouse, { note: marriageNote(p, f), key: "s" }));
    const withKids = fams.filter(f => (f.kids || []).some(k => P[k]));
    const childGroups = withKids.map(f => {
      const other = f.spouse && P[f.spouse];
      const title = withKids.length > 1 ? (other ? `Children with ${firstName(other)}` : "Children, other parent not recorded") : "Children";
      return group(title, byBirth(f.kids.filter(k => P[k])).map(k => relRow(k, { key: "c" })));
    });
    const sibs = byBirth((p.sibs || []).filter(s => P[s] && s !== p.id));
    const content = [
      parents,
      group(spouseRows.length > 1 ? "Spouses" : "Spouse", spouseRows),
      childGroups,
      group(sibs.length === 1 ? "Sibling" : "Siblings", sibs.map(s => relRow(s, { key: "b" }))),
    ].flat().filter(Boolean);
    return section("family", "Family", null, el("div", { class: "pp-family" }, content));
  }

  /* ---------------------------------------------------------------- local-only issues */
  function issuesOf(p) {
    if (D.public || !Array.isArray(D.issues)) return [];
    return (p.issues || []).map(i => D.issues[i]).filter(Boolean);
  }
  function issuesSection(p) {
    const list = issuesOf(p);
    if (!list.length) return null;
    return section("issues", "Things to fix", list.length, list.map(it => {
      const level = LEVEL_LABELS[it.level] ? it.level : "check";
      const others = (it.people || []).filter(x => x !== p.id && P[x]);
      return el("article", { class: `pp-issue is-${level}` },
        el("p", { class: "label pp-issue-level", text: LEVEL_LABELS[level] }),
        el("h4", { class: "pp-issue-title", text: it.title || "Something to check" }),
        it.body && el("p", { class: "pp-issue-body", text: it.body }),
        it.fix && el("p", { class: "pp-issue-fix" }, el("strong", { text: "Fix: " }), it.fix),
        others.length > 0 && el("p", { class: "pp-issue-people" },
          el("span", { class: "label", text: "Also involves" }),
          others.map(x => el("button", { class: "pp-issue-person", type: "button", onclick: () => App.go(x, { focus: false }) }, P[x].name))));
    }));
  }

  /* ---------------------------------------------------------------- render */
  function render(pid, { keepScroll = false } = {}) {
    const p = P[pid];
    if (!p || !body) return;
    const hidden = isHidden(p);
    const all = personMedia(pid);
    const gallery = all.filter(m => GALLERY_KINDS.includes(m.kind));
    const records = sortByYear(all.filter(m => m.kind === "record"));
    const recordIds = records.map(m => m.id);
    const galleryIds = gallery.map(m => m.id);

    // remember what had focus so a re-render doesn't drop it
    const active = document.activeElement;
    const hadFocus = !!(active && shell.contains(active));
    const focusKey = hadFocus && active.dataset ? active.dataset.ppKey : null;
    const top = scroller.scrollTop;

    body.replaceChildren(...[
      hero(p, galleryIds),
      actions(p),
      hidden ? null : gallerySection(gallery),
      hidden ? null : recordsSection(records),
      hidden ? null : lifeSection(p, recordIds),
      familySection(p),
      issuesSection(p),
    ].filter(Boolean));
    barName.textContent = p.name;
    barKicker.replaceChildren(kicker(p));
    shell.style.setProperty("--lc", lineColor(p));
    shell.dataset.pid = pid;
    scroller.scrollTop = keepScroll ? top : 0;
    if (!keepScroll && !reducedMotion()) {
      body.classList.remove("is-entering");
      void body.offsetWidth;
      body.classList.add("is-entering");
    }
    onScroll();
    if (hadFocus) {
      const again = focusKey && body.querySelector(`[data-pp-key="${CSS.escape(focusKey)}"]`);
      (again || $("#pp-name", body) || scroller).focus({ preventScroll: true });
    }
  }
  function rerender() { if (current) safely("render", () => render(current, { keepScroll: true })); }

  function onScroll() {
    if (!scroller) return;
    const y = scroller.scrollTop;
    const name = body && $("#pp-name", body);
    shell.classList.toggle("is-scrolled", y > 2);
    shell.classList.toggle("show-name", !!name && y > name.offsetTop + name.offsetHeight - 12);
  }

  /* ---------------------------------------------------------------- phone sheet: snaps, drag, scrim, lock */
  const sheetHeight = () => panel.getBoundingClientRect().height || window.innerHeight * 0.92;
  const offsetFor = name => (name === "full" ? 0 : Math.max(0, Math.round(sheetHeight() - window.innerHeight * HALF)));

  function setSnap(name) {
    snap = name === "full" ? "full" : "half";
    if (!panel) return;
    panel.style.setProperty("--sheet-y", `${offsetFor(snap)}px`);
    panel.dataset.snap = snap;
    if (scrim) scrim.style.opacity = "";
    const handle = $(".pp-handle", shell);
    if (handle) {
      handle.setAttribute("aria-label", snap === "full" ? "Shrink the details" : "Expand the details");
      handle.setAttribute("aria-expanded", String(snap === "full"));
    }
  }

  /* sheet chrome follows the breakpoint: modal sheet on phones, plain panel elsewhere */
  function applyChrome() {
    const sheet = isOpen && isPhone();
    document.documentElement.classList.toggle("pp-sheet-open", sheet);
    if (scrim) scrim.hidden = !sheet;
    if (sheet) {
      panel.setAttribute("role", "dialog");
      panel.setAttribute("aria-modal", "true");
    } else {
      panel.removeAttribute("role");
      panel.removeAttribute("aria-modal");
    }
  }

  let drag = null;
  function beginDrag(y) {
    const from = parseFloat(panel.style.getPropertyValue("--sheet-y"));
    const start = Number.isFinite(from) ? from : offsetFor(snap);
    drag = { startY: y, start, off: start, lastY: y, lastT: performance.now(), v: 0, moved: false };
    panel.classList.add("pp-dragging");
  }
  function moveDrag(y) {
    if (!drag) return;
    const now = performance.now();
    const dt = Math.max(1, now - drag.lastT);
    drag.v = 0.7 * ((y - drag.lastY) / dt) + 0.3 * drag.v;   // px per ms, positive = down
    drag.lastY = y;
    drag.lastT = now;
    let off = drag.start + (y - drag.startY);
    if (off < 0) off = off / 4;                                // resist past fully open
    drag.off = off;
    drag.moved = drag.moved || Math.abs(y - drag.startY) > 4;
    panel.style.setProperty("--sheet-y", `${off}px`);
    const half = offsetFor("half"), h = sheetHeight();
    if (scrim) scrim.style.opacity = String(Math.max(0, Math.min(1, (h - off) / Math.max(1, h - half))));
  }
  /* where a drag lands: a fling or a drag of more than 56px moves one snap in that direction (from full down
     to half, from half down to closed); a short slow drag returns to the nearest snap */
  function endDrag() {
    if (!drag) return false;
    const { off, v, moved, start } = drag;
    drag = null;
    panel.classList.remove("pp-dragging");
    if (!moved) { setSnap(snap); return false; }
    const half = offsetFor("half"), h = sheetHeight();
    const dist = off - start;
    let target;
    if (v > 0.5 || (dist > 56 && v > -0.1)) target = snap === "full" && off < half + 48 ? "half" : "close";
    else if (v < -0.5 || (dist < -56 && v < 0.1)) target = "full";
    else if (off > half + (h - half) * 0.4) target = "close";
    else target = off < half / 2 ? "full" : "half";
    if (target === "close") App.select(null);
    else setSnap(target);
    return true;
  }

  /* the grab strip (handle + bar) drags with any pointer. Moves are tracked on window, because the sheet
     only starts following after a few pixels and the pointer may already be over the scrim by then. */
  function wireGrab(grab) {
    let pointer = null, suppressClick = false;
    const onMove = e => {
      if (!pointer || e.pointerId !== pointer.id) return;
      if (!pointer.started) {
        if (Math.abs(e.clientY - pointer.y) < 6) return;
        pointer.started = true;
        beginDrag(pointer.y);
      }
      if (e.cancelable) e.preventDefault();
      moveDrag(e.clientY);
    };
    const onUp = e => {
      if (!pointer || e.pointerId !== pointer.id) return;
      if (pointer.started) suppressClick = endDrag();
      pointer = null;
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
      window.removeEventListener("pointercancel", onUp);
    };
    grab.addEventListener("pointerdown", e => {
      if (!isPhone() || !isOpen || pointer || (e.pointerType === "mouse" && e.button !== 0)) return;
      pointer = { id: e.pointerId, y: e.clientY, started: false };
      suppressClick = false;
      window.addEventListener("pointermove", onMove, { passive: false });
      window.addEventListener("pointerup", onUp);
      window.addEventListener("pointercancel", onUp);
    });
    // a drag that started on a button must not also click it
    grab.addEventListener("click", e => {
      if (suppressClick) { e.preventDefault(); e.stopPropagation(); suppressClick = false; }
    }, true);
  }

  /* on the content, touch drags move the sheet when the content can't scroll that way:
     pulling down at the top, or pushing up while the sheet is half open */
  function wireContentTouch() {
    let t = null;
    scroller.addEventListener("touchstart", e => {
      if (!isPhone() || !isOpen || e.touches.length !== 1) { t = null; return; }
      t = { x: e.touches[0].clientX, y: e.touches[0].clientY, mode: null };
    }, { passive: true });
    scroller.addEventListener("touchmove", e => {
      if (!t || e.touches.length !== 1) return;
      const x = e.touches[0].clientX, y = e.touches[0].clientY;
      if (!t.mode) {
        const dx = x - t.x, dy = y - t.y;
        if (Math.abs(dy) < 6 && Math.abs(dx) < 6) return;
        const vertical = Math.abs(dy) > Math.abs(dx);
        const sheetWins = vertical && ((dy > 0 && scroller.scrollTop <= 0) || (dy < 0 && snap === "half"));
        t.mode = sheetWins ? "sheet" : "scroll";
        if (sheetWins) beginDrag(t.y);
      }
      if (t.mode === "sheet") {
        if (e.cancelable) e.preventDefault();
        moveDrag(y);
      }
    }, { passive: false });
    const done = () => { if (t && t.mode === "sheet") endDrag(); t = null; };
    scroller.addEventListener("touchend", done);
    scroller.addEventListener("touchcancel", done);
  }

  /* ---------------------------------------------------------------- keyboard */
  function onKeydown(e) {
    if (!isOpen || e.defaultPrevented) return;
    if (e.key === "Escape") {
      if (App.state.media) return;                                    // the viewer closes first
      const t = e.target;
      if (t && t.closest && t.closest("#topbar, .search-sheet, .menu-panel, [role='dialog']:not(#person-panel), dialog")) return;
      if (document.querySelector("dialog[open], [aria-modal='true']:not(#person-panel):not([hidden])")) return;
      e.preventDefault();
      App.select(null);
      return;
    }
    // the phone sheet is modal: keep Tab inside it
    if (e.key === "Tab" && isPhone() && panel.contains(document.activeElement)) {
      const items = $$("button:not([disabled]), a[href], [tabindex]:not([tabindex='-1'])", shell).filter(n => n.offsetParent !== null);
      if (!items.length) return;
      const first = items[0], last = items[items.length - 1];
      if (e.shiftKey && (document.activeElement === first || !items.includes(document.activeElement))) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  }

  /* ---------------------------------------------------------------- open / close */
  function show(pid) {
    const p = P[pid];
    if (!p || !shell) return;
    const wasOpen = isOpen;
    const active = document.activeElement;
    if (pid !== current) expanded.clear();
    if (!wasOpen) {
      returnTo = active && active !== document.body && !panel.contains(active) ? active : null;
      if (isPhone()) setSnap("half");
    }
    const switching = pid !== current || !wasOpen;
    current = pid;
    isOpen = true;
    panel.inert = false;
    panel.removeAttribute("aria-hidden");
    safely("render", () => render(pid, { keepScroll: !switching }));
    applyChrome();
    // take focus on open, except from the tree's own keyboard navigation (arrows keep moving the selection)
    const fromTree = active && active.closest && active.closest(".tree-views");
    if (!wasOpen && (isPhone() || !fromTree)) {
      const target = $("#pp-name", body) || scroller;
      requestAnimationFrame(() => { if (isOpen && current === pid) target.focus({ preventScroll: true }); });
    }
  }

  /* a sensible place for focus when the panel closes and nothing opened it: the active view's focus card
     (chart: the card in the tab order; family: the focus person's card), then the search box */
  function fallbackFocus() {
    const visible = n => !!n && !n.closest("[hidden], [inert]") && n.getClientRects().length > 0;
    const view = document.getElementById(App.state.view === "family" ? "family-view" : "chart-view");
    const candidates = view ? [$('.ch-card[tabindex="0"]', view), $(".fv-focus button", view)] : [];
    // never a text field on touch screens: focusing it would pop up the keyboard
    if (!window.matchMedia("(pointer: coarse)").matches) candidates.push(document.getElementById("site-search"));
    candidates.push($("#topbar button"));
    return candidates.find(visible) || null;
  }

  function close() {
    if (!shell || !isOpen) return;
    isOpen = false;
    applyChrome();
    const active = document.activeElement;
    const focusInside = active && (panel.contains(active) || active === document.body);
    panel.inert = true;
    panel.setAttribute("aria-hidden", "true");
    if (focusInside) {
      // back where the panel was opened from; opened from search (the typeahead blurs itself) or a shared link,
      // there's nothing to go back to, so focus the tree's card for the focused person, else the search box
      const back = returnTo && returnTo.isConnected && !panel.contains(returnTo) && returnTo.getClientRects().length ? returnTo : fallbackFocus();
      if (back) { try { back.focus({ preventScroll: true }); } catch (err) { /* went away */ } }
    }
    returnTo = null;
    current = null;
    drag = null;
    panel.classList.remove("pp-dragging");
  }

  /* ---------------------------------------------------------------- mount */
  function mount(target) {
    panel = target;
    panel.replaceChildren(buildShell());
    panel.inert = true;
    panel.setAttribute("aria-hidden", "true");
    scrim = el("div", { class: "pp-scrim", hidden: true, "aria-hidden": "true", onclick: () => App.select(null) });
    document.body.append(scrim);
    // the scrim never scrolls the page underneath
    scrim.addEventListener("touchmove", e => { if (e.cancelable) e.preventDefault(); }, { passive: false });
    scroller.addEventListener("scroll", onScroll, { passive: true });
    // a wheel or trackpad scroll on the half-open sheet opens it fully first
    scroller.addEventListener("wheel", e => { if (isOpen && isPhone() && snap === "half" && e.deltaY > 0) setSnap("full"); }, { passive: true });
    wireGrab($(".pp-grab", shell));
    wireContentTouch();
    document.addEventListener("keydown", onKeydown);
    window.addEventListener("resize", () => { if (isOpen && isPhone() && !drag) setSnap(snap); });
    PHONE_QUERY.addEventListener("change", () => { applyChrome(); if (isOpen && isPhone()) setSnap(snap); });
    App.on("media", () => { if (isOpen) rerender(); });
    App.on("view", () => { if (isOpen) rerender(); });
  }

  App.person = { mount, show, close };
})();
