  flex-direction: column; align-items: center; justify-content: flex-start;
  gap: 8px;
  min-height: var(--tap);
  padding: 10px 6px 10px;
  text-align: center;
}
.fv-sm .fv-text { width: 100%; align-items: center; }
.fv-sm .fv-name, .fv-sm .fv-surname {
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.fv-sm .fv-name { font-size: 13px; font-weight: 600; line-height: 1.25; letter-spacing: -.005em; }
.fv-sm .fv-surname { font-size: 11px; line-height: 1.3; color: var(--ink-2); }
.fv-sm .fv-years { margin-top: 3px; font-size: 11px; line-height: 1.2; }

/* medium: parents and spouses */
.fv-md {
  flex-direction: row; align-items: center;
  gap: 10px;
  min-height: 74px;
  padding: 10px 12px 10px 10px;
}
.fv-md .fv-role { display: block; margin-bottom: 3px; }
.fv-md .fv-name {
  font-size: 15px; font-weight: 700; line-height: 1.2; letter-spacing: -.01em;
  overflow-wrap: break-word;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3;
  overflow: hidden;
}
.fv-md .fv-years { margin-top: 3px; font-size: 12px; line-height: 1.25; }

/* large: the focus person */
.fv-lg {
  flex-direction: column;
  border-color: var(--rule-strong);
  border-top: 4px solid var(--lc, var(--none));
  touch-action: pan-y;               /* horizontal moves are the sibling swipe */
}
.fv-lg.is-dragging { z-index: 3; cursor: grabbing; transition: none; }
.fv-lg-main { display: flex; align-items: flex-start; gap: 16px; padding: 16px; }
.fv-lg-text { display: flex; flex-direction: column; gap: 6px; min-width: 0; padding-top: 1px; }
.fv-kicker { display: flex; align-items: flex-start; gap: 7px; }
.fv-kicker .marker { margin-top: 2px; }
.fv-kicker-text { display: flex; flex-wrap: wrap; gap: 2px 10px; min-width: 0; }
.fv-rel { color: var(--ink-2); }
.fv-line { color: var(--lc, var(--muted)); }
.fv-lg-name {
  font-size: clamp(21px, 6.2cqi, 30px);
  font-weight: 800;
  line-height: 1.08;
  letter-spacing: var(--tracking-tight);
  overflow-wrap: break-word;
  text-wrap: balance;
}
.fv-lg-meta { display: flex; flex-direction: column; gap: 1px; margin-top: 2px; }
.fv-lg-years { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink); }
.fv-lg-place { font-size: 13px; line-height: 1.35; color: var(--muted); }
.fv-lg-foot {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  min-height: var(--tap);
  padding: 0 10px 0 16px;
  border-top: 1px solid var(--rule);
  font-size: 12px; line-height: 1.3;
  color: var(--muted);
}
.fv-counts { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; min-width: 0; padding-block: 6px; }
.fv-count { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.fv-count .icon { color: var(--ink-2); }
.fv-open {
  display: inline-flex; align-items: center; gap: 2px; flex: none;
  font-size: 13px; font-weight: 600; color: var(--ink);
  transition: color var(--dur-fast) var(--ease);
}

/* the focus in the sibling strip */
.fv-sm.is-current {
  background: var(--surface);
  border-color: var(--ink);
  border-top-color: var(--lc, var(--none));
  box-shadow: inset 0 0 0 1px var(--ink);
}
.fv-sm.is-current .fv-name { font-weight: 700; }

/* dashed placeholders for people not recorded */
.fv-ph {
  display: flex; min-width: 0;
  border: 1px dashed var(--rule-strong);
  color: var(--muted);
}
.fv-ph-box {
  display: grid; place-items: center; flex: none;
  width: 40px; height: 40px;
  border: 1px dashed var(--rule-strong);
  font-size: 15px; font-weight: 600; line-height: 1;
  color: var(--faint);
}
.fv-ph-text { font-size: 12px; font-weight: 500; line-height: 1.3; }
.fv-ph-sm {
  flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  padding: 12px 6px; text-align: center;
}
.fv-ph-md { flex-direction: row; align-items: center; gap: 10px; min-height: 74px; padding: 10px; }
.fv-ph-md .fv-ph-box { width: 48px; height: 48px; }
.fv-ph-wide {
  grid-column: 1 / -1;
  flex-direction: row; align-items: center; justify-content: center; gap: 10px;
  min-height: 72px; padding: 10px;
}
.fv-ph-wide .fv-ph-box { width: 32px; height: 32px; font-size: 13px; }

/* ---------------------------------------------------------------- the end of the view */
.fv-more {
  display: flex; flex-wrap: wrap; align-items: center; gap: 0 4px;
  margin-top: var(--space-6); padding-top: var(--space-2);
  border-top: 1px solid var(--rule);
}
.fv-more .label { margin-right: 6px; }
.fv-more-link {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: var(--tap);
  padding: 0 10px;
  font-size: 14px; font-weight: 600; line-height: 1.2;
  color: var(--ink-2);
  text-decoration: none;
  transition: color var(--dur-fast) var(--ease), background-color var(--dur-fast) var(--ease);
}
.fv-more-link .icon { color: var(--muted); }
@media (hover: hover) { .fv-more-link:hover { color: var(--ink); background: var(--surface-2); } }
.fv-more-link:focus-visible { outline-offset: -2px; }

/* ---------------------------------------------------------------- "more below" cue (narrow views) */
.fv-cue {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 6;
  display: none; justify-content: center; align-items: flex-end;
  height: calc(66px + var(--safe-b, 0px));
  padding-bottom: calc(8px + var(--safe-b, 0px));
  background: linear-gradient(to bottom, color-mix(in srgb, var(--bg) 0%, transparent), var(--bg) 62%);
  pointer-events: none;
  opacity: 0; visibility: hidden;
  transition: opacity var(--dur) var(--ease), visibility 0s linear var(--dur);
}
.fv-cue.is-on { opacity: 1; visibility: visible; transition: opacity var(--dur) var(--ease), visibility 0s; }
.fv-cue-btn {
  pointer-events: auto;
  display: inline-flex; align-items: center; gap: 6px;
  min-height: var(--tap); padding: 0 12px 0 14px;
  background: var(--surface);
  border: 1px solid var(--rule-strong);
  box-shadow: var(--shadow-float);
  font-size: 14px; font-weight: 600; color: var(--ink);
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.fv-cue-btn:active { background: var(--surface-2); }

/* ---------------------------------------------------------------- sections: siblings and families */
.fv-section { margin-top: var(--space-5); }
.fv-head {
  display: flex; align-items: center; gap: 10px;
  min-height: var(--tap);
  border-top: 1px solid var(--rule-strong);
}
.fv-head-title { margin: 0; color: var(--ink); }
.fv-head-meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.fv-steps { display: flex; gap: 2px; margin-left: auto; margin-right: -6px; }
.fv-step:disabled { opacity: .3; }

.fv-strip {
  display: flex; gap: 8px;
  margin: 2px calc(-1 * var(--fv-pad-r)) 0 calc(-1 * var(--fv-pad-l));
  padding: 4px var(--fv-pad-r) 8px var(--fv-pad-l);
  overflow-x: auto; overflow-y: hidden;
  overscroll-behavior-x: contain;
  touch-action: manipulation;
  scroll-snap-type: x mandatory;
  scroll-padding-inline: var(--fv-pad-l) var(--fv-pad-r);
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  --fade-l: var(--fv-pad-l);
  --fade-r: var(--fv-pad-r);
}
/* edge fades, only where there is more to scroll */
.fv-strip.more-left {
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 var(--fade-l));
  mask-image: linear-gradient(90deg, transparent 0, #000 var(--fade-l));
}
.fv-strip.more-right {
  -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - var(--fade-r)), transparent 100%);
  mask-image: linear-gradient(90deg, #000 calc(100% - var(--fade-r)), transparent 100%);
}
.fv-strip.more-left.more-right {
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 var(--fade-l), #000 calc(100% - var(--fade-r)), transparent 100%);
  mask-image: linear-gradient(90deg, transparent 0, #000 var(--fade-l), #000 calc(100% - var(--fade-r)), transparent 100%);
}
.fv-strip::-webkit-scrollbar { display: none; }
@media (hover: hover) and (pointer: fine) {
  .fv-strip { scrollbar-width: thin; scrollbar-color: var(--rule-strong) transparent; padding-bottom: 10px; }
  .fv-strip::-webkit-scrollbar { display: block; height: 6px; }
  .fv-strip::-webkit-scrollbar-thumb { background: var(--rule-strong); }
  .fv-strip::-webkit-scrollbar-track { background: transparent; }
}
.fv-strip-item { flex: none; width: 92px; display: flex; scroll-snap-align: center; }

.fv-fam + .fv-fam { margin-top: var(--space-5); }
.fv-fam .fv-head { min-height: 0; padding: 14px 0 12px; }
.fv-spouse { align-items: stretch; }
.fv-marr {
  display: flex; flex-direction: column; justify-content: center; gap: 2px;
  min-width: 0;
  padding: 8px 0 8px 14px;
  border-left: 1px solid var(--rule-strong);
}
.fv-marr .label { margin-bottom: 2px; }
.fv-marr-date { font-size: 15px; font-weight: 600; line-height: 1.25; font-variant-numeric: tabular-nums; }
.fv-marr-place { font-size: 13px; line-height: 1.35; color: var(--muted); overflow-wrap: break-word; }
.fv-subhead { display: flex; align-items: baseline; gap: 8px; margin: var(--space-4) 0 var(--space-2); }
.fv-subhead .label { color: var(--ink); }
.fv-kids {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
  gap: 8px;
}
.fv-kid { display: flex; min-width: 0; }
.fv-note { font-size: 13px; line-height: 1.4; color: var(--muted); }
.fv-section.is-empty { border-top: 1px solid var(--rule); padding-top: var(--space-3); }
.fv-fam > .fv-note { margin-top: var(--space-3); }

/* ---------------------------------------------------------------- sizes by the view's own width */
/* phones: readable type (years and places are content), breadcrumbs that stay put, the cue */
@container fv (max-width: 559px) {
  .fv-crumbs {
    position: sticky; top: 0; z-index: 4;
    margin-top: calc(-1 * var(--space-3)); padding-top: var(--space-1);
    background: var(--bg);
    box-shadow: 0 1px 0 var(--rule);
  }
  .fv-crumb-btn, .fv-crumb-here { font-size: 14px; }
  .fv-sm .fv-name { font-size: 15px; }
  .fv-sm .fv-surname { font-size: 14px; }
  .fv-sm .fv-years { font-size: 14px; }
  .fv-md .fv-years { font-size: 14px; }
  .fv-lg-place { font-size: 14px; }
  .fv-lg-foot { font-size: 14px; }
  .fv-head-meta { font-size: 14px; }
  .fv-marr-place { font-size: 14px; }
  .fv-ph-text { font-size: 14px; }
  .fv-note { font-size: 14px; }
  .fv-strip-item { width: 104px; }
  .fv-kids { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
  .fv-cue { display: flex; }
  .fv-more { flex-direction: column; align-items: stretch; }
  .fv-more .label { margin: var(--space-2) 0 2px; }
  .fv-more-link { justify-content: space-between; padding: 0 2px; border-bottom: 1px solid var(--rule); }
}
/* small phones: the grandparents as compact one-line cards (each couple stacked), a smaller portrait, so
   the brothers and sisters and the children come up sooner */
@container fv (max-width: 479px) {
  .fv-couple-label { margin-bottom: 4px; }
  .fv-gp .fv-couple-cards { grid-template-columns: minmax(0, 1fr); gap: var(--fv-pair); }
  .fv-gp .fv-sm {
    flex-direction: row; align-items: center; gap: 8px;
    min-height: var(--tap);
    padding: 5px 8px 5px 6px;
    text-align: left;
  }
  .fv-gp .fv-sm .avatar { --av: 30px !important; flex: none; }
  .fv-gp .fv-sm .fv-text { display: block; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .fv-gp .fv-sm .fv-name, .fv-gp .fv-sm .fv-surname { display: inline; }
  .fv-gp .fv-sm .fv-surname { color: var(--ink-2); }
  .fv-gp .fv-sm .fv-surname::before { content: " "; }
  .fv-gp .fv-sm .fv-years { display: block; margin-top: 0; font-size: 14px; overflow: hidden; text-overflow: ellipsis; }
  .fv-gp .fv-ph-sm { flex-direction: row; justify-content: flex-start; gap: 8px; min-height: var(--tap); padding: 5px 8px 5px 6px; }
  .fv-gp .fv-ph-sm .fv-ph-box { width: 30px; height: 30px; font-size: 13px; }
  .fv-gp .fv-ph-wide { min-height: calc(2 * var(--tap) + var(--fv-pair)); }
  /* a stacked couple joins its child with a single stem */
  .fv-gp .fv-join { height: 16px; }
  .fv-gp .fv-join::before { display: none; }
  .fv-gp .fv-join::after { top: 0; }
  .fv-lg .avatar { --av: 72px !important; }
  .fv-lg-main { gap: 14px; padding: 14px; }
}
/* narrow phones (320px) */
@container fv (max-width: 359px) {
  .fv-scroll, .fv-overlay { --fv-gap: 10px; --fv-pair: 3px; }
  .fv-sm { padding: 9px 4px; }
  .fv-md { gap: 8px; padding: 8px 8px 8px 8px; }
  .fv-md .avatar { --av: 36px !important; }
  .fv-md .fv-name { font-size: 14px; }
  .fv-lg-main { gap: 12px; padding: 14px 12px; }
  .fv-lg .avatar { --av: 64px !important; }
  .fv-lg-foot { padding-left: 12px; }
  .fv-strip-item { width: 96px; }
  .fv-gp .fv-sm .avatar { --av: 26px !important; }
}
/* tablet, desktop, beside the panel */
@container fv (min-width: 560px) {
  .fv-scroll, .fv-overlay { --fv-gap: 20px; --fv-pair: 6px; }
  .fv-inner { padding-top: var(--space-5); }
  .fv-sm { padding: 12px 8px; gap: 10px; }
  .fv-sm .fv-name { font-size: 14px; }
  .fv-sm .fv-surname { font-size: 12px; }
  .fv-md { gap: 14px; padding: 12px 16px 12px 12px; min-height: 82px; }
  .fv-md .avatar { --av: 56px !important; }
  .fv-md .fv-name { font-size: 17px; }
  .fv-md .fv-years { font-size: 13px; }
  .fv-ph-md { min-height: 82px; }
  .fv-lg-main { gap: 22px; padding: 20px; }
  .fv-lg .avatar { --av: 120px !important; }
  .fv-lg-foot { padding-left: 20px; }
  .fv-lg-years { font-size: 16px; }
  .fv-lg-place { font-size: 14px; }
  .fv-join { height: 28px; }
  .fv-join::before { height: 14px; }
  .fv-join::after { top: 14px; }
  .fv-strip-item { width: 104px; }
  /* in a wide stage the strip stays inside the column */
  .fv-strip { margin-inline: 0; padding-inline: 0; scroll-padding-inline: 0; --fade-l: 32px; --fade-r: 32px; }
  .fv-kids { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
}
/* a wide stage: the column reads as a sheet of paper on the page */
@container fv (min-width: 840px) {
  .fv-inner { padding-top: var(--space-6); }
}

/* phones: at either end of the view a swipe carries on to the page (Lines, Research, Everyone) */
@media (max-width: 699px) {
  .fv-scroll { overscroll-behavior-y: auto; }
}

/* tablet: the person panel floats over the right of the stage, so the view makes room beside it */
@media (min-width: 700px) and (max-width: 1099px) {
  .fv { transition: width var(--dur-slow) var(--ease); width: 100%; }
  .tree.has-panel .fv { width: calc(100% - min(var(--panel-w), 62%)); }
}

/* ==========================================================================
   person.css: the person panel (prefix pp-). site.css positions #person-panel
   (docked on desktop, floating on tablets, a bottom sheet on phones); this file
   styles its contents, the sheet's handle, snap drag, scrim and scroll lock.
   ========================================================================== */

.pp {
  --pp-pad: 24px;
  --lc: var(--none);
  position: relative;
  display: flex; flex-direction: column;
  height: 100%;
  background: var(--surface);
  color: var(--ink);
}
@media (max-width: 1099px) { .pp { width: 100%; } }
@media (max-width: 699px) { .pp { --pp-pad: 16px; } }

/* ---------------------------------------------------------------- top strip: handle + bar */
.pp-grab {
  position: relative; z-index: 2;
  flex: none;
  background: var(--surface);
  border-top: 3px solid var(--lc);
  transition: border-color var(--dur) var(--ease);
}
.pp-handle { display: none; }
.pp-bar {
  display: flex; align-items: center; gap: var(--space-3);
  height: 52px;
  padding: 0 calc(var(--pp-pad) - 14px) 0 var(--pp-pad);
  border-bottom: 1px solid transparent;
  transition: border-color var(--dur-fast) var(--ease);
}
.pp.is-scrolled .pp-bar { border-bottom-color: var(--rule); }
/* the bar's lead shows the relationship, then the name once the hero has scrolled away */
.pp-bar-lead { position: relative; flex: 1 1 auto; min-width: 0; display: grid; align-items: center; height: 100%; }
.pp-bar-lead > * { grid-area: 1 / 1; min-width: 0; transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease); }
.pp-bar-name {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: 15px; font-weight: 700; letter-spacing: -.01em;
  opacity: 0; transform: translateY(6px); pointer-events: none;
}
.pp.show-name .pp-bar-name { opacity: 1; transform: none; }
.pp.show-name .pp-bar-kicker { opacity: 0; transform: translateY(-6px); }
.pp-bar-kicker .pp-kicker { flex-wrap: nowrap; white-space: nowrap; }
/* when the bar is narrow the line name gives way first, then the relationship */
.pp-bar-kicker .pp-kicker-rel { flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pp-bar-kicker .pp-kicker-line { flex: 0 1000 auto; min-width: 0; overflow: hidden; }
.pp-bar-kicker .pp-kicker-line > span { overflow: hidden; text-overflow: ellipsis; }
.pp-close { margin-left: auto; color: var(--muted); }
.pp-close:hover:not(:disabled) { color: var(--ink); }

/* ---------------------------------------------------------------- scroll area */
.pp-scroll {
  position: relative;
  flex: 1 1 auto; min-height: 0;
  overflow-y: auto; overflow-x: hidden;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding: 0 var(--pp-pad) calc(var(--space-7) + var(--safe-b));
  scrollbar-width: thin;
  scrollbar-color: var(--rule-strong) transparent;
}
.pp-scroll:focus { outline: none; }
.pp-body.is-entering { animation: pp-enter var(--dur-slow) var(--ease); }
@keyframes pp-enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------------------------------------------------------------- hero */
.pp-hero { padding-top: var(--space-2); }
.pp-kicker {
  display: flex; align-items: center; flex-wrap: wrap; gap: 6px var(--space-2);
  font-size: var(--text-2xs); font-weight: 600;
  letter-spacing: var(--tracking-caps); text-transform: uppercase;
  line-height: 1.3;
}
.pp-kicker-rel { color: var(--ink); }
.pp-kicker-line { color: var(--muted); display: inline-flex; align-items: center; gap: var(--space-2); }
.pp-kicker-line::before { content: ""; width: 1px; height: 11px; background: var(--rule-strong); }

.pp-hero-grid {
  display: grid; grid-template-columns: 132px minmax(0, 1fr);
  gap: var(--space-5);
  align-items: start;
}
.pp-hero-grid.is-compact { grid-template-columns: 88px minmax(0, 1fr); align-items: center; }
.pp-hero-grid.is-compact .pp-portrait-initials { font-size: 32px; }
.pp-portrait {
  position: relative;
  display: block;
  width: 100%;
  aspect-ratio: 4 / 5;
  overflow: hidden;
  padding: 0;
  border: 1px solid var(--rule-strong);
  background: var(--surface-3);
}
.pp-portrait img {
  display: block; width: 100%; height: 100%;
  object-fit: cover;
  filter: saturate(.92) contrast(1.02);
  transition: transform var(--dur-slow) var(--ease);
}
button.pp-portrait { cursor: zoom-in; }
button.pp-portrait:hover img { transform: scale(1.03); }
.pp-portrait.is-mono {
  display: grid; place-items: center;
  background: color-mix(in srgb, var(--lc) 12%, var(--surface));
  border-color: color-mix(in srgb, var(--lc) 30%, var(--surface));
  box-shadow: inset 0 -3px 0 var(--lc);
}
.pp-portrait-initials {
  color: var(--lc);
  font-size: 46px; font-weight: 700;
  letter-spacing: -.01em; line-height: 1;
  font-variant-numeric: lining-nums;
  user-select: none;
}

.pp-hero-text { min-width: 0; padding-top: 2px; }
.pp-name {
  font-size: 26px; font-weight: 800;
  letter-spacing: var(--tracking-tight);
  line-height: 1.08;
  overflow-wrap: break-word;
  text-wrap: balance;
}
.pp-name:focus { outline: none; }
.pp-years {
  margin-top: var(--space-2);
  font-size: var(--text-base); font-weight: 600;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
  letter-spacing: .01em;
}
.pp-vitals { display: grid; gap: var(--space-3); margin-top: var(--space-4); }
.pp-vital dt { margin-bottom: 2px; }
.pp-vital dd { display: grid; gap: 1px; margin: 0; }
.pp-vital-date { font-size: var(--text-sm); font-weight: 500; font-variant-numeric: tabular-nums; }
.pp-vital-place { font-size: 13px; color: var(--muted); line-height: 1.4; }

.pp-private {
  display: flex; gap: var(--space-3); align-items: flex-start;
  margin-top: var(--space-5);
  padding: var(--space-4);
  background: var(--surface-2);
  border-left: 3px solid var(--rule-strong);
  font-size: 13px; line-height: 1.5; color: var(--ink-2);
}
.pp-private .icon { color: var(--muted); margin-top: 1px; }
.pp-private-title { font-size: var(--text-sm); font-weight: 700; color: var(--ink); margin-bottom: 2px; }

.pp-meta {
  margin-top: var(--space-5);
  padding-top: var(--space-3);
  border-top: 1px solid var(--rule);
  font-size: var(--text-xs); color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.pp-issue-chip {
  --lvl: var(--check); --lvl-bg: var(--check-bg);
  display: inline-flex; align-items: center; gap: var(--space-2);
  margin-top: var(--space-3);
  min-height: 32px; padding: 0 10px;
  border: 1px solid color-mix(in srgb, var(--lvl) 45%, transparent);
  background: var(--lvl-bg);
  color: var(--lvl);
  font-size: var(--text-xs); font-weight: 600;
}
.pp-issue-chip.is-error { --lvl: var(--error); --lvl-bg: var(--error-bg); }
.pp-issue-chip.is-duplicate { --lvl: var(--duplicate); --lvl-bg: var(--duplicate-bg); }
.pp-issue-chip .marker { background: var(--lvl); }
.pp-issue-chip .icon { --icon-size: 14px; }
.pp-issue-chip:hover { border-color: var(--lvl); }

/* ---------------------------------------------------------------- actions */
.pp-actions { margin-top: var(--space-5); }
.pp-actions-row { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.pp-actions .btn { min-height: 40px; }
.pp-note {
  display: flex; align-items: flex-start; gap: var(--space-2);
  margin-top: var(--space-3);
  font-size: 13px; line-height: 1.45; color: var(--muted);
}
.pp-note .icon { margin-top: 1px; }

/* ---------------------------------------------------------------- sections */
.pp-section { margin-top: var(--space-6); padding-top: var(--space-3); border-top: 1px solid var(--ink); }
.pp-section-head {
  display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3);
  margin-bottom: var(--space-4);
}
.pp-section-head .label { color: var(--ink); }
.pp-count { font-size: var(--text-xs); font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.pp-more {
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: var(--space-3);
  min-height: 36px;
  color: var(--accent);
  font-size: 13px; font-weight: 600;
}
.pp-more .icon { --icon-size: 16px; }
.pp-more:hover { text-decoration: underline; text-underline-offset: 3px; }

/* ---------------------------------------------------------------- photos grid */
.pp-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.pp-tile {
  position: relative;
  display: block;
  aspect-ratio: 1;
  overflow: hidden;
  padding: 0;
  border: 1px solid var(--rule);
  background: var(--surface-2);
  color: var(--ink);
  text-align: left;
  transition: border-color var(--dur-fast) var(--ease);
}
.pp-tile:hover { border-color: var(--ink); }
.pp-tile img {
  display: block; width: 100%; height: 100%;
  object-fit: cover;
  filter: saturate(.92) contrast(1.02);
  transition: transform var(--dur-slow) var(--ease);
}
.pp-tile:hover img { transform: scale(1.04); }
.pp-tile-kind {
  position: absolute; left: 0; bottom: 0;
  padding: 3px 6px 2px;
  background: color-mix(in srgb, var(--surface) 90%, transparent);
  color: var(--ink-2);
  font-size: 9.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
  line-height: 1.3;
}
.pp-tile.is-story {
  display: flex; flex-direction: column; gap: 6px;
  padding: 10px 10px 8px;
  background: var(--surface);
  border-top: 3px solid var(--lc);
}
.pp-tile.is-story .label { font-size: 9.5px; }
.pp-tile-title {
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3;
  overflow: hidden;
  font-size: 12.5px; font-weight: 700; line-height: 1.25; letter-spacing: -.005em;
}
.pp-tile.is-story .pp-tile-title { flex: none; }
.pp-tile-excerpt {
  flex: 1 1 auto; min-height: 0;
  overflow: hidden;
  -webkit-mask-image: linear-gradient(to bottom, #000 55%, transparent);
  mask-image: linear-gradient(to bottom, #000 55%, transparent);
  font-size: 11px; line-height: 1.4; color: var(--muted);
}
.pp-tile.is-file {
  display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between;
  padding: 10px;
  color: var(--muted);
}
.pp-tile.is-file .pp-tile-title { color: var(--ink); font-weight: 600; font-size: 11.5px; }

/* ---------------------------------------------------------------- documents */
.pp-docs { list-style: none; margin: 0; padding: 0; border-bottom: 1px solid var(--rule); }
.pp-docs li + li { border-top: 1px solid var(--rule); }
.pp-doc {
  display: grid; grid-template-columns: 52px minmax(0, 1fr) 18px; align-items: center;
  gap: var(--space-4);
  width: 100%;
  padding: 10px 0;
  text-align: left;
  color: var(--ink);
}
.pp-doc > .icon { color: var(--faint); transition: transform var(--dur) var(--ease), color var(--dur-fast) var(--ease); }
.pp-doc:hover > .icon { color: var(--ink); transform: translateX(3px); }
.pp-doc:hover .pp-doc-title { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.pp-doc-thumb {
  display: block; width: 52px; height: 52px;
  overflow: hidden;
  border: 1px solid var(--rule-strong);
  background: var(--surface-2);
}
.pp-doc-thumb img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 0; filter: saturate(.9); }
.pp-doc-thumb.is-icon { display: grid; place-items: center; color: var(--muted); border-color: var(--rule); }
.pp-doc-text { display: grid; gap: 3px; min-width: 0; }
.pp-doc-type { font-size: 10px; }
.pp-doc-title {
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
  overflow: hidden;
  font-size: var(--text-sm); font-weight: 600; line-height: 1.3;
}
.pp-doc-meta {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: var(--text-xs); color: var(--muted);
  font-variant-numeric: tabular-nums;
}

/* ---------------------------------------------------------------- life timeline */
.pp-life { list-style: none; margin: 0; padding: 0; }
.pp-fact { display: grid; grid-template-columns: 82px minmax(0, 1fr); column-gap: var(--space-4); }
.pp-fact-date {
  padding-top: 1px;
  text-align: right;
  font-size: 12.5px; font-weight: 600; line-height: 1.35;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}
.pp-fact-main {
  position: relative;
  min-width: 0;
  padding: 0 0 var(--space-5) var(--space-4);
  border-left: 1px solid var(--rule);
}
.pp-fact:last-child .pp-fact-main { padding-bottom: var(--space-1); }
.pp-fact-main::before {
  content: "";
  position: absolute; left: -4px; top: 5px;
  width: 7px; height: 7px;
  background: var(--surface);
  border: 1px solid var(--rule-strong);
}
/* births and deaths get a filled marker in the line color; research facts carry their own RESEARCH badge */
.pp-fact.is-key .pp-fact-main::before { background: var(--lc); border-color: var(--lc); }
.pp-fact-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px var(--space-2); }
.pp-fact-label { font-size: var(--text-sm); font-weight: 700; line-height: 1.3; }
.pp-badge {
  display: inline-block;
  padding: 2px 5px 1px;
  border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
  color: var(--accent);
  font-size: 9.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
  line-height: 1.3;
  transform: translateY(-1px);
}
.pp-fact-place { margin-top: 2px; font-size: 13.5px; color: var(--ink-2); line-height: 1.4; }
.pp-fact-also { margin-top: 3px; font-size: 13px; color: var(--muted); line-height: 1.45; }
.pp-fact-also .label { display: inline; margin-right: 6px; font-size: 10px; }
.pp-fact-detail { margin-top: 4px; font-size: 13px; color: var(--muted); line-height: 1.5; }
.pp-cites { margin-top: var(--space-2); }
.pp-cites ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.pp-cite {
  display: inline-flex; align-items: flex-start; gap: 6px;
  padding: 3px 0;
  max-width: 100%;
  font-size: var(--text-xs); line-height: 1.4;
  color: var(--muted);
  text-align: left; text-decoration: none;
}
.pp-cite .icon { --icon-size: 15px; margin-top: 1px; }
.pp-cite.is-record { color: var(--accent); font-weight: 500; }
.pp-cite.is-link { color: var(--ink-2); }
.pp-cite.is-link .icon { color: var(--muted); }
.pp-cite.is-record:hover span, .pp-cite.is-link:hover span { text-decoration: underline; text-underline-offset: 2px; }
.pp-cite-dot { flex: none; width: 5px; height: 5px; margin: 6px 5px 0; background: var(--rule-strong); }
.pp-cites-more {
  min-height: 28px; padding: 0;
  font-size: var(--text-xs); font-weight: 600; color: var(--accent);
}
.pp-cites-more:hover { text-decoration: underline; text-underline-offset: 2px; }

/* ---------------------------------------------------------------- family */
.pp-family { display: grid; gap: var(--space-5); }
.pp-fam-group > .label { margin-bottom: var(--space-1); }
.pp-rels { list-style: none; margin: 0; padding: 0; }
.pp-rel {
  display: grid; grid-template-columns: 36px minmax(0, 1fr) 18px; align-items: center;
  gap: var(--space-3);
  width: calc(100% + 2 * var(--space-2));
  min-height: 52px;
  margin: 0 calc(-1 * var(--space-2));
  padding: 8px var(--space-2);
  text-align: left;
  color: var(--ink);
  transition: background-color var(--dur-fast) var(--ease);
}
button.pp-rel:hover { background: var(--surface-2); }
.pp-rel > .icon { color: var(--faint); transition: transform var(--dur) var(--ease), color var(--dur-fast) var(--ease); }
button.pp-rel:hover > .icon { color: var(--ink); transform: translateX(3px); }
.pp-rel .avatar { --av: 36px; }
.pp-rel-text { display: grid; gap: 1px; min-width: 0; }
.pp-rel-name {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: var(--text-sm); font-weight: 600; line-height: 1.3;
}
.pp-rel-meta, .pp-rel-note {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: var(--text-xs); color: var(--muted); line-height: 1.35;
  font-variant-numeric: tabular-nums;
}
.pp-rel-note { color: var(--ink-2); }
.pp-rel.is-unknown { grid-template-columns: 36px minmax(0, 1fr); }
.pp-rel.is-unknown .pp-rel-name { color: var(--faint); font-weight: 500; }
.pp-rel-blank { width: 36px; height: 36px; border: 1px dashed var(--rule-strong); }

/* ---------------------------------------------------------------- local-only issues */
.pp-issue {
  --lvl: var(--check); --lvl-bg: var(--check-bg);
  padding: var(--space-4);
  background: var(--lvl-bg);
  border-left: 3px solid var(--lvl);
  font-size: 13.5px; line-height: 1.5; color: var(--ink-2);
}
.pp-issue + .pp-issue { margin-top: var(--space-3); }
.pp-issue.is-error { --lvl: var(--error); --lvl-bg: var(--error-bg); }
.pp-issue.is-duplicate { --lvl: var(--duplicate); --lvl-bg: var(--duplicate-bg); }
.pp-issue-level { color: var(--lvl); }
.pp-issue-title { margin-top: 4px; font-size: var(--text-base); font-weight: 700; line-height: 1.3; letter-spacing: -.01em; color: var(--ink); }
.pp-issue-body { margin-top: var(--space-2); }
.pp-issue-fix { margin-top: var(--space-2); }
.pp-issue-fix strong { color: var(--ink); font-weight: 700; }
.pp-issue-people { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px var(--space-3); margin-top: var(--space-3); }
.pp-issue-people .label { color: var(--lvl); }
.pp-issue-person {
  min-height: 28px; padding: 0;
  font-size: 13px; font-weight: 600; color: var(--ink);
  text-decoration: underline; text-decoration-color: var(--rule-strong); text-underline-offset: 3px;
}
.pp-issue-person:hover { text-decoration-color: currentColor; }

/* ---------------------------------------------------------------- tablet */
@media (min-width: 700px) and (max-width: 1099px) {
  .pp-hero-grid { grid-template-columns: 116px minmax(0, 1fr); gap: var(--space-4); }
  .pp-name { font-size: 24px; }
}

/* ---------------------------------------------------------------- phone bottom sheet */
.pp-scrim {
  position: fixed; inset: 0;
  z-index: calc(var(--z-sheet) - 1);
  background: var(--scrim);
  animation: fade-in var(--dur) var(--ease);
  transition: opacity var(--dur-slow) var(--ease);
  touch-action: none;
}
@media (min-width: 700px) { .pp-scrim { display: none !important; } }

@media (max-width: 699px) {
  /* body scroll lock while the sheet is open */
  html.pp-sheet-open, html.pp-sheet-open body { overflow: hidden; overscroll-behavior: none; }
  .person-panel.pp-dragging { transition: none !important; }
  .pp-grab { touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
  .person-panel.pp-dragging .pp-grab { cursor: grabbing; }
  .pp-handle {
    display: flex; justify-content: center; align-items: flex-start;
    width: 100%; height: 20px;
    padding-top: 8px;
  }
  .pp-handle-bar { width: 40px; height: 4px; background: var(--rule-strong); transition: background-color var(--dur-fast) var(--ease); }
  .pp-handle:hover .pp-handle-bar, .pp-handle:focus-visible .pp-handle-bar { background: var(--muted); }
  .pp-handle:focus-visible { outline-offset: -2px; }
  .pp-bar { height: 48px; margin-top: -4px; }
  .pp-hero { padding-top: 0; }
  .pp-hero-grid { grid-template-columns: 100px minmax(0, 1fr); gap: var(--space-4); }
  .pp-name { font-size: 23px; }
  .pp-portrait-initials { font-size: 36px; }
  .pp-years { margin-top: 6px; font-size: 15px; }
  .pp-vitals { gap: var(--space-2); margin-top: var(--space-3); }
  .pp-meta { margin-top: var(--space-4); }
  .pp-actions { margin-top: var(--space-4); }
  .pp-actions .btn { min-height: var(--tap); }
  .pp-fact { grid-template-columns: 82px minmax(0, 1fr); column-gap: var(--space-3); }
  /* on phones dates, places, sources and button labels are the content: nothing under 14px, badges 11px */
  .pp-actions .btn { font-size: 15px; }
  .pp-fact-date, .pp-doc-meta, .pp-rel-meta, .pp-rel-note, .pp-meta { font-size: var(--text-sm); }
  .pp-fact-place, .pp-fact-also, .pp-fact-detail, .pp-note, .pp-vital-place { font-size: var(--text-sm); }
  .pp-badge, .pp-tile-kind, .pp-tile.is-story .label, .pp-doc-type, .pp-fact-also .label { font-size: var(--text-2xs); }
  .pp-tile-title, .pp-tile.is-file .pp-tile-title { font-size: 13px; }
  /* each source is its own 44px row, so the right record opens */
  .pp-cites ul { gap: 0; }
  .pp-cite { display: flex; align-items: center; min-height: var(--tap); padding: 0; font-size: var(--text-sm); }
  .pp-cite .icon { margin-top: 0; }
  .pp-cite-dot { margin-top: 0; }
  .pp-cites-more { font-size: var(--text-sm); }
  .pp-more { font-size: var(--text-sm); }
  .pp-cites-more, .pp-more, .pp-issue-person { min-height: var(--tap); }
  .pp-rel { min-height: 56px; }
  .pp-scroll { padding-bottom: calc(var(--space-8) + var(--safe-b)); }
}
@media (max-width: 359px) {
  .pp-bar-kicker .pp-kicker-line { display: none; }
  .pp-hero-grid { grid-template-columns: 92px minmax(0, 1fr); }
  .pp-name { font-size: 21px; }
  .pp-actions .btn { flex: 1 1 100%; }
}

@media print {
  .pp-scrim { display: none !important; }
}

/* ==========================================================================
   viewer.css: the media viewer (lightbox), prefix vw-.
   Near-black in both themes: .vw re-declares the dark tokens locally, so the
   shared components inside it (.btn, .label, .avatar, .marker) render dark.
   Layout: [main: bar / stage or reading column] [info column 320-400px].
   Phones, and tablets held upright: the info column becomes a bottom drawer
   with a 64px peek (viewer.js's DRAWER_QUERY matches the same media query).
   ========================================================================== */

html.vw-lock, html.vw-lock body { overflow: hidden; }

.vw {
  /* the dark palette, whatever the page theme */
  --bg: #0c0b0a;
  --surface: #1a1815;
  --surface-2: #25221e;
  --surface-3: #2e2a25;
  --ink: #f2ede3;
  --ink-2: #d9d2c5;
  --muted: #a69d8f;
  --faint: #7a7266;
  --rule: #2c2924;
  --rule-strong: #4c463d;
  --accent: #e58e62;
  --accent-ink: #1b1309;
  --on-ink: #11100e;
  --selection: rgba(229, 142, 98, .26);
  --harkins: #7cc69a;
  --perret: #db96c8;
  --dymond: #8db8ec;
  --henwood: #eaa964;
  --self: #a69d8f;
  --none: #7a7266;
  --vw-panel-bg: #141311;
  --vw-panel-w: 400px;
  --vw-bar-h: 56px;
  --vw-peek-h: calc(64px + var(--safe-b));
  color-scheme: dark;

  position: fixed;
  inset: 0;
  z-index: var(--z-viewer);
  display: grid;
  grid-template-columns: minmax(0, 1fr) var(--vw-panel-w);
  grid-template-rows: minmax(0, 1fr);
  color: var(--ink);
  font-family: var(--font);
  isolation: isolate;
  overscroll-behavior: contain;
}
.vw[hidden] { display: none; }
.vw:focus { outline: none; }
.vw ::selection { background: var(--selection); }
/* the backdrop: a layer of its own so pull-down-to-close can fade it */
.vw::before {
  content: "";
  position: absolute; inset: 0; z-index: -1;
  background: var(--viewer-bg, #0c0b0a);
  opacity: var(--vw-fade, 1);
}
.vw.is-entering { animation: vw-fade var(--dur) var(--ease) both; }
.vw.is-read { grid-template-columns: minmax(0, 1fr); }

@media (min-width: 700px) and (max-width: 1099px) {
  .vw { --vw-panel-w: 320px; }
}

/* ---------------------------------------------------------------- bar */
.vw-main {
  position: relative;
  display: grid;
  /* the bar row grows by the top safe area (home-screen mode, notches), so its controls keep their full height */
  grid-template-rows: calc(var(--vw-bar-h) + env(safe-area-inset-top, 0px)) minmax(0, 1fr);
  min-width: 0; min-height: 0;
}
.vw-bar {
  position: relative; z-index: 3;
  display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);
  padding: 0 var(--space-2) 0 var(--space-4);
  padding-top: env(safe-area-inset-top, 0px);
  min-width: 0;
}
.vw-bar-start, .vw-bar-end { display: flex; align-items: center; gap: var(--space-1); min-width: 0; }
.vw-count {
  min-width: 4.5em;
  font-size: var(--text-sm); font-weight: 600;
  letter-spacing: .04em;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.vw-btn {
  display: inline-grid; place-items: center; flex: none;
  width: var(--tap); height: var(--tap);
  padding: 0;
  border: 1px solid transparent;
  background: transparent;
  color: var(--ink-2);
  -webkit-tap-highlight-color: transparent;
  transition: background-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
}
.vw-btn:hover:not(:disabled) { background: rgba(255, 255, 255, .08); color: var(--ink); }
.vw-btn:active:not(:disabled) { background: rgba(255, 255, 255, .14); }
.vw-btn:disabled { opacity: .35; }
.vw-btn[hidden] { display: none; }
.vw-close { color: var(--ink); }

.vw-zoom {
  display: inline-flex; align-items: stretch;
  margin-right: var(--space-2);
  border: 1px solid var(--rule-strong);
}
.vw-zoom[hidden] { display: none; }
.vw-zoom .vw-btn { width: 40px; height: 38px; }
.vw-zoom .vw-btn + .vw-btn { border-left: 1px solid var(--rule-strong); }
.vw-zoom-level {
  width: auto !important; min-width: 58px; padding: 0 var(--space-2) !important;
  font-size: var(--text-xs); font-weight: 600; letter-spacing: .03em;
  font-variant-numeric: tabular-nums;
}
.vw-btn:focus-visible, .vw-zoom .vw-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
/* the bar's own prev/next only on phones and in narrow reading mode; wider screens use the side arrows */
.vw-bar-prev, .vw-bar-next { display: none; }

/* ---------------------------------------------------------------- stage */
.vw-stage {
  position: relative;
  min-width: 0; min-height: 0;
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
.vw-stage[hidden] { display: none; }
.vw-frame { position: absolute; inset: 0; }
.vw-frame[hidden] { display: none; }
.vw-frame.is-returning { transition: transform var(--dur) var(--ease), opacity var(--dur) var(--ease); }
.vw-img {
  position: absolute; left: 0; top: 0;
  max-width: none;
  transform-origin: 0 0;
  background: #1f1d1a;
  /* the print's frame: a hairline, kept crisp at any zoom */
  outline: 1px solid rgba(255, 255, 255, .1);
  outline-offset: 0;
  clip-path: inset(0);
  cursor: zoom-in;
  -webkit-user-drag: none;
  transition: filter var(--dur-slow) var(--ease);
}
.vw-img.is-blurred { filter: blur(12px) saturate(.85); }
.vw-img.is-animating { transition: transform var(--dur) var(--ease), filter var(--dur-slow) var(--ease); }
.vw.is-zoomed .vw-img { cursor: grab; }
.vw.is-panning .vw-img { cursor: grabbing; }

/* a 2px indeterminate bar while a large image loads (no spinners: square look) */
.vw-loader {
  position: absolute; left: 0; right: 0; top: 0; height: 2px; z-index: 2;
  overflow: hidden;
  pointer-events: none;
}
.vw-loader[hidden] { display: none; }
.vw-loader::after {
  content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 30%;
  background: var(--accent);
  animation: vw-load 1.1s var(--ease-in-out) infinite;
}

.vw-status {
  position: absolute; left: 50%; bottom: var(--space-5); z-index: 2;
  transform: translateX(-50%);
  display: flex; align-items: center; gap: var(--space-2);
  max-width: calc(100% - 2 * var(--space-4));
  padding: var(--space-2) var(--space-3);
  background: rgba(20, 19, 17, .92);
  border: 1px solid var(--rule-strong);
  border-left: 3px solid var(--muted);
  color: var(--ink-2);
  font-size: var(--text-sm);
  line-height: 1.4;
}
.vw-status.is-error { top: 50%; bottom: auto; transform: translate(-50%, -50%); border-left-color: var(--accent); }
.vw-status[hidden] { display: none; }

/* PDF uploads: a document tile in the middle of the stage */
.vw-doc { position: absolute; inset: 0; display: grid; place-items: center; padding: var(--space-5); }
.vw-doc[hidden] { display: none; }
.vw-doc-tile {
  display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-3);
  width: min(340px, 100%);
  padding: var(--space-6);
  background: var(--surface);
  border: 1px solid var(--rule-strong);
  border-top: 4px solid var(--accent);
}
.vw-doc-icon { color: var(--ink-2); margin-bottom: var(--space-2); }
.vw-doc-title { font-size: var(--text-lg); font-weight: 700; line-height: 1.25; letter-spacing: var(--tracking-tight); margin-bottom: var(--space-3); overflow-wrap: anywhere; }

/* side arrows over the stage (tablet and desktop) */
.vw-nav {
  position: absolute; top: calc(50% + var(--vw-bar-h) / 2); z-index: 3;
  width: 52px; height: 72px;
  margin-top: -36px;
  background: rgba(12, 11, 10, .6);
  border-color: rgba(255, 255, 255, .14);
  color: var(--ink);
}
.vw-nav:hover:not(:disabled) { background: rgba(37, 34, 30, .92); border-color: rgba(255, 255, 255, .3); }
.vw-prev { left: var(--space-4); }
.vw-next { right: var(--space-4); }

/* ---------------------------------------------------------------- info column */
.vw-panel {
  position: relative; z-index: 4;
  display: flex; flex-direction: column;
  min-width: 0; min-height: 0;
  background: var(--vw-panel-bg);
  border-left: 1px solid var(--rule);
}
.vw-panel[hidden] { display: none; }
.vw-peek { display: none; }
.vw-panel-body {
  flex: 1; min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: var(--space-6) var(--space-5) var(--space-7);
  scrollbar-width: thin;
  scrollbar-color: var(--rule-strong) transparent;
}

/* title block */
.vw-kind { display: flex; align-items: center; gap: var(--space-2); margin: 0; }
.vw-title {
  margin: var(--space-3) 0 0;
  font-size: var(--text-lg); font-weight: 700;
  line-height: 1.22;
  letter-spacing: var(--tracking-tight);
  color: var(--ink);
  overflow-wrap: anywhere;
  text-wrap: balance;
}
.vw-meta {
  margin: var(--space-2) 0 0;
  font-size: var(--text-sm); color: var(--muted);
  font-variant-numeric: tabular-nums;
  line-height: 1.45;
}

/* date / place / indexed name */
.vw-facts { margin: var(--space-5) 0 0; border-top: 1px solid var(--rule); }
.vw-fact {
  display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: var(--space-3);
  padding: 9px 0;
  border-bottom: 1px solid var(--rule);
}
.vw-fact dt { padding-top: 3px; }
.vw-fact dd { margin: 0; font-size: var(--text-sm); color: var(--ink-2); line-height: 1.45; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

.vw-desc { margin-top: var(--space-4); }
.vw-desc p {
  margin: 0 0 var(--space-3);
  font-size: 15px; line-height: 1.6; color: var(--ink-2);
  white-space: pre-line;
  overflow-wrap: anywhere;
}
.vw-desc p:last-child { margin-bottom: 0; }
.vw-inline-link { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; text-decoration-thickness: 1px; overflow-wrap: anywhere; }
.vw-inline-link:hover { text-decoration-thickness: 2px; }

/* actions: Ancestry, Download, editor */
.vw-actions {
  display: flex; flex-wrap: wrap; gap: var(--space-2);
  margin-top: var(--space-5);
}
.vw-action { flex: 1 1 140px; justify-content: center; }
.vw-action:disabled { opacity: .7; }
.vw-remove:hover:not(:disabled) { --btn-bd: var(--accent); color: var(--accent); }
.vw-remove.is-armed { --btn-bg: var(--accent); --btn-fg: var(--accent-ink); --btn-bd: var(--accent); color: var(--accent-ink); }

/* sections */
.vw-sec { margin-top: var(--space-6); }
.vw-sec-title {
  margin: 0 0 var(--space-2);
  padding-bottom: var(--space-2);
  border-bottom: 1px solid var(--rule-strong);
}

/* people */
.vw-people { list-style: none; margin: 0; padding: 0; }
.vw-people li + li { border-top: 1px solid var(--rule); }
.vw-person {
  display: flex; align-items: center; gap: var(--space-3);
  width: 100%; min-height: 56px;
  padding: var(--space-2) 0;
  background: none; border: 0;
  color: var(--ink);
  text-align: left;
}
.vw-person-text { display: grid; flex: 1; min-width: 0; }
.vw-person-name { font-size: 15px; font-weight: 600; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 3px; transition: text-decoration-color var(--dur-fast) var(--ease); }
.vw-person-sub { font-size: var(--text-xs); color: var(--muted); line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
.vw-person-go { color: var(--faint); transition: transform var(--dur) var(--ease), color var(--dur-fast) var(--ease); }
.vw-person:hover .vw-person-name { text-decoration-color: currentColor; }
.vw-person:hover .vw-person-go { color: var(--ink); transform: translateX(3px); }
.vw-person:focus-visible { outline-offset: 2px; }

/* transcription: two-column label / value */
.vw-fields { width: 100%; border-collapse: collapse; font-size: 13px; line-height: 1.45; font-variant-numeric: tabular-nums; }
.vw-fields tr + tr { border-top: 1px solid var(--rule); }
.vw-fields th {
  width: 42%;
  padding: 7px var(--space-3) 7px 0;
  text-align: left; vertical-align: top;
  font-weight: 500; color: var(--muted);
}
.vw-fields td { padding: 7px 0; color: var(--ink); vertical-align: top; overflow-wrap: anywhere; }

/* household and other tables: sideways scrolling stays inside the box */
.vw-table-wrap {
  max-width: 100%;
  touch-action: auto;
  overflow-x: auto;
  overscroll-behavior-x: contain;
  border: 1px solid var(--rule);
  background: rgba(255, 255, 255, .015);
  scrollbar-width: thin;
  scrollbar-color: var(--rule-strong) transparent;
}
.vw-table-wrap:focus-visible { outline-offset: 2px; }
.vw-table { width: 100%; border-collapse: collapse; font-size: 13px; line-height: 1.35; font-variant-numeric: tabular-nums; }
.vw-table th {
  padding: 8px 10px;
  text-align: left;
  font-size: var(--text-2xs); font-weight: 600; letter-spacing: var(--tracking-caps); text-transform: uppercase;
  color: var(--muted);
  background: var(--surface);
  border-bottom: 1px solid var(--rule-strong);
  white-space: nowrap;
}
.vw-table td { padding: 7px 10px; color: var(--ink-2); white-space: nowrap; }
.vw-table tbody tr + tr td { border-top: 1px solid var(--rule); }
.vw-table tr.is-self td { color: var(--ink); font-weight: 600; background: rgba(229, 142, 98, .09); }
.vw-table tr.is-self td:first-child { box-shadow: inset 3px 0 0 var(--accent); }

.vw-cite { margin: 0; font-size: 13px; line-height: 1.55; color: var(--muted); overflow-wrap: anywhere; }
.vw-credit {
  margin: var(--space-6) 0 0;
  font-size: var(--text-xs); line-height: 1.45; color: var(--faint);
}

/* ---------------------------------------------------------------- reading layout: stories, records without a scan */
.vw-read {
  min-width: 0; min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: var(--space-5) var(--space-8) var(--space-8);
  touch-action: pan-y;
  scrollbar-width: thin;
  scrollbar-color: var(--rule-strong) transparent;
}
.vw-read[hidden] { display: none; }
.vw-read:focus { outline: none; }
.vw-article { max-width: 760px; margin: 0 auto; padding-top: var(--space-4); }
/* stories read at about 65 characters a line (Libre Franklin at 18px is ~9px a character; ch would be the wide "0") */
.vw-article.is-story { max-width: 37.5rem; }
.vw-article .vw-head { padding-bottom: var(--space-5); border-bottom: 2px solid var(--ink); }
.vw-article .vw-title {
  margin-top: var(--space-4);
  font-size: clamp(28px, 3.4vw, 40px); font-weight: 800;
  line-height: 1.1;
}
.vw-article .vw-meta { font-size: var(--text-base); }
.vw-article.is-record .vw-title { font-size: clamp(26px, 2.6vw, 34px); font-weight: 700; line-height: 1.15; }
.vw-article .vw-facts { border-top: 0; margin-top: 0; }
.vw-article .vw-fact { grid-template-columns: 140px minmax(0, 1fr); padding: 11px 0; }
.vw-noscan {
  display: flex; align-items: flex-start; gap: var(--space-2);
  margin: var(--space-5) 0 0;
  padding: var(--space-3) var(--space-4);
  border-left: 3px solid var(--rule-strong);
  background: var(--surface);
  color: var(--muted);
  font-size: var(--text-sm); line-height: 1.45;
}
.vw-noscan .icon { margin-top: 1px; }
.vw-article .vw-fields { font-size: var(--text-sm); }
.vw-article .vw-fields th { width: 36%; padding-top: 9px; padding-bottom: 9px; }
.vw-article .vw-fields td { padding-top: 9px; padding-bottom: 9px; }
.vw-article .vw-table { font-size: var(--text-sm); }

.vw-prose { margin-top: var(--space-6); }
.vw-prose p {
  margin: 0 0 1.15em;
  font-size: var(--text-md); line-height: 1.72;
  color: var(--ink);
  white-space: pre-line;
  overflow-wrap: break-word;
  hanging-punctuation: first;
}
.vw-prose p:last-child { margin-bottom: 0; }

.vw-article-foot {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 var(--space-6);
  align-items: start;
  margin-top: var(--space-7);
  padding-top: var(--space-2);
  border-top: 1px solid var(--rule-strong);
}
.vw-article-foot .vw-sec-people { margin-top: var(--space-4); }
.vw-article-foot .vw-actions { margin-top: var(--space-4); align-self: start; }
.vw-article-foot .vw-actions:first-child { grid-column: 1 / -1; }
.vw-article-foot .vw-credit { grid-column: 1 / -1; margin-top: var(--space-5); }

/* ---------------------------------------------------------------- tablet and phone: prev/next live in the bar, so they never cover the image */
@media (max-width: 1099px) {
  .vw-nav { display: none; }
  .vw:not(.is-single) .vw-bar-prev, .vw:not(.is-single) .vw-bar-next { display: inline-grid; }
  .vw-bar-start { gap: 0; }
  .vw-count { min-width: 3.6em; text-align: center; }
  .vw-read { padding-inline: var(--space-6); }
}

/* ---------------------------------------------------------------- phones and upright tablets: full-bleed stage, info drawer */
@media (max-width: 699px), (max-width: 1099px) and (orientation: portrait) {
  .vw { grid-template-columns: minmax(0, 1fr); }
  .vw:not(.is-read) .vw-main { padding-bottom: var(--vw-peek-h); }

  .vw-panel {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: min(80dvh, 680px);
    border-left: 0;
    border-top: 1px solid var(--rule-strong);
    transform: translateY(calc(100% - var(--vw-peek-h)));
    transition: transform var(--dur-slow) var(--ease), box-shadow var(--dur-slow) var(--ease);
  }
  .vw.is-drawer-open .vw-panel { transform: none; box-shadow: 0 -18px 40px rgba(0, 0, 0, .55); }
  .vw.is-drawer-open .vw-stage { opacity: .45; transition: opacity var(--dur) var(--ease); }
  .vw-peek {
    position: relative;
    display: flex; align-items: center; gap: var(--space-3); flex: none;
    width: 100%; height: 64px;
    padding: 6px var(--space-4) 0;
    background: none; border: 0;
    color: var(--ink);
    text-align: left;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  .vw-peek:focus-visible { outline-offset: -2px; }
  .vw-handle { position: absolute; top: 7px; left: 50%; width: 36px; height: 3px; margin-left: -18px; background: var(--rule-strong); }
  .vw-peek-text { display: grid; flex: 1; min-width: 0; gap: 2px; }
  .vw-peek-title { font-size: 15px; font-weight: 600; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vw-peek-icon { display: inline-grid; place-items: center; width: var(--tap); height: var(--tap); margin-right: calc(-1 * var(--space-2)); color: var(--ink-2); transition: transform var(--dur) var(--ease); }
  .vw.is-drawer-open .vw-peek-icon { transform: rotate(180deg); }
  .vw-panel-body {
    padding: var(--space-2) var(--space-4) calc(var(--space-6) + var(--safe-b));
    border-top: 1px solid var(--rule);
  }
  /* the drawer's peek already shows the kind and title; open, it shows the whole title */
  .vw-panel-body > .vw-head .vw-kind, .vw-panel-body > .vw-head .vw-title { display: none; }
  .vw-panel-body > .vw-head .vw-meta { margin-top: var(--space-1); }
  .vw-panel-body > .vw-head:not(:has(.vw-meta)) { display: none; }
  .vw.is-drawer-open .vw-peek { min-height: 64px; height: auto; padding-bottom: var(--space-3); padding-top: 18px; }
  .vw.is-drawer-open .vw-peek-title { white-space: normal; font-size: var(--text-md); font-weight: 700; line-height: 1.25; text-wrap: balance; }
  .vw:not(.is-drawer-open) .vw-panel-body { visibility: hidden; transition: visibility 0s linear var(--dur-slow); }
}
/* upright tablets: the drawer spans the screen, its text keeps a readable measure in the middle */
@media (min-width: 700px) and (max-width: 1099px) and (orientation: portrait) {
  .vw-panel { height: min(62dvh, 720px); }
  .vw-peek, .vw-panel-body { padding-inline: max(var(--space-5), calc((100% - 640px) / 2)); }
  .vw-peek-icon { margin-right: 0; }
}

/* ---------------------------------------------------------------- phone */
@media (max-width: 699px) {
  .vw { --vw-bar-h: 52px; }
  /* the shorthand keeps the top safe area (×, prev/next and the counter stay clear of the status bar) */
  .vw-bar { padding: env(safe-area-inset-top, 0px) var(--space-1) 0; }
  .vw-zoom { display: none; }

  .vw-read { padding: var(--space-2) var(--space-4) calc(var(--space-7) + var(--safe-b)); }
  .vw-article { padding-top: var(--space-2); }
  .vw-article .vw-title { font-size: 28px; }
  .vw-article .vw-fact { grid-template-columns: 104px minmax(0, 1fr); }
  .vw-article .vw-fields th { width: 42%; }
  .vw-prose p { font-size: 17px; line-height: 1.68; }
  .vw-article-foot { grid-template-columns: minmax(0, 1fr); }
  .vw-person { min-height: 60px; }
}

/* ---------------------------------------------------------------- motion */
.vw-in-fade { animation: vw-fade var(--dur) var(--ease) backwards; }
.vw-in-right { animation: vw-from-right var(--dur-slow) var(--ease) backwards; }
.vw-in-left { animation: vw-from-left var(--dur-slow) var(--ease) backwards; }
@keyframes vw-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes vw-from-right { from { opacity: 0; transform: translate3d(48px, 0, 0); } to { opacity: 1; transform: none; } }
@keyframes vw-from-left { from { opacity: 0; transform: translate3d(-48px, 0, 0); } to { opacity: 1; transform: none; } }
@keyframes vw-load { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
@media (prefers-reduced-motion: reduce) {
  .vw, .vw * { animation: none !important; transition: none !important; }
  .vw-loader::after { left: 0; width: 100%; opacity: .6; }
}
@media print { .vw { display: none !important; } }

/* ==========================================================================
   editor.css: the editor's dialogs (connect to GitHub, add photos and documents, remove, profile photo).
   Prefix ed-. Square corners, hairlines, straight accent rules; tokens only.
   ========================================================================== */

/* the page doesn't scroll behind an open dialog */
html.ed-locked, html.ed-locked body { overflow: hidden; }

/* ---------------------------------------------------------------- shell */
.ed-layer {
  position: fixed; inset: 0; z-index: var(--z-dialog);
  display: grid; place-items: center;
  padding: var(--space-6) var(--gutter);
  transition: opacity 160ms var(--ease);
}
.ed-layer.is-leaving { opacity: 0; pointer-events: none; }
.ed-scrim {
  position: absolute; inset: 0;
  background: var(--scrim);
  animation: fade-in var(--dur) var(--ease);
}
.ed-dialog {
  position: relative;
  display: flex; flex-direction: column;
  width: min(100%, 620px);
  max-height: min(calc(100dvh - 2 * var(--space-6)), 880px);
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--rule-strong);
  border-top: 3px solid var(--ink);
  box-shadow: var(--shadow-float);
  animation: rise-in var(--dur-slow) var(--ease);
  outline: none;
}
.ed-dialog-sm { width: min(100%, 460px); }
.ed-dialog-lg { width: min(100%, 780px); }

.ed-head {
  display: flex; align-items: flex-start; gap: var(--space-3);
  padding: var(--space-5) var(--space-5) var(--space-4);
  border-bottom: 1px solid var(--rule);
}
.ed-head-text { flex: 1; min-width: 0; }
.ed-kicker { margin: 0 0 6px; }
.ed-title {
  margin: 0;
  font-size: var(--text-lg); font-weight: 700; line-height: var(--leading-tight);
  letter-spacing: var(--tracking-tight);
  overflow-wrap: anywhere;
}
.ed-sub { margin: 6px 0 0; color: var(--muted); font-size: var(--text-sm); line-height: var(--leading-snug); }
.ed-close { margin: -10px -12px 0 0; color: var(--muted); }
.ed-close:hover:not(:disabled) { color: var(--ink); }

/* the upload dialog puts the person's avatar beside the title */
.ed-upload .ed-head-text {
  display: grid; grid-template-columns: 48px minmax(0, 1fr); column-gap: var(--space-4); align-items: center;
}
.ed-upload .ed-head-text > * { grid-column: 2; }
.ed-upload .ed-head-text > .ed-head-avatar { grid-column: 1; grid-row: 1 / span 3; align-self: center; }

.ed-body {
  flex: 1 1 auto; min-height: 0;
  overflow-y: auto; overscroll-behavior: contain;
  padding: var(--space-5);
}
.ed-foot {
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-5);
  border-top: 1px solid var(--rule);
  background: var(--surface);
}
.ed-foot:empty { display: none; }
.ed-foot-actions { display: flex; gap: var(--space-2); margin-left: auto; }
.ed-text { margin: 0 0 var(--space-3); color: var(--ink-2); font-size: var(--text-sm); line-height: var(--leading); }
.ed-text:last-child { margin-bottom: 0; }

/* a destructive action */
.btn.ed-danger { --btn-bg: var(--error); --btn-fg: var(--bg); --btn-bd: var(--error); }
.btn.ed-danger:hover:not(:disabled) { --btn-bg: var(--error); --btn-bd: var(--ink); }

/* ---------------------------------------------------------------- status line and spinner */
.ed-status {
  display: flex; align-items: flex-start; gap: var(--space-2);
  margin: var(--space-4) 0 0;
  padding: 10px var(--space-3);
  border-left: 3px solid var(--rule-strong);
  background: var(--surface-2);
  font-size: var(--text-sm); line-height: 1.5; color: var(--ink);
  animation: fade-in var(--dur) var(--ease);
}
.ed-status[hidden] { display: none; }
.ed-status .icon { --icon-size: 18px; margin-top: 1px; }
.ed-status.is-ok { border-left-color: var(--ok); background: var(--ok-bg); }
.ed-status.is-ok .icon { color: var(--ok); }
.ed-status.is-error { border-left-color: var(--error); background: var(--error-bg); }
.ed-status.is-error .icon { color: var(--error); }
.ed-body > .ed-status:first-child { margin-top: 0; }

/* a square that turns: no circles here */
.ed-spinner {
  flex: none; display: inline-block;
  width: 14px; height: 14px; margin: 3px 2px 0;
  border: 2px solid var(--rule-strong); border-top-color: var(--ink);
  animation: ed-turn 900ms linear infinite;
}
@keyframes ed-turn { to { transform: rotate(360deg); } }

/* ---------------------------------------------------------------- settings */
.ed-lead { margin: 0 0 var(--space-5); color: var(--ink-2); font-size: var(--text-base); line-height: var(--leading); max-width: 62ch; }
.ed-callout {
  display: flex; align-items: flex-start; gap: var(--space-2);
  margin: 0 0 var(--space-4); padding: 10px var(--space-3);
  border-left: 3px solid var(--accent); background: var(--surface-2);
  font-size: var(--text-sm); font-weight: 500; line-height: 1.5;
}
.ed-callout .icon { --icon-size: 18px; color: var(--accent); margin-top: 1px; }
.ed-connected {
  display: flex; align-items: flex-start; gap: var(--space-3);
  margin: 0 0 var(--space-5); padding: var(--space-3) var(--space-4);
  border: 1px solid var(--rule); border-left: 3px solid var(--ok);
  background: var(--ok-bg);
}
.ed-connected-mark { flex: none; display: grid; place-items: center; width: 28px; height: 28px; background: var(--ok); color: var(--bg); }
.ed-connected-mark .icon { --icon-size: 18px; }
.ed-connected-title { margin: 0; font-weight: 700; font-size: var(--text-base); line-height: 1.3; }
.ed-connected-meta { margin: 2px 0 0; color: var(--ink-2); font-size: var(--text-xs); line-height: 1.45; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.ed-h3 {
  margin: 0 0 var(--space-2);
  font-size: var(--text-xs); font-weight: 700; letter-spacing: var(--tracking-caps); text-transform: uppercase;
  color: var(--ink);
}
.ed-steps {
  counter-reset: ed-step;
  list-style: none; margin: 0 0 var(--space-5); padding: 0;
  border-top: 1px solid var(--rule);
}
.ed-steps > li {
  counter-increment: ed-step;
  position: relative;
  padding: 11px 0 11px 40px;
  border-bottom: 1px solid var(--rule);
  font-size: var(--text-sm); line-height: 1.55; color: var(--ink-2);
}
.ed-steps > li::before {
  content: counter(ed-step);
  position: absolute; left: 0; top: 11px;
  display: grid; place-items: center;
  width: 24px; height: 24px;
  background: var(--ink); color: var(--on-ink);
  font-size: var(--text-xs); font-weight: 700; font-variant-numeric: tabular-nums;
}
.ed-steps strong { color: var(--ink); font-weight: 600; }
.ed-a {
  color: var(--accent); font-weight: 600;
  text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px;
  overflow-wrap: anywhere;
}
.ed-a .icon { --icon-size: 14px; display: inline-block; vertical-align: -2px; margin-left: 4px; }
.ed-a:hover { text-decoration-thickness: 2px; }
.ed-field { margin: 0; }
.ed-token { letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.ed-help { margin: 0; color: var(--muted); font-size: var(--text-xs); line-height: 1.5; max-width: 64ch; }
.ed-remember {
  margin: var(--space-4) 0 0; padding: 4px var(--space-4) var(--space-3);
  background: var(--surface-2); border-left: 3px solid var(--rule-strong);
}
.ed-remember .check { font-weight: 600; color: var(--ink); }
.ed-forget { color: var(--muted); }
.ed-forget:hover:not(:disabled) { color: var(--error); }

/* ---------------------------------------------------------------- upload */
.ed-notice {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--space-3); align-items: baseline;
  margin: 0 0 var(--space-4); padding: 10px var(--space-4);
  border: 1px solid var(--rule); border-left: 3px solid var(--accent);
  background: var(--bg);
}
.ed-notice .label { color: var(--accent); }
.ed-notice p { margin: 0; font-size: var(--text-sm); line-height: 1.5; color: var(--ink-2); }
.ed-notice strong { color: var(--ink); font-weight: 600; overflow-wrap: anywhere; }

.ed-drop {
  display: grid; justify-items: center; gap: 4px;
  padding: var(--space-6) var(--space-5);
  border: 1px dashed var(--rule-strong);
  background: var(--bg);
  text-align: center;
  cursor: pointer;
  transition: border-color var(--dur-fast) var(--ease), background-color var(--dur-fast) var(--ease);
}
.ed-drop:hover { border-color: var(--muted); }
.ed-drop.is-over { border-color: var(--accent); border-style: solid; background: var(--selection); }
.ed-drop-icon { display: grid; place-items: center; width: 52px; height: 52px; margin-bottom: 6px; border: 1px solid var(--rule-strong); background: var(--surface); color: var(--ink); }
.ed-drop-icon .icon { --icon-size: 26px; }
.ed-drop-title { margin: 0; font-size: var(--text-md); font-weight: 700; letter-spacing: -.01em; line-height: 1.3; }
.ed-drop-meta { margin: 0 0 var(--space-3); max-width: 46ch; color: var(--muted); font-size: var(--text-sm); line-height: 1.5; }
/* once files are chosen the drop zone shrinks to one row */
.ed-drop.is-compact {
  grid-template-columns: auto minmax(0, 1fr) auto; justify-items: start; align-items: center;
  column-gap: var(--space-3); padding: var(--space-3) var(--space-4); text-align: left;
}
.ed-drop.is-compact .ed-drop-icon { width: 36px; height: 36px; margin: 0; grid-row: 1 / span 2; }
.ed-drop.is-compact .ed-drop-icon .icon { --icon-size: 20px; }
.ed-drop.is-compact .ed-drop-title { font-size: var(--text-sm); }
.ed-drop.is-compact .ed-drop-meta { margin: 0; font-size: var(--text-xs); grid-column: 2; }
.ed-drop.is-compact .btn { grid-column: 3; grid-row: 1 / span 2; }

.ed-files { list-style: none; margin: var(--space-4) 0 0; padding: 0; border-top: 1px solid var(--rule); }
.ed-files[hidden] { display: none; }
.ed-file {
  display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: var(--space-4);
  padding: var(--space-4) 0;
  border-bottom: 1px solid var(--rule);
  animation: rise-in var(--dur) var(--ease);
}
.ed-file-preview {
  width: 120px; aspect-ratio: 1;
  display: grid; place-items: center; overflow: hidden;
  border: 1px solid var(--rule-strong);
  background: var(--surface-2);
}
.ed-file-preview img { display: block; width: 100%; height: 100%; object-fit: cover; }
.ed-file-doc { display: grid; justify-items: center; gap: 4px; color: var(--muted); }
.ed-file-doc span { font-size: var(--text-2xs); font-weight: 700; letter-spacing: var(--tracking-caps); }
.ed-file.is-error .ed-file-preview { opacity: .55; }
.ed-file-main { min-width: 0; }
.ed-file-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-2); margin-bottom: var(--space-3); }
.ed-file-name { min-width: 0; display: grid; gap: 2px; padding-top: 2px; }
.ed-file-name strong { font-size: var(--text-sm); font-weight: 600; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ed-file-meta { color: var(--muted); font-size: var(--text-xs); line-height: 1.4; font-variant-numeric: tabular-nums; }
.ed-file-remove { margin: -6px -8px 0 0; color: var(--muted); }
.ed-file-remove:hover:not(:disabled) { color: var(--ink); }
.ed-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: var(--space-3); }
.ed-span { grid-column: 1 / -1; }
.ed-grid textarea.input { min-height: 68px; }
.ed-avatar-check { margin-top: var(--space-1); }
.ed-file-error {
  display: flex; align-items: flex-start; gap: var(--space-2);
  margin: 0; padding: 10px var(--space-3);
  border-left: 3px solid var(--error); background: var(--error-bg);
  font-size: var(--text-sm); line-height: 1.5; color: var(--ink);
}
.ed-file-error .icon { --icon-size: 18px; color: var(--error); margin-top: 1px; }

/* footer: summary and progress on the left, actions on the right */
.ed-foot-info { flex: 1 1 220px; min-width: 0; display: grid; gap: 8px; }
.ed-summary { margin: 0; color: var(--muted); font-size: var(--text-sm); line-height: 1.4; font-variant-numeric: tabular-nums; }
.ed-dialog.is-busy .ed-summary { color: var(--ink); font-weight: 600; }
.ed-progress { position: relative; height: 4px; background: var(--rule); overflow: hidden; }
.ed-progress[hidden] { display: none; }
.ed-progress-fill {
  position: absolute; inset: 0 auto 0 0;
  width: var(--pct, 0%);
  background: var(--ink);
  transition: width var(--dur-slow) var(--ease);
}
.ed-dialog.is-busy .ed-body { opacity: .7; }

/* ---------------------------------------------------------------- tablet and up */
@media (min-width: 700px) {
  .ed-foot .btn { min-width: 96px; }
}

/* ---------------------------------------------------------------- phone: full-screen sheets */
@media (max-width: 699px) {
  .ed-layer { padding: 0; place-items: end stretch; }
  .ed-dialog, .ed-dialog-sm, .ed-dialog-lg {
    width: 100%;
    height: 100dvh; max-height: 100dvh;
    border-left: 0; border-right: 0; border-bottom: 0;
    padding-top: env(safe-area-inset-top, 0px);
  }
  /* short dialogs (confirm, working) stay a bottom sheet */
  .ed-dialog-sm { height: auto; max-height: 92dvh; padding-top: 0; }
  .ed-head { padding: var(--space-4) var(--gutter) var(--space-3); }
  .ed-close { margin: -8px -10px 0 0; }
  .ed-title { font-size: 20px; }
  .ed-body { padding: var(--space-4) var(--gutter); }
  .ed-foot { padding: var(--space-3) var(--gutter) calc(var(--space-3) + var(--safe-b)); }
  .ed-foot-actions { flex: 1 1 100%; margin-left: 0; }
  .ed-foot-actions > .btn { flex: 1; }
  .ed-foot-info { flex-basis: 100%; }
  .ed-steps > li { padding-left: 36px; }
  .ed-notice { grid-template-columns: 1fr; gap: 4px; }
  .ed-drop { padding: var(--space-5) var(--space-4); }
  .ed-drop.is-compact { grid-template-columns: auto minmax(0, 1fr); row-gap: var(--space-2); }
  .ed-drop.is-compact .ed-drop-icon { grid-row: 1 / span 2; align-self: start; }
  .ed-drop.is-compact .btn { grid-column: 1 / -1; grid-row: 3; width: 100%; }
  /* the preview and file name share the first row; the fields span the width below */
  .ed-file { grid-template-columns: 72px minmax(0, 1fr); column-gap: var(--space-3); row-gap: var(--space-3); }
  .ed-file-preview { width: 72px; }
  .ed-file-main { display: contents; }
  .ed-file-head { margin: 0; align-self: center; }
  .ed-file-main > :not(.ed-file-head) { grid-column: 1 / -1; }
  .ed-grid { grid-template-columns: minmax(0, 1fr); }
  .ed-file-doc .icon { --icon-size: 26px; }
}

jpg","thumb":"media/t/e18ca479-0613-431e-86bd-3d955dfa2980.jpg","w":1316,"h":2400},"a-e454296b":{"id":"a-e454296b","kind":"headstone","title":"John Dymond 1852 2","date":"","place":"Falls, Wyoming, PA","desc":"","people":["@I342200912373@"],"credit":"Shared on Ancestry by ccampbell24","link":"","primary":[],"src":"media/p/e454296b-1b48-4ec2-80bc-357f3fab699c.jpg","thumb":"media/t/e454296b-1b48-4ec2-80bc-357f3fab699c.jpg","w":230,"h":370},"a-f03f2dff":{"id":"a-f03f2dff","kind":"headstone","title":"Emily 58-12 Thomas 27-31 Regina 21-80 William 89-58 Clare 93-96 Emile 93-81 Regina 92-80","date":"","place":"","desc":"","people":["@I342219651209@"],"credit":"Shared on Ancestry by ahenwood14","link":"","primary":["@I342219651209@"],"src":"media/p/f03f2dff-6a59-4dc6-bb6d-76439a16d916.jpg","thumb":"media/t/f03f2dff-6a59-4dc6-bb6d-76439a16d916.jpg","w":800,"h":524},"a-f6273184":{"id":"a-f6273184","kind":"photo","title":"Abraham Henwood","date":"","place":"","desc":"","people":["@I342202235553@"],"credit":"Shared on Ancestry by jeffreymooreallen","link":"","primary":[],"src":"media/p/f6273184-2599-40a4-b6a1-f18821238516.jpg","thumb":"media/t/f6273184-2599-40a4-b6a1-f18821238516.jpg","w":1607,"h":2400},"a-fe1d1967":{"id":"a-fe1d1967","kind":"headstone","title":"John Dymond","date":"","place":"","desc":"Original stone","people":["@I342200912373@"],"credit":"Shared on Ancestry by Dymond80","link":"","primary":[],"src":"media/p/fe1d1967-e95e-49aa-9a5e-2bb4bff075e2.jpg","thumb":"media/t/fe1d1967-e95e-49aa-9a5e-2bb4bff075e2.jpg","w":750,"h":1030},"a-5b6b3f81":{"id":"a-5b6b3f81","kind":"story","title":"Notes on John Dymond","date":"","place":"","desc":"","people":["@I342200912373@"],"credit":"Shared on Ancestry by marcytwp","link":"","primary":[],"text":"Coolbaugh Family in America,\n\n\"Native of Connecticut and was first settler at Keelersburg in 1800, from whence he removed to Sickler Hill and finally to Dymond Hollow. His wife was a native of New Jersey, and is said to have been half aboriginal, and most of her descendants are very proud of the strain of 'true American' that permeates their veins.\"\n\nFrom Bradsby \"History of Luzerne County PA\"\n\n\" John and Mary (Lauson) Dymond, both of whom were natives of Connecticut, [were among] the first settlers in this county, locating first in Keelersburgn, now Wyoming County; from there he removed to Sickler’s Hill, where he remained for a number of years, and finally removed to his grandson’s present residence, Dymond Hollow, where he occupied a farm of 150 acres of unimproved land, thirty-five of which he cleared. He was a hard-working man of pure principles, and a consistent member of the Methodist Episcopal Church. He lived to be one hundred years of age, his wife to be one hundred and four....\n\n\"Lockville took its first name from the locks on the nearby uncompleted Susquehanna Canal. The Dymond Hollow Methodist church and cemetery are well preserved and cared for, but the other buildings such as the post office, the general store, the furniture factory and the family homesteads are either in a state of decay or have disappeared. The mill and millpond are gone and there is only slight evidence of the millrace. There are still a few Dymond names on a mailbox here and there....The first Methodist Church building was erected in 1835. The present church was built in 1870. Dymond Hollow is off the beaten path and only a narrow winding dirt road with a few dilapidated buildings remain.\"\n\nThank's to Lois Stewart, and the Descendants of Jean Mousnier de la MONTAGNE (1595-1670) Web Site for this info."},"a-d82e8662":{"id":"a-d82e8662","kind":"story","title":"Early Luzerne County, Pa. Settler","date":"","place":"","desc":"","people":["@I342200912373@"],"credit":"Shared on Ancestry by ksorenson100","link":"","primary":[],"text":"Among the first settlers of Keelersburg were John and Mary Lawson Dymond about 1800, and that they moved to Sickler's Hill, and finally resided on a 150 acre virgin farm at Lockville which is today known as Diamond Hollow, Pa. Lockville took its name from the locks on the nearby uncompleted Susquehanna Canal. The Dymond Hollow Methodist church and cemetary are well preseerved and cared for, but the other buildings such as the post office, the general store, the furniture factory and the family homesteads are either in a state of decay or have disappearded. The mill and millpond are gone and there is only slight evidence of the millrace. There are still a few Dymond names on the mailbox here and there...The first Methodist Church building was erected in 1835. The present church was built in 1870. Dymond Hollow is off the beaten path and only a narrow winding dirt road with a few dilapidated buildings remains.\n\nCopyright 1998-2009 S. J. Dimond\n\nAll Rights Reserved in all media. Unless otherwise noted all transcripts were made by this author from photocopies or scans of the recorded instrument. Selections may be used for non-profit family history if this notice is attached."},"r-3693-72014214":{"id":"r-3693-72014214","kind":"record","type":"Social Security","coll":"U.S., Social Security Death Index, 1935-2014","title":"U.S., Social Security Death Index, 1935-2014","name":"Thomas M. Harkins","year":2003,"fields":[["Name","Thomas M. Harkins"],["Birth Date","7 Jan 1918"],["Issue year","Before 1951"],["Issue State","Pennsylvania"],["Last Residence","08055, Medford, Burlington, New Jersey, USA"],["Death Date","2 Dec 2003"]],"tables":[],"citation":"Social Security Administration; Washington D.C., USA; Social Security Death Index, Master File","people":["@I342194601955@"],"link":"https://www.ancestry.com/search/collections/3693/records/72014214","external":"","credit":"Ancestry.com"},"r-3147-1419734":{"id":"r-3147-1419734","kind":"record","type":"Veteran file","coll":"Pennsylvania, U.S., Veteran Compensation Application Files, WWII, 1950-1966","title":"Pennsylvania, U.S., Veteran Compensation Application Files, WWII, 1950-1966","name":
