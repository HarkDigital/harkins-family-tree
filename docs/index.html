(function () {

})();

<style>/* ==========================================================================
   Harkins Family Tree: design system (site.css)
   Tokens, type, layout, components and the page sections. Module styles live
   in their own files under class prefixes: ch- chart, fv- family view,
   pp- person panel, vw- viewer, ed- editor.
   Breakpoints: phone < 700px, tablet 700-1099px, desktop >= 1100px.
   ========================================================================== */

/* ---------------------------------------------------------------- tokens */
:root {
  /* surfaces and ink */
  --bg: #f3f0e9;
  --surface: #fbf9f4;
  --surface-2: #ebe6db;
  --surface-3: #e2dccf;
  --ink: #1b1814;
  --ink-2: #3a342c;
  --muted: #6b6357;
  --faint: #756c60;              /* 4.5:1 on --bg and --surface: placeholders, "not recorded" text */
  --rule: #dbd3c4;
  --rule-strong: #b8ac97;
  --rule-input: #8f836e;         /* text field borders: 3:1 on --bg and --surface (WCAG 1.4.11) */
  --accent: #9a3412;
  --accent-ink: #ffffff;         /* text on --accent */
  --on-ink: #fbf9f4;             /* text on --ink (primary buttons, pressed chips) */
  --selection: rgba(154, 52, 18, .16);

  /* the four grandparent lines, plus immediate family and unconnected */
  --harkins: #2f7a4f;
  --perret: #8e3f78;
  --dymond: #2f5f9a;
  --henwood: #a35a12;
  --self: #6b6357;
  --none: #7b7266;

  /* status (local fix list, toasts) */
  --error: #b3261e;    --error-bg: #f7e4e0;
  --duplicate: #6f48a8; --duplicate-bg: #ece5f6;
  --check: #85640c;    --check-bg: #f3ead2;
  --ok: #2f7a4f;       --ok-bg: #e2efe6;

  /* floating things */
  --shadow-float: 0 1px 2px rgba(27, 24, 20, .06), 0 14px 36px rgba(27, 24, 20, .12);
  --shadow-bar: 0 1px 0 var(--rule);
  --scrim: rgba(27, 24, 20, .38);
  --viewer-bg: #0c0b0a;          /* the lightbox is near-black in both themes */
  --bar-bg: rgba(243, 240, 233, .92);

  /* type */
  --font: "Libre Franklin", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --text-2xs: 11px;
  --text-xs: 12px;
  --text-sm: 14px;
  --text-base: 16px;
  --text-md: 18px;
  --text-lg: 22px;
  --text-xl: 28px;
  --text-2xl: clamp(30px, 4.2vw, 44px);
  --text-3xl: clamp(38px, 6vw, 72px);
  --leading-tight: 1.08;
  --leading-snug: 1.3;
  --leading: 1.6;
  --tracking-tight: -.022em;
  --tracking-caps: .12em;

  /* spacing scale */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 72px;

  /* stacking */
  --z-bar: 100;
  --z-panel: 60;     /* docked person panel (inside the tree stage) */
  --z-sheet: 200;    /* phone bottom sheet, phone menus */
  --z-viewer: 300;
  --z-dialog: 400;
  --z-toast: 500;

  /* layout */
  --container: 1360px;
  --gutter: 16px;
  --bar-h: 56px;
  --toolbar-h: 52px;
  --panel-w: 420px;
  --tap: 44px;           /* minimum touch target */
  --control-h: 44px;     /* buttons and inputs (40px from tablet up) */
  --control-h-sm: 44px;
  --safe-b: env(safe-area-inset-bottom, 0px);

  /* motion */
  --ease: cubic-bezier(.2, .7, .2, 1);
  --ease-in-out: cubic-bezier(.6, 0, .25, 1);
  --dur-fast: 120ms;
  --dur: 220ms;
  --dur-slow: 380ms;

  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11100e;
    --surface: #1a1815;
    --surface-2: #25221e;
    --surface-3: #2e2a25;
    --ink: #f2ede3;
    --ink-2: #d9d2c5;
    --muted: #a69d8f;
    --faint: #8a8174;
    --rule: #322e28;
    --rule-strong: #4c463d;
    --rule-input: #736b5f;
    --accent: #e58e62;
    --accent-ink: #1b1309;
    --on-ink: #11100e;
    --selection: rgba(229, 142, 98, .22);
    --harkins: #7cc69a;
    --perret: #db96c8;
    --dymond: #8db8ec;
    --henwood: #eaa964;
    --self: #a69d8f;
    --none: #918879;
    --error: #f28a80;    --error-bg: #3a1f1c;
    --duplicate: #bca0ea; --duplicate-bg: #2c2438;
    --check: #ddbf5e;    --check-bg: #332b16;
    --ok: #7cc69a;       --ok-bg: #1d2e23;
    --shadow-float: 0 1px 2px rgba(0, 0, 0, .4), 0 16px 40px rgba(0, 0, 0, .45);
    --scrim: rgba(0, 0, 0, .55);
    --bar-bg: rgba(17, 16, 14, .9);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11100e;
  --surface: #1a1815;
  --surface-2: #25221e;
  --surface-3: #2e2a25;
  --ink: #f2ede3;
  --ink-2: #d9d2c5;
  --muted: #a69d8f;
  --faint: #8a8174;
  --rule: #322e28;
  --rule-strong: #4c463d;
  --rule-input: #736b5f;
  --accent: #e58e62;
  --accent-ink: #1b1309;
  --on-ink: #11100e;
  --selection: rgba(229, 142, 98, .22);
  --harkins: #7cc69a;
  --perret: #db96c8;
  --dymond: #8db8ec;
  --henwood: #eaa964;
  --self: #a69d8f;
  --none: #918879;
  --error: #f28a80;    --error-bg: #3a1f1c;
  --duplicate: #bca0ea; --duplicate-bg: #2c2438;
  --check: #ddbf5e;    --check-bg: #332b16;
  --ok: #7cc69a;       --ok-bg: #1d2e23;
  --shadow-float: 0 1px 2px rgba(0, 0, 0, .4), 0 16px 40px rgba(0, 0, 0, .45);
  --scrim: rgba(0, 0, 0, .55);
  --bar-bg: rgba(17, 16, 14, .9);
  color-scheme: dark;
}

/* tablet and up: roomier gutters and denser controls */
@media (min-width: 700px) {
  :root { --gutter: 24px; --bar-h: 60px; --control-h: 40px; --control-h-sm: 32px; }
}
@media (min-width: 1100px) {
  :root { --gutter: 40px; --bar-h: 64px; --toolbar-h: 56px; }
}

/* ---------------------------------------------------------------- base */
/* square corners everywhere: Mike's rule, enforced */
*, *::before, *::after { border-radius: 0 !important; box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  scroll-padding-top: calc(var(--bar-h) + var(--space-4));
  background: var(--bg);
}
@media (prefers-reduced-motion: no-preference) {
  html { scroll-behavior: smooth; }
}
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: var(--text-base);
  line-height: var(--leading);
  font-weight: 400;
  font-feature-settings: "kern" 1;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
  overflow-x: clip;
}
::selection { background: var(--selection); }
h1, h2, h3, h4, h5, h6 {
  margin: 0;
  font-family: var(--font);
  font-weight: 800;
  line-height: var(--leading-tight);
  letter-spacing: var(--tracking-tight);
  text-wrap: balance;
}
p { margin: 0; text-wrap: pretty; }
img, svg, video, canvas { display: block; max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
button:disabled { cursor: default; }
a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: .18em; }
[hidden] { display: none !important; }
ol, ul { margin: 0; padding: 0; }
.num, .tabular { font-variant-numeric: tabular-nums; }

/* focus: a 2px square accent outline, only for keyboard users */
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.skip-link {
  position: fixed; left: var(--space-3); top: var(--space-3); z-index: var(--z-toast);
  padding: var(--space-2) var(--space-4); background: var(--ink); color: var(--on-ink);
  font-weight: 600; font-size: var(--text-sm); text-decoration: none;
  transform: translateY(-160%);
}
.skip-link:focus-visible { transform: none; }
.sr-only {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.noscript { padding: var(--space-6) var(--gutter); font-size: var(--text-md); }

/* ---------------------------------------------------------------- layout */
.container {
  width: 100%;
  max-width: calc(var(--container) + 2 * var(--gutter));
  margin-inline: auto;
  padding-inline: max(var(--gutter), env(safe-area-inset-left, 0px)) max(var(--gutter), env(safe-area-inset-right, 0px));
}
.muted { color: var(--muted); }
.stack > * + * { margin-top: var(--space-3); }

/* tracked caps label: section kickers, field labels, kinds */
.label {
  font-size: var(--text-2xs);
  font-weight: 600;
  letter-spacing: var(--tracking-caps);
  text-transform: uppercase;
  line-height: 1.3;
  color: var(--muted);
}
.label-lg { font-size: var(--text-xs); }
/* a small square marker in a line color: <span class="marker" style="--lc: var(--harkins)"> */
.marker {
  display: inline-block; flex: none;
  width: 8px; height: 8px;
  background: var(--lc, var(--none));
}
.marker-lg { width: 10px; height: 10px; }

/* hairlines */
.rule { border: 0; border-top: 1px solid var(--rule); margin: 0; }
.rule-strong { border: 0; border-top: 1px solid var(--rule-strong); margin: 0; }
.rule-ink { border: 0; border-top: 2px solid var(--ink); margin: 0; }

/* icons from icon(): 24px grid, stroke currentColor */
.icon { flex: none; width: var(--icon-size, 20px); height: var(--icon-size, 20px); }

/* ---------------------------------------------------------------- buttons */
.btn {
  --btn-bg: var(--surface);
  --btn-fg: var(--ink);
  --btn-bd: var(--rule-strong);
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  min-height: var(--control-h);
  padding: 0 var(--space-4);
  border: 1px solid var(--btn-bd);
  background: var(--btn-bg);
  color: var(--btn-fg);
  font-size: var(--text-sm);
  font-weight: 600;
  line-height: 1.2;
  letter-spacing: .005em;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  transition: background-color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.btn .icon { --icon-size: 18px; }
.btn:hover:not(:disabled) { --btn-bg: var(--surface-2); --btn-bd: var(--ink); }
.btn:active:not(:disabled) { --btn-bg: var(--surface-3); }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .42; }
.btn-primary { --btn-bg: var(--ink); --btn-fg: var(--on-ink); --btn-bd: var(--ink); }
.btn-primary:hover:not(:disabled) { --btn-bg: var(--ink-2); --btn-bd: var(--ink-2); }
.btn-primary:active:not(:disabled) { --btn-bg: var(--ink); }
.btn-accent { --btn-bg: var(--accent); --btn-fg: var(--accent-ink); --btn-bd: var(--accent); }
.btn-accent:hover:not(:disabled) { --btn-bg: var(--accent); --btn-bd: var(--ink); }
.btn-secondary { /* the default look, named for clarity */ }
.btn-ghost { --btn-bg: transparent; --btn-bd: transparent; }
.btn-ghost:hover:not(:disabled) { --btn-bg: var(--surface-2); --btn-bd: transparent; }
.btn-sm { min-height: var(--control-h-sm); padding: 0 var(--space-3); font-size: var(--text-xs); }
.btn-icon {
  width: var(--tap); min-width: var(--tap); min-height: var(--tap); padding: 0;
}
@media (min-width: 700px) {
  .btn-icon { width: var(--control-h); min-width: var(--control-h); min-height: var(--control-h); }
  .btn-icon.btn-sm { width: var(--control-h-sm); min-width: var(--control-h-sm); min-height: var(--control-h-sm); }
}
.btn-block { width: 100%; }
/* a text link styled as a quiet action: "Show in tree ->" */
.link {
  display: inline-flex; align-items: center; gap: 6px;
  color: var(--accent); font-weight: 600; font-size: var(--text-sm);
  text-decoration: none; background: none; border: 0; padding: 0;
  min-height: 28px;
}
.link .icon { --icon-size: 16px; transition: transform var(--dur) var(--ease); }
.link:hover { text-decoration: underline; }
.link:hover .icon-chevron-right { transform: translateX(3px); }

/* ---------------------------------------------------------------- inputs */
.input {
  width: 100%;
  min-height: var(--control-h);
  padding: 0 var(--space-3);
  border: 1px solid var(--rule-input);
  background: var(--surface);
  color: var(--ink);
  font-size: var(--text-base);  /* 16px stops iOS zooming on focus */
  line-height: 1.3;
  appearance: none;
  -webkit-appearance: none;
  transition: border-color var(--dur-fast) var(--ease), background-color var(--dur-fast) var(--ease);
}
.input::placeholder { color: var(--faint); opacity: 1; }
.input:hover { border-color: var(--muted); }
.input:focus { border-color: var(--ink); }
.input:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; }
textarea.input { min-height: 96px; padding: var(--space-2) var(--space-3); resize: vertical; line-height: var(--leading); }
select.input {
  padding-right: 36px;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(-45deg, transparent 50%, var(--muted) 50%);
  background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%;
  background-size: 5px 5px; background-repeat: no-repeat;
}
input[type="search"]::-webkit-search-cancel-button,
input[type="search"]::-webkit-search-decoration { -webkit-appearance: none; appearance: none; }
.field { display: grid; gap: 6px; }
.field > .label { color: var(--ink-2); }
.check { display: inline-flex; align-items: center; gap: var(--space-2); min-height: var(--tap); font-size: var(--text-sm); cursor: pointer; }
.check input { width: 18px; height: 18px; margin: 0; accent-color: var(--ink); }
/* an input with a leading icon: <label class="input-icon"><svg class="icon"/><input class="input"></label> */
.input-icon { position: relative; display: block; }
.input-icon > .icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; --icon-size: 18px; }
.input-icon > .input { padding-left: 40px; }

/* ---------------------------------------------------------------- chips */
.chips { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.chip {
  display: inline-flex; align-items: center; gap: var(--space-2);
  min-height: 34px;
  padding: 0 var(--space-3);
  border: 1px solid var(--rule-strong);
  background: var(--surface);
  color: var(--ink);
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: .02em;
  line-height: 1.2;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
  transition: background-color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.chip .icon { --icon-size: 15px; }
.chip .chip-count { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.chip:hover { border-color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
.chip[aria-pressed="true"] .chip-count { color: inherit; opacity: .7; }
.chip[aria-pressed="true"] .marker { box-shadow: 0 0 0 1px var(--on-ink); }
@media (max-width: 699px) {
  .chip { min-height: var(--tap); padding: 0 14px; font-size: 13px; }
}
/* a static tag: origins, kinds */
.tag {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 8px;
  border: 1px solid var(--rule);
  background: transparent;
  color: var(--ink-2);
  font-size: var(--text-xs);
  font-weight: 500;
  line-height: 1.35;
}

/* ---------------------------------------------------------------- segmented control */
.seg {
  display: inline-flex; flex: none;
  border: 1px solid var(--rule-strong);
  background: var(--surface);
}
.seg > button {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  min-height: calc(var(--control-h) - 2px);
  padding: 0 var(--space-4);
  font-size: var(--text-sm); font-weight: 600;
  color: var(--muted);
  -webkit-tap-highlight-color: transparent;
  transition: background-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.seg > button + button { border-left: 1px solid var(--rule-strong); }
.seg > button .icon { --icon-size: 18px; }
.seg > button:hover { color: var(--ink); background: var(--surface-2); }
.seg > button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.seg > button:focus-visible { outline-offset: -2px; position: relative; z-index: 1; }
.seg-icons > button { width: calc(var(--control-h) - 2px); padding: 0; }
.seg-sm > button { min-height: calc(var(--control-h-sm) - 2px); padding: 0 var(--space-3); font-size: var(--text-xs); }
.seg-sm.seg-icons > button { width: calc(var(--control-h-sm) - 2px); padding: 0; }
@media (max-width: 699px) {
  .seg > button { min-height: var(--tap); }
  .seg-icons > button, .seg-sm.seg-icons > button { width: var(--tap); }
}

/* ---------------------------------------------------------------- avatars */
/* avatar(p, {size}) -> <span class="avatar is-photo|is-mono" style="--av: 40px; --lc: ..."> */
.avatar {
  --av: 40px;
  position: relative;
  display: inline-grid; place-items: center; flex: none;
  width: var(--av); height: var(--av);
  overflow: hidden;
  background: var(--surface-2);
  border: 1px solid var(--rule);
  vertical-align: middle;
}
.avatar.is-photo { background: var(--surface-3); }
.avatar.is-photo img {
  width: 100%; height: 100%;
  object-fit: cover;
  filter: saturate(.92) contrast(1.02);
}
/* the monogram: the line color at low opacity, initials in the line color */
.avatar.is-mono {
  background: color-mix(in srgb, var(--lc, var(--none)) 13%, var(--surface));
  border-color: color-mix(in srgb, var(--lc, var(--none)) 28%, var(--surface));
  color: var(--lc, var(--none));
}
.avatar-initials {
  font-weight: 700;
  font-size: calc(var(--av) * .38);
  letter-spacing: .02em;
  line-height: 1;
  user-select: none;
  font-variant-numeric: lining-nums;
}
.avatar.is-living .avatar-initials { opacity: .85; }
.avatar-xs { --av: 22px; }
.avatar-sm { --av: 32px; }
.avatar-md { --av: 48px; }
.avatar-lg { --av: 64px; }
.avatar-xl { --av: 96px; }
.avatar-xs .avatar-initials { font-size: 9px; letter-spacing: 0; }

/* ---------------------------------------------------------------- top bar */
.topbar {
  position: sticky; top: 0; z-index: var(--z-bar);
  height: calc(var(--bar-h) + env(safe-area-inset-top, 0px));
  padding-top: env(safe-area-inset-top, 0px);
  background: var(--bar-bg);
  -webkit-backdrop-filter: saturate(1.4) blur(14px);
  backdrop-filter: saturate(1.4) blur(14px);
  border-bottom: 1px solid var(--rule);
}
/* full-bleed, with the tree toolbar's gutters, so the two stacked bars share their edges at any width */
.topbar-inner {
  height: var(--bar-h);
  display: flex; align-items: center; gap: var(--space-5);
  padding-inline: max(var(--gutter), env(safe-area-inset-left, 0px)) max(var(--gutter), env(safe-area-inset-right, 0px));
}
.wordmark {
  display: inline-flex; align-items: center; gap: 12px; flex: none;
  min-height: var(--tap);
  color: var(--ink); text-decoration: none;
}
/* the mark: four squares in the four line colors */
.wordmark-mark {
  display: grid; grid-template-columns: 9px 9px; grid-template-rows: 9px 9px; gap: 2px; flex: none;
}
.wordmark-mark > span { background: var(--lc); }
.wordmark-text { display: flex; flex-direction: column; line-height: 1; }
.wordmark-name {
  font-size: 19px; font-weight: 800; letter-spacing: -.03em; line-height: 1;
}
.wordmark-sub {
  margin-top: 4px;
  font-size: 9.5px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--muted);
}
.topnav { display: flex; align-items: stretch; gap: var(--space-1); height: 100%; }
.topnav a {
  position: relative;
  display: inline-flex; align-items: center;
  padding: 0 var(--space-3);
  color: var(--muted);
  font-size: var(--text-sm); font-weight: 600;
  text-decoration: none;
  white-space: nowrap;
  transition: color var(--dur-fast) var(--ease);
}
.topnav a:hover { color: var(--ink); }
.topnav a[aria-current="true"] { color: var(--ink); }
.topnav a::after {
  content: ""; position: absolute; left: var(--space-3); right: var(--space-3); bottom: -1px; height: 2px;
  background: var(--ink); transform: scaleX(0); transform-origin: left; transition: transform var(--dur) var(--ease);
}
.topnav a[aria-current="true"]::after { transform: scaleX(1); }
.topnav .nav-count {
  margin-left: 6px; padding: 1px 5px; font-size: 10px; font-weight: 700; line-height: 1.3;
  background: var(--error); color: var(--surface); font-variant-numeric: tabular-nums;
}
.topbar-search { position: relative; flex: 1 1 auto; max-width: 360px; margin-left: auto; }
.topbar-search .input { min-height: 38px; background: var(--surface); font-size: var(--text-sm); }
.topbar-search .kbd {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  padding: 1px 6px; border: 1px solid var(--rule-strong); color: var(--muted);
  font-size: 11px; font-weight: 600; line-height: 1.4; pointer-events: none;
}
.topbar-search .input:focus ~ .kbd, .topbar-search .input:not(:placeholder-shown) ~ .kbd { display: none; }
.topbar-actions { display: flex; align-items: center; gap: var(--space-2); flex: none; }
.topbar-phone { display: none; }

/* theme toggle: auto / light / dark */
.theme-toggle { background: transparent; }

/* phones: wordmark, search button, menu button */
@media (max-width: 699px) {
  .topbar-inner { gap: var(--space-2); }
  .topnav, .topbar-search, .topbar-actions .theme-toggle { display: none; }
  .topbar-phone { display: flex; align-items: center; gap: 0; margin-left: auto; margin-right: -10px; }
  .wordmark-name { font-size: 18px; }
}
/* tablet: tighter nav */
@media (min-width: 700px) and (max-width: 1099px) {
  .topbar-inner { gap: var(--space-3); }
  .wordmark-sub { display: none; }
  .topnav a { padding: 0 10px; }
  .topnav a::after { left: 10px; right: 10px; }
  .topbar-search { max-width: 240px; }
}
@media (min-width: 700px) and (max-width: 859px) {
  .topbar-search { display: none; }
  .topbar-actions { margin-left: auto; }
  .topbar-phone { display: flex; margin-right: -8px; }
  .topbar-phone [data-action="menu"] { display: none; }
}

/* phone menu: a full-width drop panel under the bar */
.menu-panel {
  position: fixed; left: 0; right: 0; top: calc(var(--bar-h) + env(safe-area-inset-top, 0px));
  z-index: var(--z-sheet);
  max-height: calc(100dvh - var(--bar-h));
  overflow-y: auto;
  background: var(--surface);
  border-bottom: 1px solid var(--rule-strong);
  box-shadow: var(--shadow-float);
  padding: var(--space-2) 0 calc(var(--space-5) + var(--safe-b));
  animation: drop-in var(--dur) var(--ease);
}
.menu-panel nav a {
  display: flex; align-items: center; justify-content: space-between;
  min-height: 56px;
  padding: 0 var(--gutter);
  border-bottom: 1px solid var(--rule);
  font-size: var(--text-md); font-weight: 700; letter-spacing: -.01em;
  text-decoration: none;
}
.menu-panel nav a .icon { color: var(--muted); }
.menu-panel .menu-theme { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); padding: var(--space-4) var(--gutter) 0; }
.scrim {
  position: fixed; inset: 0; z-index: calc(var(--z-sheet) - 1);
  background: var(--scrim);
  animation: fade-in var(--dur) var(--ease);
}
.scrim.is-under-bar { top: calc(var(--bar-h) + env(safe-area-inset-top, 0px)); }

/* ---------------------------------------------------------------- search typeahead */
.typeahead {
  position: absolute; left: 0; right: 0; top: calc(100% + 6px);
  z-index: 2;
  min-width: 340px;
  max-height: min(70vh, 520px);
  overflow-y: auto;
  background: var(--surface);
  border: 1px solid var(--rule-strong);
  box-shadow: var(--shadow-float);
  padding: var(--space-1) 0;
}
.typeahead-head {
  display: flex; justify-content: space-between; padding: var(--space-2) var(--space-3) var(--space-1);
}
.typeahead-item {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: var(--space-3);
  min-height: 52px;
  padding: 6px var(--space-3);
  cursor: pointer;
  border-left: 3px solid transparent;
}
.typeahead-item .ta-name { font-size: var(--text-sm); font-weight: 600; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.typeahead-item .ta-name mark { background: none; color: inherit; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.typeahead-item .ta-rel { font-size: var(--text-xs); color: var(--muted); line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.typeahead-item .ta-years { font-size: var(--text-xs); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.typeahead-item[aria-selected="true"] { background: var(--surface-2); border-left-color: var(--accent); }
.typeahead-empty { padding: var(--space-4) var(--space-3); color: var(--muted); font-size: var(--text-sm); }
/* the last row when more people match: "Show all 35 in Everyone" */
.typeahead-more { color: var(--accent); border-top: 1px solid var(--rule); }
.typeahead-more .ta-name { color: var(--accent); }
.ta-more-icon { display: grid; place-items: center; width: 36px; height: 36px; border: 1px solid var(--rule); color: var(--accent); }

/* phone search: full-width sheet under the bar */
.search-sheet {
  position: fixed; left: 0; right: 0; top: 0;
  z-index: var(--z-sheet);
  height: 100dvh;
  display: flex; flex-direction: column;
  background: var(--bg);
  padding-top: env(safe-area-inset-top, 0px);
  animation: fade-in var(--dur-fast) var(--ease);
}
.search-sheet-bar {
  display: flex; align-items: center; gap: var(--space-2);
  height: var(--bar-h);
  padding: 0 calc(var(--gutter) - 6px) 0 var(--gutter);
  border-bottom: 1px solid var(--rule);
  flex: none;
}
.search-sheet-bar .input-icon { flex: 1; }
.search-sheet .typeahead {
  position: static; min-width: 0; max-height: none; flex: 1;
  border: 0; box-shadow: none; background: transparent; padding: 0 0 var(--safe-b);
}
.search-sheet .typeahead-item { min-height: 60px; padding: 8px var(--gutter); border-bottom: 1px solid var(--rule); }

/* ---------------------------------------------------------------- the tree section shell */
/* #tree fills the viewport under the bar: toolbar on top, then the stage.
   The stage holds #chart-view and #family-view (only the active one is shown)
   and #person-panel (docked right on desktop, an overlay on tablet, a bottom sheet on phones). */
.tree {
  position: relative;
  display: flex; flex-direction: column;
  height: calc(100vh - var(--bar-h));
  height: calc(100svh - var(--bar-h) - env(safe-area-inset-top, 0px));
  min-height: 480px;
  background: var(--bg);
  border-bottom: 1px solid var(--rule-strong);
}
@media (min-width: 1100px) {
  .tree { min-height: 600px; max-height: 1400px; }
}
.tree-toolbar {
  position: relative; z-index: 2;
  display: flex; align-items: center; gap: var(--space-3);
  flex: none;
  min-height: var(--toolbar-h);
  padding: 6px max(var(--gutter), env(safe-area-inset-right, 0px)) 6px max(var(--gutter), env(safe-area-inset-left, 0px));
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}
.tree-toolbar .seg > button { min-height: calc(var(--control-h-sm) + 4px - 2px); }
/* the slot where the active view puts its own controls */
.tree-tools {
  flex: 1 1 auto; min-width: 0;
  display: flex; align-items: center;
  overflow-x: auto; overflow-y: hidden;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.tree-tools::-webkit-scrollbar { display: none; }
.tree-tools.has-more-r { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent); }
.tree-tools.has-more-l { -webkit-mask-image: linear-gradient(to right, transparent, #000 32px); mask-image: linear-gradient(to right, transparent, #000 32px); }
.tree-tools.has-more-l.has-more-r { -webkit-mask-image: linear-gradient(to right, transparent, #000 32px, #000 calc(100% - 32px), transparent); mask-image: linear-gradient(to right, transparent, #000 32px, #000 calc(100% - 32px), transparent); }
.tree-tools-view { display: flex; align-items: center; gap: var(--space-2); flex: none; padding-inline: 2px; }
.tree-tools-view:empty { display: none; }
/* separators and labelled groups for view controls */
.tool-sep { flex: none; width: 1px; align-self: stretch; margin: 6px var(--space-1); background: var(--rule); }
.tool-group { display: inline-flex; align-items: center; gap: var(--space-2); flex: none; }
.tool-group > .label { margin-right: 2px; }
.tree-toolbar-end { display: flex; align-items: center; gap: var(--space-2); flex: none; margin-left: auto; }
.tree-focus-label {
  min-width: 0; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: var(--text-xs); color: var(--muted);
}
.tree-focus-label b { color: var(--ink); font-weight: 600; }
/* below 1360px the chart's controls need the room (the focus column's header already names the person) */
@media (max-width: 1359px) { .tree-focus-label { display: none; } }
/* tablet: the chart's controls need the room, so "Back to Michael" becomes an icon button */
@media (max-width: 1099px) {
  #back-to-root { width: var(--control-h-sm); padding: 0; justify-content: center; }
  #back-to-root .back-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
}
@media (max-width: 699px) {
  .tree { min-height: 440px; }
  #back-to-root { width: var(--tap); padding: 0; }
  #back-to-root .back-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .tree-toolbar { gap: var(--space-2); padding-top: 4px; padding-bottom: 4px; }
  .tree-toolbar .seg > button { min-height: var(--tap); padding: 0 12px; }
}
/* the narrowest phones: the Chart/Family switch drops its icons so the chart's "View" button fits beside it */
@media (max-width: 359px) {
  #view-switch .icon { display: none; }
  .tree-toolbar .seg > button { padding: 0 10px; }
}

/* short screens (landscape phones, small windows): the tree is exactly the viewport under the bar, never taller,
   since swipes inside the tree pan it rather than the page. The chrome tightens to leave the stage ~300px. */
@media (max-height: 520px) {
  :root { --bar-h: 48px; --toolbar-h: 48px; }
  .tree, .tree.tree {
    min-height: 0; max-height: none;
    height: calc(100vh - var(--bar-h));
    height: calc(100svh - var(--bar-h) - env(safe-area-inset-top, 0px));
  }
  .tree-toolbar { min-height: 0; padding-top: 2px; padding-bottom: 2px; }
  .wordmark-sub { display: none; }
  .wordmark-name { font-size: 18px; }
}
/* ...and below desktop width they get the phone's top bar: wordmark, search, menu */
@media (max-height: 520px) and (min-width: 700px) and (max-width: 1099px) {
  .topnav, .topbar-search, .topbar-actions .theme-toggle { display: none; }
  .topbar-phone, .topbar-phone.topbar-phone { display: flex; align-items: center; margin-left: auto; margin-right: -8px; }
  .topbar-phone [data-action="menu"] { display: inline-flex; }
}

.tree-stage {
  position: relative;
  flex: 1 1 auto; min-height: 0;
  display: flex;
  overflow: hidden;
}
.tree-views { position: relative; flex: 1 1 auto; min-width: 0; }
.tree-view { position: absolute; inset: 0; overflow: hidden; }
.tree-view.is-entering { animation: fade-in var(--dur) var(--ease); }

/* quiet placeholder shown until a view module mounts (or if it fails) */
.tree-placeholder {
  height: 100%;
  display: grid; place-content: center; justify-items: center; gap: var(--space-3);
  padding: var(--space-6) var(--gutter);
  text-align: center;
  color: var(--muted);
}
.tree-placeholder .wordmark-mark { transform: scale(1.6); margin-bottom: var(--space-3); opacity: .9; }
.tree-placeholder strong { color: var(--ink); font-size: var(--text-md); font-weight: 700; letter-spacing: -.01em; }
.tree-placeholder p { font-size: var(--text-sm); max-width: 40ch; }

/* the person panel container (its contents are styled in person.css) */
.person-panel {
  position: relative;
  z-index: var(--z-panel);
  display: flex; flex-direction: column;
  background: var(--surface);
  overflow: hidden;
}
/* desktop: docked on the right, slides open by width so the chart keeps working beside it */
@media (min-width: 1100px) {
  .person-panel {
    flex: none;
    width: 0;
    align-items: flex-end;
    border-left: 0 solid var(--rule-strong);
    transition: width var(--dur-slow) var(--ease), border-left-width 0s linear var(--dur-slow);
  }
  .person-panel > * { width: var(--panel-w); min-width: var(--panel-w); }
  .person-panel.is-open { width: var(--panel-w); border-left-width: 1px; transition: width var(--dur-slow) var(--ease); }
}
/* tablet: floats over the right side of the stage */
@media (min-width: 700px) and (max-width: 1099px) {
  .person-panel {
    position: absolute; top: 0; right: 0; bottom: 0;
    width: min(var(--panel-w), 62%);
    border-left: 1px solid var(--rule-strong);
    box-shadow: var(--shadow-float);
    transform: translateX(calc(100% + 24px));
    visibility: hidden;
    transition: transform var(--dur-slow) var(--ease), visibility 0s linear var(--dur-slow);
  }
  .person-panel.is-open { transform: none; visibility: visible; transition: transform var(--dur-slow) var(--ease); }
}
/* phone: a bottom sheet. person.css owns its snap points: set --sheet-y (translateY offset,
   e.g. 47dvh for the half snap) on #person-panel; 0 is fully open (92dvh tall). */
@media (max-width: 699px) {
  .person-panel {
    position: fixed; left: 0; right: 0; bottom: 0;
    z-index: var(--z-sheet);
    height: 92dvh;
    border-top: 1px solid var(--rule-strong);
    box-shadow: var(--shadow-float);
    transform: translateY(105%);
    visibility: hidden;
    padding-bottom: var(--safe-b);
    transition: transform var(--dur-slow) var(--ease), visibility 0s linear var(--dur-slow);
  }
  .person-panel.is-open {
    transform: translateY(var(--sheet-y, 0px));
    visibility: visible;
    transition: transform var(--dur-slow) var(--ease);
  }
}

/* ---------------------------------------------------------------- page sections */
.section { padding-block: var(--space-8); }
.section + .section { border-top: 1px solid var(--rule); }
@media (max-width: 699px) { .section { padding-block: var(--space-7); } }
.section-head {
  display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); align-items: end;
  column-gap: var(--space-7); row-gap: var(--space-4);
  margin-bottom: var(--space-7);
}
.section-kicker {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: var(--space-3);
  padding-top: var(--space-3);
  border-top: 2px solid var(--ink);
}
.section-kicker .section-num { color: var(--ink); font-variant-numeric: tabular-nums; }
.section-title { font-size: var(--text-2xl); font-weight: 800; letter-spacing: -.03em; line-height: 1.02; }
.section-lede { color: var(--muted); font-size: var(--text-md); line-height: 1.5; max-width: 52ch; }
@media (max-width: 899px) {
  .section-head { grid-template-columns: 1fr; margin-bottom: var(--space-6); }
  .section-lede { font-size: var(--text-base); }
}

/* a person link: tiny avatar, name, years */
.plink {
  display: inline-flex; align-items: center; gap: var(--space-2);
  max-width: 100%;
  min-height: 32px;
  padding: 2px 0;
  color: var(--ink);
  font-size: var(--text-sm); font-weight: 600; line-height: 1.25;
  text-align: left;
}
.plink .plink-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 3px; transition: text-decoration-color var(--dur-fast) var(--ease); }
.plink .plink-years { color: var(--muted); font-weight: 400; font-size: var(--text-xs); white-space: nowrap; font-variant-numeric: tabular-nums; }
.plink:hover .plink-name { text-decoration-color: currentColor; }
.plinks { display: flex; flex-wrap: wrap; gap: 2px var(--space-5); }
.plinks-col { display: grid; gap: 2px; }
@media (max-width: 699px) { .plink { min-height: var(--tap); } }

/* ---------------------------------------------------------------- intro + stats (its own section, above Lines) */
.section-intro { padding-bottom: 0; }
.section-intro .intro { margin-bottom: 0; }
.section.section-intro + .section { border-top: 0; }
@media (max-width: 899px) { .section.section-intro + .section { padding-top: var(--space-7); } }
.intro {
  display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); column-gap: var(--space-7); row-gap: var(--space-5);
  align-items: end;
  margin-bottom: var(--space-8);
}
.intro-title { font-size: var(--text-3xl); font-weight: 800; letter-spacing: -.04em; line-height: .98; }
.intro-title span { color: var(--muted); }
.intro-sub { color: var(--ink-2); font-size: var(--text-md); line-height: 1.55; max-width: 48ch; }
.stats {
  grid-column: 1 / -1;
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
  border-top: 1px solid var(--rule-strong);
  border-bottom: 1px solid var(--rule-strong);
}
.stat { padding: var(--space-5) var(--space-5) var(--space-5) 0; }
.stat + .stat { padding-left: var(--space-5); border-left: 1px solid var(--rule); }
.stat-num { display: block; font-size: clamp(30px, 3.4vw, 46px); font-weight: 800; letter-spacing: -.035em; line-height: 1; font-variant-numeric: tabular-nums; }
.stat .label { display: block; margin-top: var(--space-2); }
@media (max-width: 899px) {
  .intro { grid-template-columns: 1fr; margin-bottom: var(--space-7); }
  .stat { padding-right: var(--space-3); }
  .stat + .stat { padding-left: var(--space-4); }
}
@media (max-width: 699px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat { padding: var(--space-4) var(--space-4) var(--space-4) 0; }
  .stat + .stat { padding-left: var(--space-4); }
  .stat:nth-child(odd) { padding-left: 0; border-left: 0; }
  .stat:nth-child(4) { padding-left: var(--space-4); border-left: 1px solid var(--rule); }
  .stat:nth-child(n + 3) { border-top: 1px solid var(--rule); }
  .stat:last-child { grid-column: 1 / -1; }
}

/* ---------------------------------------------------------------- Lines */
.lines-grid {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  column-gap: var(--space-6); row-gap: var(--space-7);
}
@media (max-width: 1099px) { .lines-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: var(--space-6); } }
@media (max-width: 699px) { .lines-grid { grid-template-columns: 1fr; row-gap: var(--space-7); } }
.line-col {
  --lc: var(--none);
  display: grid; grid-template-rows: subgrid; grid-row: span 9; row-gap: var(--space-5);
  align-content: start;
  padding-top: var(--space-4);
  border-top: 4px solid var(--lc);
  min-width: 0;
}
.line-kicker { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); color: var(--lc); }
.line-kicker .label { color: var(--lc); }
.line-head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--space-4); align-items: center; }
.line-name { font-size: var(--text-lg); font-weight: 800; letter-spacing: -.025em; line-height: 1.1; }
.line-name button { text-align: left; }
.line-name button:hover { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
.line-years { margin-top: 4px; color: var(--muted); font-size: var(--text-sm); font-variant-numeric: tabular-nums; }
.line-parents { display: grid; align-content: start; gap: 4px; padding: var(--space-3) 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.line-parents .label { margin-bottom: 2px; }
.line-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; border-bottom: 1px solid var(--rule); }
.line-stat { padding: 0 0 var(--space-3); }
.line-stat:nth-child(n + 3) { padding-top: var(--space-3); border-top: 1px solid var(--rule); }
.line-stat:nth-child(even) { padding-left: var(--space-4); border-left: 1px solid var(--rule); }
.line-stat b { display: block; font-size: var(--text-lg); font-weight: 800; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.line-stat .label { display: block; margin-top: 3px; }
.line-origins { display: flex; flex-wrap: wrap; align-content: start; gap: 6px; }
.line-story { font-size: 15px; line-height: 1.65; color: var(--ink-2); }
.line-story.is-clamped { display: -webkit-box; -webkit-line-clamp: 9; -webkit-box-orient: vertical; overflow: hidden; }
.line-more { justify-self: start; align-self: start; margin-top: calc(var(--space-4) * -1); }
.line-kicker .line-who { color: var(--muted); text-align: right; }
.line-origins:empty, .line-parents:empty, .line-people:empty, .line-more-slot { min-height: 0; }
.line-parents:empty { border: 0; padding: 0; }
.line-people { display: grid; gap: 0; align-content: start; }
.line-people .label { margin-bottom: var(--space-1); }
.line-foot { align-self: end; }

/* ---------------------------------------------------------------- Research next */
.leads { list-style: none; border-top: 1px solid var(--rule-strong); counter-reset: none; }
.lead {
  display: grid; grid-template-columns: 88px minmax(0, 1fr) minmax(0, 300px); column-gap: var(--space-6); row-gap: var(--space-3);
  padding: var(--space-6) 0;
  border-bottom: 1px solid var(--rule);
}
.lead-num { font-size: 44px; font-weight: 800; letter-spacing: -.04em; line-height: .9; color: var(--accent); font-variant-numeric: tabular-nums; }
.lead-title { font-size: var(--text-lg); font-weight: 700; letter-spacing: -.02em; line-height: 1.2; margin-bottom: var(--space-3); }
.lead-body { color: var(--ink-2); max-width: 68ch; line-height: 1.65; }
.lead-people { display: grid; align-content: start; gap: 2px; }
.lead-people .label { margin-bottom: var(--space-1); }
@media (max-width: 1099px) {
  .lead { grid-template-columns: 64px minmax(0, 1fr); }
  .lead-people { grid-column: 2; }
}
@media (max-width: 699px) {
  .lead { grid-template-columns: 1fr; padding: var(--space-5) 0; }
  .lead-num { font-size: 34px; }
  .lead-people { grid-column: 1; }
}

/* ---------------------------------------------------------------- Things to fix (local only) */
.level { --lv: var(--check); --lv-bg: var(--check-bg); }
.level-error { --lv: var(--error); --lv-bg: var(--error-bg); }
.level-duplicate { --lv: var(--duplicate); --lv-bg: var(--duplicate-bg); }
.level-check { --lv: var(--check); --lv-bg: var(--check-bg); }
.fix-filters { margin-bottom: var(--space-6); }
.fix-filters .marker { background: var(--lv, var(--muted)); }
.issues { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: var(--space-6); row-gap: var(--space-6); }
@media (max-width: 899px) { .issues { grid-template-columns: 1fr; } }
.issue {
  display: flex; flex-direction: column; gap: var(--space-3);
  padding-top: var(--space-4);
  border-top: 3px solid var(--lv);
  min-width: 0;
}
.issue-level { display: inline-flex; align-items: center; gap: var(--space-2); color: var(--lv); }
.issue-level .label { color: var(--lv); }
.issue-level .marker { background: var(--lv); }
.issue-title { font-size: var(--text-md); font-weight: 700; letter-spacing: -.015em; line-height: 1.25; }
.issue-body { color: var(--ink-2); font-size: 15px; line-height: 1.6; }
.issue-fix { padding: var(--space-3) var(--space-4); background: var(--lv-bg); border-left: 3px solid var(--lv); font-size: 15px; line-height: 1.55; }
.issue-fix .label { display: block; color: var(--lv); margin-bottom: 4px; }
.fix-empty { color: var(--muted); padding: var(--space-5) 0; }

/* ---------------------------------------------------------------- Everyone */
/* the filter, chips and A-Z: one block, sticky under the top bar on phones (on wider screens only A-Z sticks) */
.everyone-bar { display: contents; }
.everyone-controls {
  display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); align-items: center; gap: var(--space-3) var(--space-5);
  margin-bottom: var(--space-4);
}
.everyone-count { color: var(--muted); font-size: var(--text-sm); font-variant-numeric: tabular-nums; }
.everyone-chips { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-5); margin-bottom: var(--space-5); }
.alpha {
  position: sticky; top: calc(var(--bar-h) + env(safe-area-inset-top, 0px)); z-index: 5;
  display: grid; grid-template-columns: repeat(26, minmax(0, 1fr)); gap: 0;
  margin-bottom: var(--space-6);
  padding: 6px 0;
  background: var(--bar-bg);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
}
.alpha a, .alpha span {
  display: inline-grid; place-items: center;
  min-width: 0; height: 32px;
  font-size: var(--text-xs); font-weight: 700; letter-spacing: .04em;
  text-decoration: none; color: var(--ink);
}
.alpha a:hover { background: var(--ink); color: var(--on-ink); }
.alpha span { color: var(--faint); font-weight: 500; }
@media (max-width: 699px) {
  .everyone-bar {
    display: block;
    position: sticky; top: calc(var(--bar-h) + env(safe-area-inset-top, 0px)); z-index: 5;
    margin: 0 calc(var(--gutter) * -1) var(--space-5);
    padding: var(--space-2) var(--gutter) 0;
    /* opaque: a tall see-through block shows rows ghosting behind the chips and letters */
    background: var(--bg);
    border-bottom: 1px solid var(--rule);
  }
  .everyone-controls { grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-3); margin-bottom: var(--space-2); }
  .everyone-count { font-size: var(--text-xs); text-align: right; white-space: nowrap; }
  /* the chips in one sideways row */
  .everyone-chips {
    flex-wrap: nowrap; gap: var(--space-2); margin: 0 calc(var(--gutter) * -1); padding: 0 var(--gutter) var(--space-2);
    overflow-x: auto; scrollbar-width: none; overscroll-behavior-x: contain;
  }
  .everyone-chips::-webkit-scrollbar { display: none; }
  .everyone-chips .chips { flex-wrap: nowrap; flex: none; }
  .alpha {
    position: static; display: flex; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none;
    margin: 0 calc(var(--gutter) * -1); padding: 0 calc(var(--gutter) - 6px);
    background: transparent; -webkit-backdrop-filter: none; backdrop-filter: none; border-bottom: 0;
  }
  .alpha::-webkit-scrollbar { display: none; }
  .alpha a, .alpha span { min-width: var(--tap); height: var(--tap); flex: none; }
  /* html's scroll-padding already clears the top bar; this clears the sticky filter block */
  .people-groups .sgroup { scroll-margin-top: calc(var(--everyone-bar-h, 160px) + var(--space-2)); }
}
.people-groups { columns: 3 340px; column-gap: var(--space-7); }
.sgroup { break-inside: avoid; margin-bottom: var(--space-6); scroll-margin-top: calc(var(--bar-h) + 64px); }
.sgroup-head {
  display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3);
  padding: 0 var(--space-2) var(--space-2) 0;   /* the count lines up with the rows' years */
  border-bottom: 1px solid var(--ink);
}
.sgroup-name { font-size: var(--text-md); font-weight: 800; letter-spacing: -.02em; }
.sgroup-count { color: var(--muted); font-size: var(--text-xs); font-weight: 600; font-variant-numeric: tabular-nums; }
.prow {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: var(--space-3);
  width: 100%;
  min-height: 52px;
  padding: 7px var(--space-2) 7px 0;
  border-bottom: 1px solid var(--rule);
  text-align: left;
  -webkit-tap-highlight-color: transparent;
  transition: background-color var(--dur-fast) var(--ease);
}
.prow:hover { background: var(--surface-2); }
.prow:hover .prow-name { text-decoration: underline; text-underline-offset: 3px; }
/* both columns are two fixed lines (name / relationship, years / counts), so every row's right edge lines up */
.prow-main, .prow-meta { min-width: 0; display: grid; grid-template-rows: 18px 16px; gap: 1px; align-content: center; }
.prow-name { font-size: var(--text-sm); font-weight: 600; line-height: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow-rel { font-size: var(--text-xs); color: var(--muted); line-height: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow-meta { justify-items: end; }
.prow-years { font-size: var(--text-xs); line-height: 18px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.prow-media { display: flex; gap: var(--space-2); line-height: 16px; color: var(--muted); font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }
.prow-media span { display: inline-flex; align-items: center; gap: 3px; }
.prow-media .icon { --icon-size: 13px; }
.prow.is-direct .prow-name::after { content: ""; display: inline-block; width: 6px; height: 6px; margin-left: 7px; vertical-align: 2px; background: var(--lc); }
.people-empty { display: grid; justify-items: start; gap: var(--space-3); padding: var(--space-6) 0; color: var(--muted); }

/* ---------------------------------------------------------------- footer */
.site-footer {
  padding: var(--space-7) 0 calc(var(--space-7) + var(--safe-b));
  background: var(--surface);
  border-top: 1px solid var(--rule-strong);
  color: var(--muted);
  font-size: var(--text-sm);
  line-height: 1.6;
}
.footer-grid { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 5fr) minmax(0, 3fr); gap: var(--space-6) var(--space-7); }
.footer-grid h2 { margin-bottom: var(--space-2); }
.footer-grid p + p { margin-top: var(--space-3); }
.footer-grid .footer-meta p + p { margin-top: 0; }
.footer-grid code { padding: 1px 6px; background: var(--surface-2); color: var(--ink-2); font-size: 13px; font-family: var(--font); font-weight: 600; }
.footer-brand .wordmark { margin-bottom: var(--space-3); }
.footer-meta { display: grid; align-content: start; gap: var(--space-1); }
.footer-meta h2 { margin-bottom: var(--space-1); }
.footer-meta .link { margin-top: var(--space-3); }
.footer-meta .link { justify-self: start; }
.footer-base {
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: var(--space-2) var(--space-5);
  margin-top: var(--space-7); padding-top: var(--space-4);
  border-top: 1px solid var(--rule);
  font-size: var(--text-xs);
}
@media (max-width: 899px) { .footer-grid { grid-template-columns: 1fr 1fr; } .footer-brand { grid-column: 1 / -1; } }
@media (max-width: 599px) { .footer-grid { grid-template-columns: 1fr; } }

/* ---------------------------------------------------------------- toast */
.toast-stack {
  position: fixed; left: 50%; bottom: calc(var(--space-5) + var(--safe-b)); z-index: var(--z-toast);
  display: grid; gap: var(--space-2); justify-items: center;
  width: max-content; max-width: calc(100vw - 2 * var(--gutter));
  transform: translateX(-50%);
  pointer-events: none;
}
.toast {
  display: flex; align-items: center; gap: var(--space-3);
  max-width: 520px;
  padding: 12px var(--space-4) 12px 14px;
  background: var(--ink);
  color: var(--on-ink);
  border-left: 4px solid var(--rule-strong);
  box-shadow: var(--shadow-float);
  font-size: var(--text-sm); font-weight: 500; line-height: 1.4;
  pointer-events: auto;
  animation: toast-in var(--dur) var(--ease);
}
.toast.is-ok { border-left-color: var(--ok); }
.toast.is-error { border-left-color: var(--error); }
.toast.is-leaving { opacity: 0; transform: translateY(6px); transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease); }
.toast .icon { --icon-size: 18px; }
.toast-close { margin: -10px -10px -10px 0; width: 36px; height: 36px; display: grid; place-items: center; opacity: .7; }
.toast-close:hover { opacity: 1; }
@media (max-width: 699px) { .toast-stack { width: calc(100vw - 2 * var(--gutter)); } .toast { width: 100%; } }

/* ---------------------------------------------------------------- touch screens */
/* Any coarse pointer (phones in landscape, tablets, touch laptops) gets 44px targets, whatever the width.
   The chart's own rows and expand buttons use the same query in chart.css. */
@media (pointer: coarse) {
  :root { --control-h: var(--tap); --control-h-sm: var(--tap); }
  .btn-sm, .topbar .btn-icon { min-height: var(--tap); }
  .btn-icon, .btn-icon.btn-sm { width: var(--tap); min-width: var(--tap); min-height: var(--tap); }
  #back-to-root { min-width: var(--tap); min-height: var(--tap); }
  .seg > button, .seg-sm > button, .tree-toolbar .seg > button, #view-switch button, .theme-toggle button { min-height: var(--tap); min-width: var(--tap); }
  .seg-icons > button, .seg-sm.seg-icons > button { width: var(--tap); }
  .chip, .plink, .link { min-height: var(--tap); }
  .topbar-search .input { min-height: var(--tap); }
  .toast-close { width: var(--tap); height: var(--tap); }
  .tree-toolbar { padding-top: 2px; padding-bottom: 2px; }
}

/* ---------------------------------------------------------------- motion */
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes drop-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
@keyframes toast-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes rise-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    transition-delay: 0s !important;
    scroll-behavior: auto !important;
  }
}

/* ---------------------------------------------------------------- print */
@media print {
  :root { --bg: #fff; --surface: #fff; --surface-2: #f3f3f3; --ink: #000; --ink-2: #222; --muted: #555; --rule: #ccc; --rule-strong: #999; color-scheme: light; }
  body { background: #fff; font-size: 11pt; }
  .topbar, .tree-toolbar, .skip-link, .toast-stack, .alpha, .everyone-controls, .everyone-chips, .fix-filters,
  .line-foot, .line-more, .footer-meta .link, .menu-panel, .scrim, .search-sheet { display: none !important; }
  .tree { height: auto; min-height: 0; max-height: none; border: 0; page-break-after: always; }
  .tree-stage { overflow: visible; }
  .tree-view { position: relative; }
  .person-panel { display: none !important; }
  .section { padding-block: 24pt; break-inside: auto; }
  .line-col, .lead, .issue, .sgroup, .prow { break-inside: avoid; }
  .line-story.is-clamped { display: block; -webkit-line-clamp: unset; overflow: visible; }
  .people-groups { columns: 2; }
  a[href^="http"]::after { content: " (" attr(href) ")"; font-size: 9pt; color: #555; }
}

/* ==========================================================================
   chart.css: the pedigree chart (chart.js). Prefix ch-.
   The viewport is clipped; .ch-stage is the transformed plane (translate + scale, origin 0 0) holding the
   connector SVG and the absolutely positioned cards. Square corners, straight rules, tokens only.
   ========================================================================== */

.ch-root {
  /* order of emphasis: cards, then connectors (>= 3:1 on --bg), then the faint graph paper */
  --ch-grid: color-mix(in srgb, var(--rule) 30%, transparent);
  --ch-edge: color-mix(in srgb, var(--muted) 55%, var(--rule-strong));   /* about 3.2:1 light, 4.2:1 dark */
  --ch-card-bd: var(--rule);
  position: relative;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  isolation: isolate;
}

/* ---------------------------------------------------------------- viewport + stage */
.ch-viewport {
  position: absolute; inset: 0;
  overflow: hidden;
  touch-action: none;
  cursor: grab;
  user-select: none; -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  /* faint graph paper that pans and scales with the chart */
  background-image:
    linear-gradient(to right, var(--ch-grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--ch-grid) 1px, transparent 1px);
  background-size: 32px 32px;
}
.ch-root.is-panning .ch-viewport { cursor: grabbing; }
.ch-stage {
  position: absolute; left: 0; top: 0;
  width: 0; height: 0;
  transform-origin: 0 0;
}
.ch-root.is-moving .ch-stage, .ch-root.is-panning .ch-stage { will-change: transform; }
.ch-svg { position: absolute; left: 0; top: 0; width: 1px; height: 1px; max-width: none; overflow: visible; pointer-events: none; }
.ch-nodes { position: absolute; left: 0; top: 0; }

/* ---------------------------------------------------------------- connectors */
.ch-edge {
  fill: none;
  stroke: var(--ch-edge);
  stroke-width: 1.5;
  stroke-linecap: square;
  stroke-linejoin: miter;
  transition: stroke var(--dur) var(--ease), opacity var(--dur) var(--ease);
}
.ch-edge-sib { stroke-width: 1.25; }
.ch-edge-ph { stroke-dasharray: 3 3; }
.ch-traces path {
  fill: none;
  stroke: var(--ink);
  stroke-width: 2;
  stroke-linecap: square;
  stroke-linejoin: miter;
}
.ch-traces .ch-trace-sib { stroke-width: 1.5; }
.ch-root.is-tracing .ch-edge { opacity: .38; }
/* legend lines: the chosen lines' connectors take their color, the rest fade */
.ch-root.has-lines .ch-edge { opacity: .28; }
.ch-root.has-lines .ch-edge.is-lit { opacity: 1; stroke: var(--hl, var(--lc)); stroke-width: 2; }
.ch-root.has-lines .ch-edge-sib.is-lit { stroke-width: 1.25; }

/* ---------------------------------------------------------------- nodes */
.ch-node {
  position: absolute; left: 0; top: 0;
  width: 216px; height: 64px;
  transition: opacity var(--dur) var(--ease);
}
/* cards on their way in or out take no clicks: arriving ones start invisible, tucked under other cards */
.ch-node.is-leaving, .ch-node.is-arriving { pointer-events: none; }
.ch-root.has-lines .ch-node:not(.is-lit) { opacity: .32; }
.ch-root.has-lines .ch-node.ch-ph { opacity: .32; }
.ch-root.is-animating .ch-node { transition: none; }

/* the card itself: flat surface, hairline, a straight line-color rule on the left */
.ch-card {
  position: relative;
  display: flex; align-items: center;
  width: 100%; height: 100%;
  margin: 0; padding: 0 0 0 3px;
  border: 1px solid var(--ch-card-bd);
  background: var(--surface);
  color: var(--ink);
  font: inherit;
  text-align: left;
  cursor: pointer;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  transition: border-color var(--dur-fast) var(--ease), background-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
}
.ch-card::before {
  content: "";
  position: absolute; left: -1px; top: -1px; bottom: -1px;
  width: 3px;
  background: var(--lc, var(--none));
}
.ch-card:hover { border-color: var(--rule-strong); background: color-mix(in srgb, var(--surface) 70%, var(--surface-2)); }
.ch-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ch-node.is-selected .ch-card {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
  border-color: var(--rule-strong);
}
.ch-node.is-trace .ch-card { border-color: var(--ink-2); }

/* photo or monogram, flush with the card's edges */
.ch-card .ch-av {
  border: 0;
  border-right: 1px solid var(--ch-card-bd);
  align-self: stretch;
  height: auto;
}
.ch-card .ch-av.is-mono { border-right-color: color-mix(in srgb, var(--lc, var(--none)) 22%, var(--surface)); }
/* name, years, birthplace. A name may take two lines; the lines that no longer fit the card's height wrap
   into a second, clipped column, so a two-line name drops the birthplace and never the years. */
.ch-text {
  display: flex; flex-flow: column wrap; justify-content: center; align-content: flex-start;
  column-gap: 64px;        /* pushes the clipped column well past the padding */
  align-self: stretch;
  min-width: 0; flex: 1 1 auto;
  overflow: hidden;
  padding: 0 12px 0 11px;
}
.ch-text > *, .ch-direct .ch-meta > * { flex: none; width: 100%; }
.ch-name {
  display: block;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: 13.5px; font-weight: 600; line-height: 1.25;
  letter-spacing: -.005em;
  color: var(--ink);
}
.ch-direct .ch-text .ch-name, .ch-focus .ch-name {
  white-space: normal; overflow-wrap: break-word;
  display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical;
}
.ch-direct .ch-text .ch-name { margin-bottom: 1px; }
.ch-meta {
  display: block;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: var(--text-xs); line-height: 1.35;
  color: var(--muted);
}
.ch-direct .ch-meta { display: contents; }
.ch-years {
  font-variant-numeric: tabular-nums;
  color: var(--ink-2);
  font-weight: 500;
}
.ch-meta .ch-place, .ch-meta .ch-years { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ch-meta .ch-years { font-size: var(--text-xs); line-height: 1.35; }
.ch-meta .ch-place { font-size: var(--text-xs); line-height: 1.35; color: var(--muted); }
.ch-rel {
  display: block;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  margin-bottom: 2px;
  font-size: 10.5px; font-weight: 600; line-height: 1.2;
  letter-spacing: .07em; text-transform: uppercase;
  color: var(--lc, var(--muted));
}

/* the focus: bigger, a heavier rule, an ink hairline */
.ch-focus .ch-card {
  padding-left: 5px;
  border-color: var(--rule-strong);
  background: var(--surface);
  box-shadow: 0 2px 0 var(--rule);
}
.ch-focus .ch-card::before { width: 5px; }
.ch-focus .ch-text { padding-left: 13px; row-gap: 2px; }
.ch-focus .ch-name { font-size: 15.5px; font-weight: 700; line-height: 1.2; letter-spacing: -.012em; }
/* years and birthplace share one line on the focus card, so a two-line name still fits */
.ch-focus .ch-meta { font-size: var(--text-xs); }
.ch-focus .ch-meta .ch-years, .ch-focus .ch-meta .ch-place { display: inline; }
.ch-focus .ch-meta .ch-place { font-size: var(--text-xs); }
.ch-focus .ch-meta .ch-years + .ch-place::before { content: " · "; color: var(--faint); }

/* slim rows: siblings, many children, spouses */
.ch-row .ch-card, .ch-spouse .ch-card {
  gap: 8px;
  padding: 0 10px 0 6px;
  background: color-mix(in srgb, var(--surface) 82%, var(--bg));
}
.ch-row .ch-card::before { width: 2px; background: color-mix(in srgb, var(--lc, var(--none)) 62%, transparent); }
.ch-row .ch-av, .ch-spouse .ch-av { border: 1px solid var(--rule); align-self: center; height: var(--av); }
.ch-row .ch-av.is-mono, .ch-spouse .ch-av.is-mono { border-color: color-mix(in srgb, var(--lc, var(--none)) 28%, var(--surface)); }
.ch-row .ch-name, .ch-spouse .ch-name {
  flex: 1 1 auto; min-width: 0;
  font-size: 12.5px; font-weight: 500; color: var(--ink-2);
}
.ch-row .ch-years, .ch-spouse .ch-marr {
  flex: none;
  font-size: 11.5px; font-weight: 500; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.ch-row .ch-card:hover .ch-name { color: var(--ink); }
/* 22px row squares: a plain tint or the photo; initials would be unreadably small */
.ch-row .avatar-initials, .ch-spouse .avatar-initials { display: none; }

/* spouse rows are part of the focus card: same surface and frame, no gap, a hairline between, and a
   "WIFE" / "HUSBAND" label; the sibling rows below start after a clear gap */
.ch-spouse .ch-card {
  gap: 7px;
  background: var(--surface);
  padding-left: 12px;
  border-color: var(--rule-strong);
  border-top: 1px solid var(--rule);
  box-shadow: 0 2px 0 var(--rule);
}
.ch-spouse .ch-card::before { width: 5px; background: var(--focus-lc, var(--rule-strong)); }
.ch-spouse .ch-role { flex: none; font-size: 10px; letter-spacing: .1em; color: var(--muted); }
.ch-spouse .ch-name { font-weight: 600; color: var(--ink); }
.ch-spouse .ch-marr { font-size: 11.5px; font-weight: 500; color: var(--muted); }

/* "+6 more siblings" / "Show fewer" */
.ch-more .ch-card {
  gap: 8px;
  padding: 0 10px;
  border-style: dashed;
  border-color: var(--rule-strong);
  background: transparent;
  color: var(--muted);
}
.ch-more .ch-card::before { display: none; }
.ch-more .ch-card .icon { --icon-size: 14px; color: var(--lc, var(--muted)); }
.ch-more .ch-name { font-size: 12px; font-weight: 600; color: var(--ink-2); letter-spacing: .01em; }
.ch-more .ch-card:hover { background: var(--surface); border-style: solid; }

/* children of the focus: regular cards on the left */
.ch-child.ch-row .ch-card { background: var(--surface); }

/* unknown parent: a dashed hairline, nothing invented */
.ch-ph .ch-card {
  cursor: default;
  border: 1px dashed color-mix(in srgb, var(--rule-strong) 70%, var(--muted));
  background: color-mix(in srgb, var(--bg) 60%, transparent);
  padding: 0 12px 0 0;
}
.ch-ph .ch-card::before { display: none; }
.ch-ph .ch-card:hover { background: color-mix(in srgb, var(--bg) 60%, transparent); }
.ch-ph-mark {
  display: grid; place-items: center; flex: none;
  width: 62px; align-self: stretch;
  border-right: 1px dashed var(--rule);
  font-size: 18px; font-weight: 600; color: var(--faint);
}
.ch-ph .ch-name { color: var(--muted); font-weight: 600; }
.ch-ph .ch-meta { color: var(--faint); font-size: var(--text-xs); }

/* living people on the public page: a quieter card */
.ch-node.is-living .ch-name { color: var(--ink-2); }
.ch-node.is-living .ch-years { color: var(--muted); font-weight: 400; font-style: italic; }

/* expand / collapse: a square tab off the right edge of a card at the chart's edge */
.ch-expand {
  position: absolute;
  top: 50%; right: -32px;
  width: 26px; height: 26px;
  margin-top: -13px;
  display: grid; place-items: center;
  padding: 0;
  border: 1px solid var(--rule-strong);
  background: var(--surface);
  color: var(--ink-2);
  cursor: pointer;
  transition: background-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
}
.ch-expand::before {
  /* a short stub joining the tab to the card */
  content: "";
  position: absolute; right: 100%; top: 50%;
  width: 6px; height: 1px;
  background: var(--rule-strong);
}
.ch-expand .icon { --icon-size: 16px; }
.ch-expand:hover { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.ch-expand:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* a bigger hit area on touch screens without changing the look */
.ch-expand::after { content: ""; position: absolute; inset: -9px; }

/* ---------------------------------------------------------------- generation labels */
.ch-header {
  position: absolute; left: 0; right: 0; top: 0;
  height: 30px;
  z-index: 3;
  pointer-events: none;
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  border-bottom: 1px solid var(--rule);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  /* not for layout: chart.js reads these to keep labels and the first view clear of a notch */
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}
.ch-col-label {
  position: absolute; left: 0; top: 0;
  height: 30px;
  display: flex; align-items: center;
  padding-left: 1px;
  overflow: hidden;
  color: var(--muted);
}
.ch-col-text { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
/* a long name in a narrow column ("2nd great-" / "grandparents") */
.ch-col-label.is-2l .ch-col-text { white-space: normal; line-height: 1.1; }
.ch-col-label.is-focus { color: var(--ink); }
.ch-col-label::before {
  content: "";
  flex: none;
  width: 6px; height: 6px; margin-right: 7px;
  background: var(--rule-strong);
}
.ch-col-label.is-focus::before { background: var(--accent); }
.ch-col-probe { visibility: hidden; width: auto; white-space: nowrap; }
.ch-col-probe .ch-col-text { overflow: visible; }

/* ---------------------------------------------------------------- legend (right end of the label strip) */
.ch-legend {
  position: absolute; top: 0; right: 0;
  z-index: 4;
  height: 30px;
  display: flex; align-items: stretch;
  background: var(--surface);
  border-left: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
}
.ch-legend-items { display: flex; align-items: stretch; padding: 0 2px 0 12px; }
.ch-legend-label { align-self: center; margin-right: 6px; flex: none; }
.ch-legend-item {
  position: relative;
  display: inline-flex; align-items: center; gap: 7px; flex: none;
  min-height: 0;
  padding: 0 10px;
  border: 0;
  background: transparent;
  color: var(--ink-2);
  font: inherit; font-size: var(--text-xs); font-weight: 600;
  cursor: pointer;
  transition: background-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.ch-legend-item:hover { background: var(--surface-2); color: var(--ink); }
.ch-legend-item .marker { width: 9px; height: 9px; }
/* on: a tint and a straight rule in the line's color along the bottom */
.ch-legend-item[aria-pressed="true"] { background: color-mix(in srgb, var(--lc) 12%, var(--surface)); color: var(--ink); }
.ch-legend-item[aria-pressed="true"]::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--lc);
}
.ch-legend-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

/* folded: one "Lines" button; the toggles drop down under the strip */
.ch-legend-toggle {
  display: none; align-items: center; gap: 8px;
  padding: 0 10px 0 12px;
  border: 0; background: transparent;
  color: var(--ink-2);
  font: inherit; font-size: var(--text-xs); font-weight: 600;
  cursor: pointer;
}
.ch-legend-toggle:hover { background: var(--surface-2); color: var(--ink); }
.ch-legend-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.ch-legend-toggle .icon { --icon-size: 14px; transition: transform var(--dur-fast) var(--ease); }
.ch-legend.is-open .ch-legend-toggle .icon { transform: rotate(180deg); }
.ch-legend-toggle.is-on { color: var(--ink); }
.ch-legend-swatches { display: grid; grid-template-columns: repeat(2, 5px); gap: 1px; }
.ch-legend-swatches .marker { width: 5px; height: 5px; }
.ch-legend.is-compact .ch-legend-toggle { display: inline-flex; }
.ch-legend.is-compact .ch-legend-items {
  display: none;
  position: absolute; top: 100%; right: -1px;
  flex-direction: column; align-items: stretch;
  min-width: 190px;
  margin-top: 1px; padding: 4px;
  background: var(--surface);
  border: 1px solid var(--rule-strong);
  box-shadow: var(--shadow-float);
}
.ch-legend.is-compact.is-open .ch-legend-items { display: flex; }
.ch-legend.is-compact .ch-legend-label { display: none; }
.ch-legend.is-compact .ch-legend-item { min-height: 40px; padding: 0 12px; justify-content: flex-start; }
.ch-legend.is-compact .ch-legend-item[aria-pressed="true"]::after { left: 0; right: auto; top: 0; bottom: 0; width: 3px; height: auto; }

/* ---------------------------------------------------------------- first-time hint */
.ch-hint {
  position: absolute; left: calc(var(--gutter) + env(safe-area-inset-left, 0px)); bottom: calc(16px + var(--safe-b, 0px));
  z-index: 3;
  max-width: calc(100% - 2 * var(--gutter));
  padding: 7px 12px;
  background: var(--surface);
  border: 1px solid var(--rule);
  box-shadow: var(--shadow-float);
  font-size: var(--text-xs); line-height: 1.35; color: var(--ink-2);
  pointer-events: none;
  transition: opacity var(--dur-slow) var(--ease), visibility 0s linear 0s;
}
.ch-hint.is-gone { opacity: 0; visibility: hidden; transition: opacity var(--dur-slow) var(--ease), visibility 0s linear var(--dur-slow); }

/* ---------------------------------------------------------------- toolbar controls (in #chart-tools) */
.ch-toggle[aria-pressed="true"] { --btn-bg: var(--ink); --btn-fg: var(--on-ink); --btn-bd: var(--ink); }
.ch-toggle[aria-pressed="true"]:hover:not(:disabled) { --btn-bg: var(--ink-2); --btn-bd: var(--ink-2); }
.ch-toggle .icon { --icon-size: 16px; }
.ch-zoom { gap: 4px; }
.ch-zoom-label {
  min-width: 52px;
  padding: 0 6px;
  font-variant-numeric: tabular-nums;
  color: var(--muted);
}
.ch-zoom-label:hover { color: var(--ink); }
.ch-gens > button { min-width: 34px; font-variant-numeric: tabular-nums; }
/* the tools sit inline in the toolbar; on phones they fold behind "View" (chart.js positions the panel) */
.ch-view-btn { display: none; }
.ch-view-btn .icon { --icon-size: 16px; transition: transform var(--dur-fast) var(--ease); }
.ch-view-btn[aria-expanded="true"] .icon { transform: rotate(180deg); }
.ch-tools-pop { display: contents; }

/* ---------------------------------------------------------------- breakpoints */
@media (max-width: 1099px) {
  .ch-tools-label, .ch-zoom-label { display: none; }
}
@media (max-width: 699px) {
  .ch-hint { left: 16px; max-width: calc(100% - 32px); }
  .ch-view-btn { display: inline-flex; gap: 6px; }
  .ch-tools-pop {
    display: none;
    position: fixed; z-index: var(--z-sheet);
    flex-direction: column; align-items: stretch; gap: 12px;
    width: min(300px, calc(100vw - 16px));
    padding: 14px;
    background: var(--surface);
    border: 1px solid var(--rule-strong);
    box-shadow: var(--shadow-float);
  }
  .ch-tools-pop.is-open { display: flex; }
  .ch-tools-pop .tool-sep { display: none; }
  .ch-tools-pop .tool-group { display: flex; flex-direction: column; align-items: stretch; gap: 6px; }
  .ch-tools-pop .ch-tools-label { display: block; }
  .ch-tools-pop .ch-gens { display: flex; }
  .ch-tools-pop .ch-gens > button { flex: 1 1 0; }
  .ch-tools-pop .ch-toggle { justify-content: center; }
  .ch-tools-pop .ch-zoom { flex-direction: row; justify-content: space-between; }
}

/* touch: bigger expand tabs; each slim row's hit area fills the gap to its neighbours */
@media (pointer: coarse) {
  .ch-expand { width: 34px; height: 34px; margin-top: -17px; right: -40px; }
  .ch-expand::before { width: 6px; }
  .ch-row::before, .ch-more::before {
    content: ""; position: absolute; left: 0; right: 0; top: -3px; bottom: -3px;
  }
  /* the line legend sits in the 30px label strip: its hit areas reach 14px down into the chart (44px in all) */
  .ch-legend-toggle, .ch-legend-item { position: relative; }
  .ch-legend-toggle::before, .ch-legend-item::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; bottom: -14px;
  }
}
/* touch tablets: pinch zooms, so the zoom buttons give their room to Fit and Center (which otherwise scroll off) */
@media (pointer: coarse) and (min-width: 700px) and (max-width: 1099px) {
  .ch-zoom > button[aria-label="Zoom in"], .ch-zoom > button[aria-label="Zoom out"] { display: none; }
  #chart-tools .tool-sep { display: none; }
}

/* ---------------------------------------------------------------- reduced motion + print */
@media (prefers-reduced-motion: reduce) {
  .ch-node, .ch-edge, .ch-card { transition: none; }
}
@media print {
  .ch-legend, .ch-expand, .ch-hint { display: none; }
  .ch-viewport { background: none; }
}

/* ==========================================================================
   family.css: the Family view (family.js), prefix fv-
   A vertical mini-tree sized by its own width (container queries on .fv), so it
   works in a phone, beside the docked person panel and centered in a wide stage.
   ========================================================================== */

.fv {
  position: relative;
  height: 100%;
  container: fv / inline-size;
  background: var(--bg);
}
/* the measurements live on both children of .fv, so the outgoing copy in the overlay keeps them */
.fv-scroll, .fv-overlay {
  --fv-gap: 12px;          /* between the two halves (couples, parents); the connectors depend on it */
  --fv-pair: 4px;          /* between the two people of a couple */
  --fv-pad-l: max(var(--gutter), env(safe-area-inset-left, 0px));
  --fv-pad-r: max(var(--gutter), env(safe-area-inset-right, 0px));
  --fv-line: 1.5px;        /* connector weight */
}
.fv-scroll {
  position: absolute; inset: 0;
  touch-action: manipulation;        /* no double-tap zoom anywhere in the view */
  overflow-x: hidden; overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}
.fv-overlay {
  position: absolute; inset: 0; z-index: 5;
  overflow: hidden;
  pointer-events: none;
}
.fv-ghost { position: absolute; margin: 0; }
.fv-ghost .fv-card { transition: none; }

.fv-inner {
  width: 100%;
  max-width: calc(720px + var(--fv-pad-l) + var(--fv-pad-r));
  margin-inline: auto;
  padding: var(--space-3) var(--fv-pad-r) calc(var(--space-7) + var(--safe-b)) var(--fv-pad-l);
}

/* ---------------------------------------------------------------- breadcrumbs */
.fv-crumbs {
  margin: calc(-1 * var(--space-2)) 0 var(--space-2);
  overflow-x: auto; overflow-y: hidden;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-x: contain;
}
.fv-crumbs.is-overflow {
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 28px);
  mask-image: linear-gradient(90deg, transparent 0, #000 28px);
}
.fv-crumbs::-webkit-scrollbar { display: none; }
.fv-crumbs-list {
  display: flex; align-items: center; width: max-content;
  min-width: 100%; justify-content: flex-start;
  list-style: none;
  margin-left: -8px;       /* the first avatar lines up with the cards below */
}
.fv-crumb { display: flex; align-items: center; flex: none; }
.fv-crumb-btn, .fv-crumb-here {
  display: inline-flex; align-items: center; gap: 7px;
  min-height: var(--tap);
  padding: 0 8px;
  font-size: 13px; font-weight: 500; line-height: 1.2;
  white-space: nowrap;
  color: var(--muted);
}
.fv-crumb-btn {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: color var(--dur-fast) var(--ease), background-color var(--dur-fast) var(--ease);
}
@media (hover: hover) { .fv-crumb-btn:hover { color: var(--ink); background: var(--surface-2); } }
.fv-crumb-btn:active { background: var(--surface-3); }
.fv-crumb-btn:focus-visible { outline-offset: -2px; }
.fv-crumb-here { color: var(--ink); font-weight: 600; }
.fv-crumb-sep { display: inline-flex; color: var(--faint); }
.fv-crumbs .avatar-initials { font-size: 9px; letter-spacing: 0; }
.fv-crumb-btn .avatar { opacity: .85; }

/* ---------------------------------------------------------------- rows and connectors */
.fv-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: var(--fv-gap);
}
.fv-gp { align-items: stretch; }
.fv-couple { display: flex; flex-direction: column; min-width: 0; }
.fv-couple-label {
  display: block;
  margin-bottom: 6px;
  text-align: center;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.fv-couple-cards {
  flex: 1 1 auto;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: var(--fv-pair);
}

/* elbow connector: an arm down from the middle of each half, a bar between them, and a stem down to the
   middle of the row below. Square, hairline weight. */
.fv-join {
  --arm: calc((100% - var(--fv-pair)) / 4);
  position: relative;
  height: 24px;
  pointer-events: none;
}
.fv-join-wide { --arm: calc((100% - var(--fv-gap)) / 4); }
.fv-join::before, .fv-join::after {
  content: "";
  position: absolute;
  border: 0 solid var(--rule-strong);
}
.fv-join::before {
  top: 0; height: 12px;
  left: var(--arm); right: var(--arm);
  border-width: 0 var(--fv-line) var(--fv-line);
}
.fv-join::after {
  top: 12px; bottom: 0;
  left: calc(50% - var(--fv-line) / 2);
  border-left-width: var(--fv-line);
}
.fv-join.is-dashed::before, .fv-join.is-dashed::after { border-style: dashed; border-color: var(--rule); }

/* ---------------------------------------------------------------- cards */
.fv-card {
  position: relative;
  display: flex;
  width: 100%; min-width: 0;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-top: 3px solid var(--lc, var(--none));
  color: var(--ink);
  text-align: left;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  user-select: none; -webkit-user-select: none;
  transition: background-color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
}
@media (hover: hover) {
  .fv-card:hover {
    background: color-mix(in srgb, var(--surface-2) 55%, var(--surface));
    border-color: var(--rule-strong);
    border-top-color: var(--lc, var(--none));
  }
    }
.fv-card:active { background: var(--surface-2); }
.fv-card.is-moving { z-index: 3; }
.fv-text { display: flex; flex-direction: column; min-width: 0; }
.fv-name, .fv-surname, .fv-years { display: block; max-width: 100%; }
.fv-years { color: var(--muted); font-variant-numeric: tabular-nums; }

/* small: grandparents, siblings, children */
.fv-sm {
